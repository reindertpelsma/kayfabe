# cargo-mutants configuration.
#
# ★ WHY THE EXCLUSIONS EXIST — measured, 2026-07-27.
#
# A completed run (1755 mutants, 3 h, alone on the bench box) scored
#
#     131 missed, 1263 caught, 359 unviable, 2 timeouts  =>  90.60 %
#
# which FAILS CI's 91 % threshold. But **63 of the 131 misses (48 %) were in test
# scaffolding** — 50 in `crates/kayfabe-mocks/src/lib.rs`, 9 in `tests/src/lib.rs`,
# 4 in `tests/src/teardown.rs`. Excluding those, the score is ≈ 94.9 %.
#
# So the raw gate failed while the real coverage passed, purely because the
# denominator included **the instruments themselves**. Mutating a mock is
# meaningless: no production test asserts a mock's internal behaviour, because the
# mock *is* the thing doing the asserting. A surviving mock mutant is not a
# coverage hole, it is a category error.
#
# These files are still fully *compiled and run* — they are only excluded from
# being **mutation targets**. The tests that live in them keep catching mutants
# everywhere else.
exclude_globs = [
    # The mock backends: `MockVmm`, `HostLedger`, the mock RM/isolate. Instruments.
    "crates/kayfabe-mocks/**",
    # The shared test library: scenario builders, `Guarded<D>`, `ResidueClaim`,
    # `legal_order`, the conservation auditors. Also instruments.
    "tests/src/**",
]

# ★ READING A RUN: cargo-mutants prints a line ONLY for MISSED and TIMEOUT.
# There is **no CAUGHT line and no UNVIABLE line** — both exist only in the final
# summary. Grepping a partial log for "^CAUGHT" returns 0 no matter how healthy
# the run is; that mistake cost three hours of misdiagnosis. Never judge a run
# before its summary line.
