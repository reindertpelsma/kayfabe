#
# The memory-safety perimeter (docs/OWNER_RULINGS.md §R; docs/design/V3_SEC_PERIMETER.md).
#
# A file named `*_unsafe.rs` is the audit perimeter, and the one list of crates that may hold
# `unsafe` is scripts/ci/perimeter.toml. This workflow is separate from ci.yml on purpose: the
# lanes that edit ci.yml's regions see no conflict, and each job here can be made a required
# check on its own.
#
# Jobs:
# - perimeter: the tokenizer (G3: L0-L6, L10), manifests and the resolved graph (G4: M1-M9),
#   the size ratchet (G6) with L8 and L9, the export table (G5) and kf3.h's prototypes (K4),
#   each with its known-positive fixtures run first.
# - compiler-location (G1): every repository unit compiled with `unsafe_code` forced on, and
#   every diagnostic located inside the unit's own class U crate's perimeter.
# - kf3-c (G7, rule d): kf3.c compiled against a signature-checked QEMU 10.2.4 with -Werror,
#   clang's analyzer, the link closure and the depfile; known positives K1-K3 every run.
#   Tier 2 (the whole kf3 QEMU binary) is kf3-link.yml, nightly.
#
# ★ No job here sets a compiler-flag variable in an `env:` mapping: the manifest gate (M4)
# reads this file too, and would fail it.

name: perimeter

on:
  push:
  pull_request:
    branches: [master]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  perimeter:
    name: perimeter — tokenizer, manifests, metadata (OWNER_RULINGS §R)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.0   # pinned with rust-toolchain.toml and scripts/ci/perimeter.toml
          # the export generator documents kf-qemu for both targets of its matrix; kf-qemu's
          # kf-gop-image build script builds the GOP driver for the matching UEFI target
          targets: aarch64-unknown-linux-gnu, x86_64-unknown-uefi, aarch64-unknown-uefi
      - uses: Swatinem/rust-cache@v2
      # ★ Known positives FIRST: a gate below that reports zero is evidence only because each of
      # its rules fired on a fixture built to violate it, in this same job (audit S1-12).
      - name: Gate self-tests (every rule fires on its fixture)
        working-directory: scripts/ci
        run: python3 -m unittest -v test_unsafe_gates test_dependencies
      - name: "G3 tokenizer: unsafe only in class U *_unsafe.rs (L0-L6, L10)"
        run: python3 scripts/ci/perimeter.py lex
      - name: "G4 manifests: forbid inheritance, pinned lint tables, no flag injection (M1-M5)"
        run: python3 scripts/ci/perimeter.py manifest
      - name: "G4 resolved graph: exact external set, path packages, own sources (M7-M9)"
        run: python3 scripts/ci/perimeter.py metadata
      - name: "G4 kf3's closure: members, features, build scripts (M6)"
        run: python3 scripts/ci/dependencies.py
      - name: "G5 known positives EF1-EF17 (rustdoc over a fixture crate; each violation fails by its own rule)"
        run: python3 scripts/ci/selftest_perimeter_cargo.py
      - name: "G5 export table: every perimeter export is a reviewed row (E1-E14)"
        run: python3 scripts/ci/perimeter.py exports
      - name: "K4 kf3.h's prototypes against kf-qemu's no_mangle signatures (known positive included)"
        run: python3 scripts/ci/perimeter.py k4
      # On a failed table, publish the merged table the generator would write, so the rows to add
      # can be copied rather than re-derived.
      - name: "G5 on failure: the regenerated table, as an artifact"
        if: failure()
        run: python3 scripts/ci/perimeter.py exports --write --json-dir "$RUNNER_TEMP/kf-rustdoc" || true
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: perimeter-exports-regenerated
          path: docs/design/PERIMETER_EXPORTS.md
      # and the rustdoc JSON it was generated from, so a reviewer can re-run the gate locally
      # (`perimeter.py exports --json-dir`) without building kf-qemu's closure twice
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: perimeter-rustdoc-json
          path: ${{ runner.temp }}/kf-rustdoc/*/doc/*.json
          if-no-files-found: ignore
      # ★ The base a RISE is judged against (V3_SEC_PERIMETER.md §2): the PR base; on master the
      # first parent; on any other push the merge-base with origin/master. fetch-depth 0 above.
      - name: "G6 size ratchet, exact (rule c); L8 caller obligations; L9 mint sites"
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          if [ "${EVENT:-push}" = pull_request ]; then base="$PR_BASE"
          elif [ "${REF:-}" = refs/heads/master ]; then base=$(git rev-parse HEAD^1)
          else base=$(git merge-base HEAD origin/master); fi
          python3 scripts/ci/perimeter.py sizes --base "$base"

  compiler-location:
    name: compiler-location — every unsafe_code diagnostic inside its own crate's perimeter (G1)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.0   # pinned with rust-toolchain.toml and scripts/ci/perimeter.toml
          # musl and x86_64 UEFI: the two nested builds (the embedded isolate image and the GOP
          # driver); aarch64: the second pass and its UEFI driver build.
          targets: x86_64-unknown-linux-musl, x86_64-unknown-uefi, aarch64-unknown-linux-gnu, aarch64-unknown-uefi
      # ★ Registry only. A cached target dir is a warm one, and a warm target dir compiles nothing:
      # the wrapper would see no unit and the verdict would judge nothing (W6).
      - uses: Swatinem/rust-cache@v2
        with:
          cache-targets: false
      - name: "G1 known positives W1-W15 (each violation fails for its own reason)"
        run: bash scripts/ci/compiler_location.sh --selftest
      - name: "G1 compiler location gate (x86_64 all features, aarch64, standalone packages)"
        run: bash scripts/ci/compiler_location.sh

  kf3-c:
    name: kf3-c — kf3.c against pinned QEMU 10.2.4, -Werror, analyzer, link closure (G7)
    runs-on: ubuntu-latest
    # ★ The compilers are part of the check: the flags kf3.c is held to were measured with gcc 15.2.0
    # and clang 21.1.8, Ubuntu 26.04's. The image is pinned by digest (the 26.04 index, 2026-10-04).
    container: ubuntu:26.04@sha256:3595d7fc4286a33fad0fd853a4063e654287a9c3787437d7937c94ca3f7a804e
    steps:
      - name: The image's compilers and QEMU's configure prerequisites
        run: |
          apt-get update -q
          DEBIAN_FRONTEND=noninteractive apt-get install -y -q --no-install-recommends \
            ca-certificates curl xz-utils git python3 python3-venv ninja-build pkg-config \
            libglib2.0-dev libpixman-1-dev flex bison bzip2 gcc libc6-dev binutils clang
          gcc --version | head -1
          clang --version | head -1
      - uses: actions/checkout@v4
      # The tarball only (pinned by hash; the tree is never cached: build_kf3.sh patches trees).
      - uses: actions/cache@v4
        with:
          path: qemu-dl
          key: qemu-tarball-${{ hashFiles('scripts/ci/qemu-10.2.4.tar.xz.sha256') }}
      - name: "G7 kf3.c (gcc -Werror -Wextra, clang, analyzer, link closure, K1-K5)"
        run: |
          mkdir -p qemu-dl
          KF3C_TARBALL="$PWD/qemu-dl/qemu-10.2.4.tar.xz" bash scripts/ci/kf3c.sh
