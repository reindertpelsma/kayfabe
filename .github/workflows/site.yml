name: Site
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, edited]
  push:
    branches: [master]
    tags: ['v*']
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      root_ref:
        description: Root landing source (docs always include every version)
        type: choice
        options: [latest, master]
        default: latest
        required: false
  schedule:
    - cron: '23 5 * * 1'

permissions: {}
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  policy:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    outputs:
      run: ${{ steps.paths.outputs.run }}
      deploy: ${{ steps.paths.outputs.deploy }}
      known: ${{ steps.paths.outputs.known }}
    steps:
      - name: Decide site paths through the API without checking out source
        id: paths
        env:
          GH_TOKEN: ${{ github.token }}
          POLICY_REF: ${{ github.event.pull_request.base.sha || github.sha }}
        run: |
          set -euo pipefail
          # Publication events keep master tooling even when the triggering tag is old.
          if [[ "$GITHUB_EVENT_NAME" != pull_request &&
            ( "$GITHUB_EVENT_NAME" != push || "$GITHUB_REF" != refs/heads/master ) ]]; then
            POLICY_REF=$(gh api repos/reindertpelsma/kayfabe/commits/master --jq '.sha')
          fi
          [[ "$POLICY_REF" =~ ^[0-9a-f]{40}$ ]]
          temporary=$(mktemp -d)
          trap 'find "$temporary" -depth -delete' EXIT
          source_origin=https://raw.githubusercontent.com/reindertpelsma/kayfabe
          if curl --silent --fail --proto '=https' --max-time 20 --max-filesize 131072 \
            -o "$temporary/site_policy.py" \
            "$source_origin/$POLICY_REF/ci/vast-broker/site_policy.py"; then
            python3 -I "$temporary/site_policy.py" policy
          else
            # Before the helper lands (or on source/API failure), build conservatively.
            printf 'run=1\ndeploy=0\nknown=0\n' >> "$GITHUB_OUTPUT"
            [[ "$GITHUB_EVENT_NAME" != push || "$GITHUB_REF" != refs/heads/master ]]
          fi
  build:
    needs: policy
    outputs:
      tooling_sha: ${{ steps.tooling.outputs.sha }}
    if: ${{ !cancelled() && needs.policy.outputs.run == '1' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          # Tag workflows still fetch master scripts/configs, never run tagged tooling.
          # PRs review the candidate tooling without any deployment permission.
          ref: >-
            ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha ||
                github.event_name == 'push' && github.ref == 'refs/heads/master' &&
                github.sha || 'master' }}
          fetch-depth: 0
          persist-credentials: false
      - name: Record the exact build tooling revision
        id: tooling
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Snapshot published release metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/releases" --paginate --slurp \
            > "$RUNNER_TEMP/site-releases.json"
      - name: Test version selection and render every version
        env:
          ROOT_REF: ${{ inputs.root_ref || 'latest' }}
        run: |
          set -euo pipefail
          python3 -m unittest discover -s site -p 'test_build.py'
          python3 -m unittest discover -s site -p 'test_deploy_analytics.py'
          python3 site/build.py --tools-dir "$RUNNER_TEMP/site-tools" \
            --releases-json "$RUNNER_TEMP/site-releases.json" --root-ref "$ROOT_REF"
          python3 site/test_output.py
          python3 site/report.py >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          path: site/public
  deploy:
    needs: [policy, build]
    if: >-
      ${{ github.event_name != 'pull_request' &&
          (github.ref == 'refs/heads/master' ||
           startsWith(github.ref, 'refs/tags/v')) &&
          needs.policy.outputs.deploy == '1' }}
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          name: github-pages
          path: ${{ runner.temp }}/pages-deploy
      - name: Add analytics to the deployment archive
        env:
          TOOLING_REF: ${{ needs.build.outputs.tooling_sha }}
          SITE_DEPLOY_ENVIRONMENT: github-pages
          WEB_ANALYTICS_SNIPPET: ${{ vars.WEB_ANALYTICS_SNIPPET }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REPOSITORY" == reindertpelsma/kayfabe ]]
          [[ "$TOOLING_REF" =~ ^[0-9a-f]{40}$ ]]
          source_origin=https://raw.githubusercontent.com/reindertpelsma/kayfabe
          curl --silent --fail --proto '=https' --max-time 20 --max-filesize 131072 \
            -o "$RUNNER_TEMP/deploy_analytics.py" \
            "$source_origin/$TOOLING_REF/site/deploy_analytics.py"
          python3 -I "$RUNNER_TEMP/deploy_analytics.py" \
            "$RUNNER_TEMP/pages-deploy/artifact.tar"
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: github-pages-deploy
          path: ${{ runner.temp }}/pages-deploy/artifact.tar
          retention-days: 1
          if-no-files-found: error
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346
        with:
          artifact_name: github-pages-deploy
