name: Vast GPU
on:
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Optional PR cross-check; dispatch from the branch to test
        required: false
        type: string
permissions: {}
env:
  TARGET_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
jobs:
  pending:
    name: Mark GPU tripwire pending
    runs-on: ubuntu-latest
    permissions:
      statuses: write
    steps:
      - name: Post pending status without contacting the Worker
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]]
          temporary=$(mktemp)
          jq -n --arg url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            '{state:"pending",context:"gpu-vast",description:"GPU broker pending",target_url:$url}' > "$temporary"
          curl --silent --show-error --fail --max-time 20 \
            -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' \
            -X POST --data-binary "@$temporary" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$TARGET_SHA" >/dev/null
  gpu:
    name: Worker path filter and GPU tripwire
    needs: pending
    runs-on: ubuntu-latest
    environment: gpu-vast
    timeout-minutes: 160
    permissions:
      contents: read
      pull-requests: read
      id-token: write
    outputs:
      state: ${{ steps.broker.outputs.state }}
      verdict: ${{ steps.broker.outputs.verdict }}
    env:
      PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
    steps:
      - name: Evaluate trusted Worker exclusions and request bounded check
        id: broker
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          WORKER_URL: ${{ secrets.VAST_BROKER_URL }}
          WORKER_PATH: ${{ secrets.VAST_BROKER_PATH }}
        run: |
          set +x
          set -euo pipefail
          [[ "$WORKER_URL" =~ ^https://[A-Za-z0-9.-]+/?$ ]]
          [[ -z "${WORKER_PATH:-}" || "$WORKER_PATH" =~ ^[A-Za-z0-9_-]{32,128}$ ]]
          mask_value() { [[ -z "$1" ]] || printf '::add-mask::%s\n' "$1"; }
          broker_origin=${WORKER_URL%/}
          broker_host=${broker_origin#https://}
          broker_base=$broker_origin
          mask_value "$WORKER_URL"
          mask_value "$broker_origin"
          mask_value "$broker_host"
          IFS=. read -ra host_parts <<< "$broker_host"
          for piece in "${host_parts[@]}"; do mask_value "$piece"; done
          if [[ -n "${WORKER_PATH:-}" ]]; then
            mask_value "$WORKER_PATH"
            broker_base+="/$WORKER_PATH"
          fi
          mask_value "$broker_base"
          [[ -z "$PR_NUMBER" || "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]]
          [[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]]
          state=UNAVAILABLE
          verdict=UNAVAILABLE
          temporary=$(mktemp -d)
          finish() {
            rc=$?
            trap - EXIT
            if [[ "$rc" != 0 && -n "${run:-}" && -s "$temporary/oidc.json" ]]; then
              cleanup_oidc=$(jq -er '.value' "$temporary/oidc.json" 2>/dev/null)
              curl --silent --fail --max-time 20 \
                -H "Authorization: Bearer $cleanup_oidc" -H "X-GH-Token: $GH_TOKEN" \
                -X POST "$broker_base/stop/$run" >/dev/null 2>&1 || true
            fi
            # These are allowlisted Worker metadata, never box log bytes.
            printf 'state=%s\nverdict=%s\n' "$state" "$verdict" >> "$GITHUB_OUTPUT"
            exit "$rc"
          }
          trap finish EXIT
          run=
          endpoint=/rent
          method=POST
          for attempt in $(seq 1 450); do
            audience=$(jq -rn --arg value "$WORKER_URL" '$value|@uri' 2>/dev/null)
            mask_value "$audience"
            curl --silent --fail --max-time 20 \
              -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
              "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$audience" > "$temporary/oidc.json" 2>/dev/null
            oidc=$(jq -er '.value' "$temporary/oidc.json" 2>/dev/null)
            printf '::add-mask::%s\n' "$oidc"
            code=$(curl --silent --max-time 20 -o "$temporary/response.json" \
              -w '%{http_code}' -H "Authorization: Bearer $oidc" -H "X-GH-Token: $GH_TOKEN" \
              -X "$method" "$broker_base$endpoint" 2>/dev/null)
            jq -er '.log_tail_sanitised // ""' "$temporary/response.json" > "$temporary/log.txt" 2>/dev/null
            token=$(od -An -N24 -tx1 /dev/urandom | tr -d ' \n')
            printf '::stop-commands::%s\n' "$token"
            cat "$temporary/log.txt"
            printf '\n::%s::\n' "$token"
            candidate=$(jq -er '.state' "$temporary/response.json" 2>/dev/null)
            case "$candidate" in
              RUNNING|STOPPING|STOPPED|COMPLETE|NOT_NEEDED|NOT_ELIGIBLE|BUSY|UNAVAILABLE|UNAVAILABLE_BUDGET|NEEDS_APPROVAL|RENTING_DISABLED|UNAUTHORIZED|BAD_REQUEST|NOT_FOUND|OWNERSHIP_MISMATCH)
                state=$candidate ;;
              *) exit 1 ;;
            esac
            candidate=$(jq -er '.verdict' "$temporary/response.json" 2>/dev/null)
            case "$candidate" in PASS|FAIL|UNAVAILABLE) verdict=$candidate ;; *) exit 1 ;; esac
            [[ "$code" = 200 ]] || exit 1
            [[ "$(jq -er '.sha' "$temporary/response.json" 2>/dev/null)" = "$TARGET_SHA" ]]
            if [[ -n "$PR_NUMBER" ]]; then
              [[ "$(jq -er '.pr|tostring' "$temporary/response.json" 2>/dev/null)" = "$PR_NUMBER" ]]
            fi
            if [[ "$state" = NOT_NEEDED && "$verdict" = PASS ]]; then exit 0; fi
            if [[ "$endpoint" = /rent ]]; then
              run=$(jq -er '.run' "$temporary/response.json" 2>/dev/null)
              [[ "$run" =~ ^[1-9][0-9]*-[1-9][0-9]*$ ]]
              endpoint=/status/$run
              method=GET
            fi
            if [[ "$state" = COMPLETE && "$verdict" = PASS ]]; then exit 0; fi
            if [[ "$verdict" = FAIL ]]; then exit 1; fi
            if [[ "$state" = COMPLETE || "$state" = STOPPED ]]; then exit 1; fi
            sleep 20
          done
          exit 1
  report:
    name: gpu-vast
    if: ${{ always() }}
    needs: [pending, gpu]
    runs-on: ubuntu-latest
    permissions:
      statuses: write
    env:
      PENDING_RESULT: ${{ needs.pending.result }}
      GPU_RESULT: ${{ needs.gpu.result }}
      BROKER_STATE: ${{ needs.gpu.outputs.state }}
      BROKER_VERDICT: ${{ needs.gpu.outputs.verdict }}
    steps:
      - name: Post final status and fail every unsuccessful dependency
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]]
          state=UNAVAILABLE
          case "$BROKER_STATE" in
            RUNNING|STOPPING|STOPPED|COMPLETE|NOT_NEEDED|NOT_ELIGIBLE|BUSY|UNAVAILABLE|UNAVAILABLE_BUDGET|NEEDS_APPROVAL|RENTING_DISABLED|UNAUTHORIZED|BAD_REQUEST|NOT_FOUND|OWNERSHIP_MISMATCH)
              state=$BROKER_STATE ;;
          esac
          result=error
          if [[ "$PENDING_RESULT" = success && "$GPU_RESULT" = success && "$BROKER_VERDICT" = PASS && ( "$state" = COMPLETE || "$state" = NOT_NEEDED ) ]]; then
            result=success
          elif [[ "$BROKER_VERDICT" = FAIL ]]; then
            result=failure
          fi
          description="GPU broker $state"
          temporary=$(mktemp)
          jq -n --arg state "$result" --arg description "$description" \
            --arg url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            '{state:$state,context:"gpu-vast",description:$description,target_url:$url}' > "$temporary"
          curl --silent --show-error --fail --max-time 20 \
            -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' \
            -X POST --data-binary "@$temporary" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$TARGET_SHA" >/dev/null
          [[ "$result" = success ]]
