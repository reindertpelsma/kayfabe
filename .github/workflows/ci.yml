# CI green-gate (decision #33; the standing decision #15 follow-up).
#
# Two tiers, matching how the repo is actually built:
#
# Every-push gates (fast, deterministic — these stay the bar for landing anything):
# - stable: the main workspace — build, the full fast suite (KAYFABE_SLOW unset:
#   the two measured-slow tests skip loudly, everything else runs), clippy -D
#   warnings, rustfmt --check (both workspaces; the fuzz crate is its own
#   workspace so it needs its own fmt pass), and the §6.2 hexagonal boundary grep
#   (decision #37): the pure logic crates must name NO OS readiness primitive, in
#   code or in comments.
# - aarch64: cross-`cargo check` the whole workspace for arm64 (decision #36).
#   The pure logic core must carry NO x86/CPU-arch assumption, so arm64 (later:
#   Grace-Hopper / Jetson) can be added as an adapter, never a core bolt-on.
#   `cargo check` type-checks without linking, so no cross-toolchain/QEMU is
#   needed — an x86-ism that ever creeps into the core fails THIS gate on the push
#   that introduces it. See docs/design/portability_arm64.md.
# - nightly: the fuzz crate (libfuzzer needs nightly) — a plain `cargo build` in
#   fuzz/ so the one raw-guest-bytes harness KEEPS COMPILING as the core evolves
#   (it is a separate workspace, so nothing else rebuilds it). Actually *running*
#   the fuzzer stays a manual/local gate (`cargo +nightly fuzz run`, see README);
#   CI only pins compilation.
#
# Standing scheduled gates (slow, so not per-push — but STANDING, not
# remembered-by-a-human; that is how 9k lines of L1 once reached master with
# neither TSan nor a mutation run):
# - slow (nightly + dispatch): the whole suite with KAYFABE_SLOW=1 — the
#   pushbuffer proptest fuzz (73 s) and the 16-thread stress soak (≈20 s), the
#   two tests measurement showed dominate the wall clock, actually run.
# - tsan (nightly + dispatch): ThreadSanitizer over the four threaded suites —
#   the §8.2 race ceiling (l1_concurrency.md §12.15 records the first run: 28
#   tests, 0 races).
# - mutants (weekly + dispatch): cargo-mutants over the L1 surface — the
#   core_mutation_gate.md standing gate. Runs with KAYFABE_SLOW=1 (the gated
#   pushbuffer fuzz is the only coverage of the hostile-input decoder, and gating
#   it hollowed out a security gate), CARGO_INCREMENTAL=0 (incremental ICEs get
#   mis-scored as "unviable" and inflate the number), and a HARD threshold read
#   off the measured baseline — see the job's own comments for each.

name: CI

on:
  push:
  pull_request:
    branches: [master]
  schedule:
    # Nightly (slow + tsan) and weekly (mutants) — the job `if:`s key off the
    # exact cron string, so keep these in sync with them.
    - cron: '43 2 * * *'
    - cron: '43 4 * * 6'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  stable:
    name: stable — build, test, clippy, fmt, boundary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --workspace
      # (Deliberately not naming a test count here — it rots on every PR.)
      #
      # ★★ KAYFABE_NO_KVM=1 PINS THE OS-FREE CONFIGURATION. GitHub runners have no
      # /dev/kvm, so this job was *already* running that configuration — but by accident
      # of what the runner image happens to lack, which would lapse silently the day an
      # image starts shipping the device. The guarantee it protects is architectural: the
      # pure logic core must stay testable with NO OS layer, or we lock in Linux/KVM/QEMU/
      # x86 semantics and only find out when a second VMM or a second architecture is
      # attempted. `kayfabe-mocks` is the backend for this configuration.
      #
      # The with-KVM configuration is covered on developer boxes and the bench; the
      # reached-count gate below is what stops the gated tests from silently vanishing
      # from BOTH.
      - name: Test (OS-free configuration — KVM forced absent)
        run: KAYFABE_NO_KVM=1 cargo test --workspace 2>&1 | tee /tmp/kayfabe-test.log; exit "${PIPESTATUS[0]}"
      # ★★ KVM-gate non-vacuity. GitHub runners do NOT provide /dev/kvm, so the ~33
      # tests that need a real VM fd SKIP here — and a skip that nobody counts is the
      # "green instrument on an unexercised path" failure this repo cares most about
      # (testing_doctrine.md §1). CI therefore asserts the gated tests were REACHED,
      # not that they ran: RAN + SKIPPED must meet the floor. Each test binary is its
      # own process, so the counting has to be external to the harness.
      #
      # This exists because CI was RED for three commits (1336ce1, 42d850c, 0a6826c)
      # while the local suite was green on a box that happens to have KVM. The floor
      # is what stops the reverse failure: all 33 quietly vanishing and CI staying
      # green.
      - name: KVM-gate reached-count (floor, not an exact match)
        run: |
          set -euo pipefail
          ran=$(grep -c 'KVM-GATE: RAN' /tmp/kayfabe-test.log || true)
          skipped=$(grep -c 'KVM-GATE: SKIPPED' /tmp/kayfabe-test.log || true)
          total=$(( ran + skipped ))
          echo "KVM-gate: ran=$ran skipped=$skipped total=$total (floor 35)"
          if [ "$total" -lt 35 ]; then
            echo "::error::KVM-gated tests were not reached: $total < 35." \
                 "Either they were deleted, or the gate stopped announcing itself." \
                 "A silent skip is worse than a red build."
            exit 1
          fi
          if [ "$ran" -gt 0 ]; then
            echo "This runner has /dev/kvm: $ran gated tests actually executed."
          fi
      - name: Clippy (-D warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Format check
        run: cargo fmt --all --check
      # ★ The hexagonal boundary gate (l1_concurrency.md §6.2, decision #37). The
      # completion-source reactor's MODEL is core-owned and PURE: the core says
      # "notifiable source" and "completion source", full stop. The OS half — the
      # source→host-primitive table, the real wait loop, the real wake — is L1's
      # adapter, and adapters do not live in these crates. A logic-crate diff that
      # names an OS readiness primitive has breached the boundary, in code OR in a
      # comment, so this greps both. Exit-code polarity: `grep -r` returns 0 on a
      # HIT (= boundary breach = fail) and 1 on no match (= the success case), hence
      # the `if`, never a bare `grep` under `set -e`.
      - name: Hexagonal boundary gate (no OS vocabulary in the pure logic crates)
        run: |
          pure="crates/kayfabe-core crates/kayfabe-completion crates/kayfabe-fwd \
                crates/kayfabe-mmu crates/kayfabe-gsp crates/kayfabe-rmrpc crates/kayfabe-arch \
                crates/kayfabe-abi \
                crates/kayfabe-util crates/kayfabe-trace crates/kayfabe-isolate crates/kayfabe-vmm"
          if grep -rniE 'eventfd|epoll|timerfd|rawfd|libc|O_NONBLOCK' $pure; then
            echo ""
            echo "★ BOUNDARY BREACH — l1_concurrency.md §6.2."
            echo "The pure logic crates own the completion-source MODEL, never the OS"
            echo "readiness machinery: no host descriptor types, no syscall names, not"
            echo "even in comments. The lines above name one. Move it into the L1"
            echo "adapter and refer to it from the core as a 'notifiable source' /"
            echo "'completion source'. Reword the comment; never weaken this gate."
            exit 1
          fi
      # ★ The VMM-VOCABULARY gate (l1_os_shell.md §6.0, decision #39) — the sibling of
      # the hexagonal gate, for the OTHER axis of portability.
      #
      # The hexagonal gate above keeps OS vocabulary out of the pure crates. Nothing
      # kept *hypervisor* vocabulary out of anything — and hypervisor-agnosticism is a
      # founding requirement of this port (`kayfabe-vmm`'s crate docs; arch §4.1's
      # "count is not the invariant; hypervisor-agnosticism is"). The structural tell
      # that it had gone unwritten: the word "agnostic" appears ZERO times in
      # l1_concurrency.md and l1_os_shell.md combined. A requirement restated nowhere
      # below the architecture doc is one the next adapter quietly breaks.
      #
      # Scope = the 11 pure logic crates PLUS `kayfabe-rt`. The shell is an adapter for
      # *threads and locks*, deliberately outside the hexagonal list — but it is not a
      # hypervisor adapter, and the concurrency shape it encodes (`SharedDevice`'s
      # `&self` ranked locking) is precisely what a second backend must be able to reuse.
      #
      # ★ It gates API IDENTIFIERS, never the string "QEMU". That is the whole design:
      # naming the adapter crates (`kayfabe-vmm-qemu`, `kayfabe-vmm-ch`), citing a QEMU
      # source file, or writing "QEMU's BQL is one instance of the class" must all stay
      # writable — so the pattern names things that only ever appear when QEMU's API has
      # leaked inward (`BQL_LOCK_GUARD`, `memory_region_*`, `qdev_*`, `QEMUBH`), plus the
      # two English phrases that are pure QEMU idiom ("bottom half", "main loop"). No
      # allowlist exists and none is ever needed: every legitimate mention is rephrasable
      # in one word ("the VMM's global lock", "the adapter's serialized executor"), and a
      # gate with an allowlist is a gate with a negotiation.
      #
      # The two English idioms carry a LEADING \b, and it is load-bearing rather than
      # tidiness: without it `main.?loop` matches the ordinary phrase "do-main loop"
      # (and any word ending in "main" followed by "loop"). A gate that fires on English
      # is a gate that gets muted, which is the §5.1 lesson applied one section early.
      # The trailing side needs no anchor — "main-loop", "mainloop" and "main_loop" must
      # all match, which is exactly what `.?` plus no trailing anchor gives.
      #
      # Exit-code polarity, as above: `grep -r` exits 0 on a HIT, and a hit here is the
      # FAILURE case — hence the `if`, never a bare `grep` under `set -e`. (This polarity
      # has been got wrong twice in this repo; it is written out at all three gates for
      # that reason.)
      - name: VMM-vocabulary gate (no hypervisor API vocabulary in the core or the shell)
        run: |
          portable="crates/kayfabe-core crates/kayfabe-completion crates/kayfabe-fwd \
                    crates/kayfabe-mmu crates/kayfabe-gsp crates/kayfabe-rmrpc \
                    crates/kayfabe-arch crates/kayfabe-abi \
                    crates/kayfabe-util crates/kayfabe-trace crates/kayfabe-isolate \
                    crates/kayfabe-vmm crates/kayfabe-rt"
          if grep -rniE '\bBQL\b|bql_lock|qemu_mutex_lock_iothread|BQL_LOCK_GUARD|MemoryRegion|memory_region_|qemu_bh|QEMUBH|aio_bh|qdev_|VMStateDescription|\bbottom.?half|\bmain.?loop|iothread' $portable; then
            echo ""
            echo "★ HYPERVISOR-VOCABULARY BREACH — l1_os_shell.md §6.0."
            echo "The core and the L1 shell must name hypervisor CAPABILITIES, never one"
            echo "hypervisor's API. The lines above name QEMU's. A CH/rust-vmm port must"
            echo "cost one adapter crate and zero trait changes; every QEMU-ism that"
            echo "reaches these crates is a line of that adapter written in the wrong"
            echo "place. Reword to the capability:"
            echo "  QEMU's BQL / iothread lock -> 'the VMM's global lock' (§6.3's CLASS:"
            echo "                                'a lock the VMM owns, that we neither"
            echo "                                 construct nor rank')"
            echo "  bottom half / main loop    -> 'the adapter's serialized executor'"
            echo "  MemoryRegion / qdev_*      -> the Vmm trait method that means it"
            echo "Naming the adapter crates (kayfabe-vmm-qemu, kayfabe-vmm-ch) never trips"
            echo "this gate — it matches API identifiers, not the vendor's name. So there"
            echo "is no allowlist, and there is nothing to argue about in review."
            exit 1
          fi
      # ★ The GENERATION-NAME gate (CLAUDE.md rule 1, decision #37's third axis) — the
      # third vocabulary gate, and the one that was DOCUMENTED BUT ABSENT. CLAUDE.md has
      # said "Grep gate (CI): no `Ampere|Turing|Hopper|Blackwell|Ada|V5\d\d` in any logic
      # crate" since the repo was founded; ci.yml never had it, and on 2026-07-27 two
      # independent agents went looking for it and found nothing. A gate that exists only
      # in a rulebook is the same green-instrument-on-an-unexercised-path this suite is
      # about, one level up: nobody was reading it, so nobody could see it was not there.
      #
      # The rule it enforces: **a concrete GPU generation or driver version is a fact about
      # ONE chip, and one chip's facts live in an arch-impl crate.** Rule 2 is that adding
      # a generation costs `impl Arch for <Gen>` plus maybe one `GmmuFmt`, with ZERO edits
      # to any logic crate; the moment a logic crate can say the chip's name, that
      # invariant is enforceable only by review.
      #
      # Three scope decisions, each of which had to go the way it did:
      #
      # 1. **`kayfabe-abi` is OUT** — the one deliberate difference from the hexagonal
      #    gate's `pure=` list, which is otherwise copied verbatim so the lists stay in
      #    sync. Axis A quarantine (CLAUDE.md rule 1) puts the concrete driver version in
      #    `kayfabe-abi` ON PURPOSE: `kayfabe-abi/src/lib.rs:11` says so in as many words,
      #    and the crate is built out of `V575`/`NVOS46_PARAMETERS_V580` version tables.
      #    Running this gate over it would fail on ~15 lines that are the crate's whole
      #    reason to exist. The GPA-accessor gate below already sets the precedent for a
      #    documented scope difference; this is the second.
      # 2. **Comment lines are OUT** — the deliberate departure from the other gates'
      #    "prose counts" rule, and it is a departure, so here is the evidence. The pure
      #    crates carry 14 generation-name mentions today and every one is legitimate:
      #    `kayfabe-arch/src/gsp.rs` cites `ogkm`'s per-generation source files by path
      #    (`gsp/arch/turing/kernel_gsp_tu102.c`, `falcon/arch/ampere/kernel_falcon_ga102.c`)
      #    — those citations ARE the ground truth this crate is derived from, and a rule
      #    that forbade them would mean deriving the traits from an unnameable source;
      #    and `kayfabe-arch/src/lib.rs:20-24, 349` TEACHES rule 2 by writing out
      #    `struct Ampere; impl Arch for Ampere` in a doc example, i.e. the prose that
      #    would trip the gate is the prose that states the gate. Prose counts where prose
      #    is rephrasable (the hexagonal gate: "eventfd" -> "notifiable source"); a source
      #    citation is not rephrasable, so here it does not.
      #    ★ The consequence is stated so nobody has to rediscover it: a chip name hidden
      #    in a trailing comment on a code line still trips this gate (the filter drops
      #    whole comment LINES, not trailing ones), and a chip name in a `///` doc line
      #    does not. If that ever stops being true — if a leak arrives dressed as a doc —
      #    the fix is a narrower filter, never a wider allowlist.
      # 3. **Anchors, per name, for the same reason the VMM gate anchors its two English
      #    idioms.** Most names carry a LEADING \b and no trailing one, so `ampere_pte`,
      #    `turingFmt` and `HopperGmmu` are all caught — an identifier is exactly how a
      #    chip fact actually leaks. Three names are the exception and carry BOTH anchors,
      #    because each is a prefix of ordinary vocabulary this repo uses constantly:
      #    `Ada` ("adapter", "adaptive"), `Volta` ("voltage"), `Pascal` (`pascal_case`,
      #    "PascalCase"). A gate that fires on the word "adapter" in a hexagonal-
      #    architecture codebase is a gate that gets muted within the day.
      #
      # Exit-code polarity: `grep -r` exits 0 on a HIT and a hit is the FAILURE case, as at
      # every gate here. This one needs a second filter stage, so it takes the
      # unsafe-surface gate's form instead of the `if grep` form — captured output, the
      # pipeline ending in `|| true` (without it, `grep -v` exiting 1 on "everything was
      # filtered" — the SUCCESS case — would abort the step under `set -e` and the gate
      # would pass by crashing), and the verdict as `[ -n "$hits" ]`.
      - name: Generation-name gate (no concrete chip or driver version in the logic crates)
        run: |
          pure="crates/kayfabe-core crates/kayfabe-completion crates/kayfabe-fwd \
                crates/kayfabe-mmu crates/kayfabe-gsp crates/kayfabe-rmrpc crates/kayfabe-arch \
                crates/kayfabe-util crates/kayfabe-trace crates/kayfabe-isolate \
                crates/kayfabe-vmm"
          hits=$(grep -rniE \
            '\b(kepler|maxwell|turing|ampere|lovelace|hopper|blackwell|rubin)|\b(ada|pascal|volta)\b|\b(g[kmpvab][0-9]{3}|tu1[0-9]{2}|ad1[0-9]{2}|gh[0-9]{3}|v[56][0-9]{2})\b' \
            $pure | grep -vE '^[^:]*:[0-9]+:[[:space:]]*(//|/\*|\*)' || true)
          if [ -n "$hits" ]; then
            echo "$hits"
            echo ""
            echo "★ GENERATION-NAME BREACH — CLAUDE.md rule 1."
            echo "The lines above name a concrete GPU generation, chip or driver version"
            echo "in a PURE LOGIC crate. That is one chip's fact, and rule 2 is that a"
            echo "chip's facts cost an adapter and ZERO logic-crate edits. What to do:"
            echo "  - a value that differs per generation -> put it behind a kayfabe-arch"
            echo "    TRAIT (Arch / GmmuFmt / UserdModel), and give it a name that says"
            echo "    what it MEANS, not which chip has it."
            echo "  - the concrete number itself       -> an arch-impl crate"
            echo "    (\`impl Arch for <Gen>\`), never a logic crate. kayfabe-mocks::MockArch"
            echo "    is the standing proof the seam holds without one."
            echo "  - a concrete DRIVER version        -> kayfabe-abi (Axis A quarantine),"
            echo "    which is out of scope here precisely because that is its job."
            echo "  - an \`ogkm\` source citation        -> keep it, on its OWN comment line."
            echo "    Whole comment lines are out of scope; a trailing comment on a code"
            echo "    line is not."
            echo "Never widen the pattern to make a leak fit: the whole value of this gate"
            echo "is that the answer is always 'move it', never 'allow it here'."
            exit 1
          fi
      # ★ The UNSAFE-SURFACE gate — the auditability rule, landed while it is free.
      #
      # The workspace is `unsafe_code = "forbid"` (root `Cargo.toml`,
      # `[workspace.lints.rust]`), so today this gate has nothing to find. That is
      # precisely why it lands now: the L1 OS adapter (`kayfabe-linux-raw`) will need
      # ONE audited relaxation, and a naming convention introduced *after* the first
      # exception exists is a convention nobody can trust retroactively.
      #
      # The rule it enforces, in full: **an auditor must be able to enumerate the
      # entire unsafe surface with `ls`.** So any `.rs` file that uses the keyword
      # must be named `*_unsafe.rs`. `#![forbid(unsafe_code)]` stays workspace-wide
      # and is what actually BANS it; this gate is what makes the eventual exception
      # findable without reading 50 files.
      #
      # Three details decide whether a gate like this is real or decorative:
      #
      # 1. **Exit-code polarity.** `grep -l` exits 0 on a HIT — and a hit here is a
      #    VIOLATION, the inverse of the usual reading. So the verdict is an
      #    `if [ -n "$offenders" ]` over captured output, and the pipeline that
      #    produces it ends in `|| true`: without that, `find -exec grep +` returning
      #    1 for "no matches" (the SUCCESS case) would abort the step under `set -e`
      #    and the gate would pass by crashing.
      # 2. **Prose counts.** A mention in a comment, doc or string is a violation
      #    too. Not because a comment is dangerous, but because a gate whose verdict
      #    depends on reading intent is one that eventually gets mis-read — and the
      #    cost is asymmetric: prose can always be reworded, a block cannot.
      # 3. **The one exception is lexical, not editorial.** `grep -w` counts `_` as a
      #    word character, so the LINT NAME `unsafe_code`, the lint
      #    `unsafe_op_in_unsafe_fn`, and the filename suffix `_unsafe.rs` never
      #    match — while `unsafe {`, `unsafe fn`, `unsafe impl`, `` `unsafe` `` and
      #    `thread-unsafe` all do. So the rule stays writable *by construction*: say
      #    `unsafe_code`, or put it in a `*_unsafe.rs` file. No allowlist, no
      #    per-file judgement, nothing to argue about in review.
      #
      # `find` walks the whole repo minus build output, rather than a list of known
      # directories: a gate that enumerates today's crates stops covering the code
      # the moment someone adds one.
      - name: Unsafe-surface gate (every unsafe file is named *_unsafe.rs, so `ls` enumerates it)
        run: |
          offenders=$(find . -name '*.rs' -not -name '*_unsafe.rs' \
                        -not -path './target/*' -not -path './*/target/*' \
                        -not -path './mutants.out/*' \
                        -exec grep -lw unsafe {} + || true)
          if [ -n "$offenders" ]; then
            echo "$offenders"
            echo ""
            echo "★ UNSAFE-SURFACE BREACH — the *_unsafe.rs naming rule."
            echo "An auditor must be able to enumerate the ENTIRE unsafe surface with"
            echo "\`ls\`: every .rs file that uses the keyword is named *_unsafe.rs, and"
            echo "the files above are not. Two legitimate fixes, no third:"
            echo "  - real unsafe code  -> move it into a *_unsafe.rs module, and"
            echo "    justify the relaxation there (the workspace lint is 'forbid')."
            echo "  - a comment or doc  -> reword it. Naming the LINT, \`unsafe_code\`,"
            echo "    never trips this gate, and neither does the suffix _unsafe.rs."
            echo "Never widen the pattern and never add an allowlist: the moment this"
            echo "gate needs a judgement call, \`ls\` stops being the audit."
            exit 1
          fi
      # ★★ The HOST-POINTER half of gate C (l1_os_shell.md §9.3, §4.1.1, §4.6's ex-row 10,
      # decision #33). §9.3 has described gate C as two-sided since it was written —
      # "`unsafe` appears in a file not named *_unsafe.rs, OR a host pointer type
      # (`*mut`/`*const`/`NonNull`/`transmute`) appears outside one" — and only the
      # first half was implemented. This is the second half. Added 2026-07-28.
      #
      # ★ Honest scope, so nobody over-reads it. Three limits, all deliberate:
      #
      # 1. It is per-FILE, not per-VISIBILITY. A `pub fn` returning `*mut u8` from
      #    INSIDE a *_unsafe.rs file passes this gate and passes every trybuild row
      #    (a compile-fail test asserts that ONE written snippet fails; the
      #    crate-boundary rule is universally quantified over the API surface, which
      #    is why §4.6's row 10 was never expressible as a trybuild row and is a CI
      #    gate instead). The property holds in today's tree by construction — the
      #    pointer types occur only in PRIVATE fields inside *_unsafe.rs — so this is
      #    a ratchet against tomorrow, not a hole being closed.
      # 2. `usize`-as-an-address, the fourth shape decision #33 names, is not
      #    lexically detectable at all. `no_base_address.rs` covers its constructive
      #    instance (`.base()`/`.addr()`/a public field); nothing covers it in general.
      # 3. Line comments are stripped before matching, unlike the `unsafe` half where
      #    prose deliberately counts. The reason is the same "the rule must stay
      #    writable" argument that makes `unsafe_code` a lexical escape there:
      #    `kayfabe-linux-raw/src/lib.rs` has to be able to NAME the forbidden types
      #    in order to state the rule (:35, :61, :77 do exactly that). A block comment
      #    is a known lexical gap; there are none today.
      #
      # `PhantomData<…>` is erased before matching. Not an allowlist — a PhantomData
      # is zero-sized and cannot carry an address by construction, and
      # `PhantomData<*mut ()>` is the standard !Send marker (kayfabe-rt/src/lock.rs).
      #
      # Exit-code polarity: same trap as the gate above. `grep` exits 1 on NO match,
      # which is the SUCCESS case here, so every grep ends in `|| true` and the
      # verdict is an `if [ -n … ]` over captured output. Note the loop body uses
      # `if`/`fi` rather than `[ -n "$hits" ] && …`, because the `&&` form returns 1
      # on the common (clean) path and would abort the step under `set -e`.
      - name: Host-pointer gate (no *mut/*const/NonNull/transmute outside *_unsafe.rs)
        run: |
          offenders=""
          while IFS= read -r f; do
            hits=$(sed -e 's|//.*||' -e 's|PhantomData<[^>]*>||g' "$f" \
                   | grep -nE '\*mut |\*const |NonNull|transmute' || true)
            if [ -n "$hits" ]; then
              offenders="$offenders$(echo "$hits" | sed "s|^|$f:|")
          "
            fi
          done < <(find . -name '*.rs' -not -name '*_unsafe.rs' \
                     -not -path './target/*' -not -path './*/target/*' \
                     -not -path './mutants.out/*')
          if [ -n "$(echo "$offenders" | tr -d '[:space:]')" ]; then
            echo "$offenders"
            echo ""
            echo "★ HOST-POINTER BREACH — gate C's second half (l1_os_shell.md §9.3)."
            echo "A host CPU address type appears in a file that is not named"
            echo "*_unsafe.rs. A raw pointer is unsafe to HOLD even in safe code, and"
            echo "the whole audit claim of decision #33 is that host addresses do not"
            echo "leave \`kayfabe-linux-raw\`'s *_unsafe.rs files. Two fixes, no third:"
            echo "  - real pointer code -> move it into a *_unsafe.rs module, behind a"
            echo "    bounded type (MappedRegion / RegionView / VolatileRegion). It must"
            echo "    not appear in any signature reachable from outside the crate."
            echo "  - a comment or doc  -> whole-line comments are already stripped, so"
            echo "    a hit means it is on a CODE line. Move the prose to its own line."
            echo "Never widen the pattern and never add an allowlist: the exception is"
            echo "lexical (PhantomData is a ZST), never editorial."
            exit 1
          fi
      # ★★★ The GPA-ACCESSOR gate (l1_os_shell.md §6.1/§6.3/§10.1 item 6, the 2026-07-27
      # contact round). `Vmm::gpa_read`/`gpa_write` are the ONLY in-lock-legal capability
      # that takes a GUEST-CHOSEN address, and their legality rests entirely on the
      # implementation being unable to reach VMM-global API. On a real backend that is
      # decided at run time by which region the guest's number lands on — a lock inversion
      # the guest constructs on demand, invisible to the type system, to the lock ranks
      # (a lock we do not take ourselves has no rank), to the written list of VMM
      # functions an in-lock-legal method may call, and to the other three greps here.
      #
      # The defence is a POSITIVE proof (`kayfabe_vmm::GuestRamMap`) plus ONE core-side
      # classification site (`kayfabe_fwd::guest_read`), because a second call site is a
      # second place a refusal can be folded into a generic fault — which is exactly what
      # the code did before (`map_err(|_| FwdFault::GpaRead { .. })`, discarding the
      # variant that says "the guest aimed at a device").
      #
      # Scope = the PURE crates only. `kayfabe-mocks` implements the accessors (that is
      # its job), `kayfabe-rt` passes a `&mut dyn Vmm` through without calling them, and
      # the tests drive both sides deliberately.
      #
      # Exit-code polarity, as at every gate above: `grep -r` exits 0 on a HIT, and a hit
      # is the FAILURE case — hence the `if`, never a bare `grep` under `set -e`.
      - name: GPA-accessor gate (exactly one core-side classification site)
        run: |
          pure="crates/kayfabe-core crates/kayfabe-completion crates/kayfabe-mmu \
                crates/kayfabe-gsp crates/kayfabe-rmrpc crates/kayfabe-arch crates/kayfabe-abi \
                crates/kayfabe-util crates/kayfabe-trace crates/kayfabe-isolate"
          if grep -rnE '\.gpa_(read|write)\(' $pure; then
            echo ""
            echo "★ GPA-ACCESSOR BREACH — l1_os_shell.md §6.1 / §10.1 item 6."
            echo "Guest-physical access belongs to ONE core-side site,"
            echo "kayfabe_fwd::guest_read, which classifies the refusal:"
            echo "  VmmError::NonRamGpa -> FwdFault::NonRamGpa  (the guest aimed a"
            echo "                         descriptor at a DEVICE register window; on a"
            echo "                         real backend serving it takes the VMM's global"
            echo "                         lock beneath one of our ranked locks)"
            echo "  anything else       -> FwdFault::GpaRead    (nothing is there)"
            echo "Route the access through it. Never re-derive the classification, and"
            echo "never map_err(|_| ..) it away — the discarded variant IS the finding."
            exit 1
          fi
          n=$(grep -cE '\.gpa_(read|write)\(' crates/kayfabe-fwd/src/lib.rs || true)
          if [ "$n" != "1" ]; then
            echo ""
            echo "★ GPA-ACCESSOR BREACH — kayfabe-fwd has $n guest-memory access sites,"
            echo "expected exactly 1 (kayfabe_fwd::guest_read). See the message above."
            exit 1
          fi
      # ★ The BRIDGE-EXCLUSIVITY gate (docs/design/gsp_core_bridge.md §1.2, which asks for
      # it in as many words: "It is the ONLY crate in the tree permitted to name both
      # `RpcCommand` and `RmEvent`. That is a one-line CI grep and should be added as one").
      #
      # What it protects. The lattice has ONE crate where the GSP transport's decoded
      # command meets the core's object-model vocabulary, and the placement is argued three
      # ways: `kayfabe-core` may name no NVIDIA struct layout; `kayfabe-abi` may not depend
      # on the core; and `kayfabe-gsp` must not acquire a core dependency, because a GSP FSM
      # that can see the RM graph can start firing on graph state — protocol-not-trace
      # violated one level down, and precisely the shape the C fell into when a control
      # command's side effect on the object model became a transport-level action
      # (`C:2835-2837`). None of those three is expressible as a dependency rule alone: a
      # crate can name both types the moment it happens to depend on both.
      #
      # Scope = `crates/*/src` only. The conformance suite composes every crate by
      # definition — that is its job — so including `tests/` would gate the instrument
      # rather than the lattice (same reasoning that keeps `kayfabe-mocks` out of the
      # mutation denominator). A crate's own `tests/` directory is out for the same reason.
      #
      # `grep -w` so `RmEventKind` or a `RpcCommands` field never trips it, and prose
      # counts: naming both types in a comment is how a doc claims a seam it does not have,
      # which is exactly the drift `gsp_core_bridge.md` §8 had to correct in two places.
      #
      # Exit-code polarity, as at every gate here: a HIT is the failure, so the verdict is
      # `if [ -n ... ]` over captured output and every grep ends in `|| true`.
      - name: Bridge-exclusivity gate (one crate names both RpcCommand and RmEvent)
        run: |
          offenders=""
          for d in crates/*/src; do
            crate=$(basename "$(dirname "$d")")
            case "$crate" in kayfabe-rmrpc) continue;; esac
            names_cmd=$(grep -rlw RpcCommand "$d" || true)
            names_ev=$(grep -rlw RmEvent "$d" || true)
            if [ -n "$names_cmd" ] && [ -n "$names_ev" ]; then
              offenders="$offenders $crate"
            fi
          done
          if [ -n "$offenders" ]; then
            for c in $offenders; do
              echo "=== $c"; grep -rnw -e RpcCommand -e RmEvent "crates/$c/src" || true
            done
            echo ""
            echo "★ BRIDGE-EXCLUSIVITY BREACH — gsp_core_bridge.md §1.2."
            echo "The crates above name BOTH the GSP transport's decoded command and the"
            echo "core's object-model event. There is exactly one seam between those two"
            echo "vocabularies and it is kayfabe-rmrpc. Two fixes, no third:"
            echo "  - real code -> call kayfabe_rmrpc::translate and pass the RmEvent on."
            echo "    A second translation site is a second source of truth for namespace"
            echo "    attribution, which is THE thing this seam gets right."
            echo "  - a comment -> reword it. Naming one of the two is always fine; a"
            echo "    doc that names both is usually a doc claiming a seam it does not own"
            echo "    (§8 corrects two such claims)."
            exit 1
          fi
      # ★ The UNSAFE-CONTAINMENT gates — A, B and the ratchet (l1_os_shell.md §4.1).
      #
      # Landed WITH `kayfabe-linux-raw`, because that crate is what makes them necessary.
      # `unsafe_code = "forbid"` cannot be relaxed by an `allow` inside a crate — that is
      # the point of `forbid` — so the one crate that needs the relaxation must OMIT
      # `[lints] workspace = true` and restate its lints. That creates a silent opt-out for
      # the whole workspace: any future crate that merely forgets the inheritance block
      # loses `forbid` with no diagnostic at all. Gate A closes it.
      #
      # Gate C (above) already pins the *file naming*; these pin the *containment*:
      #  A — every package except kayfabe-linux-raw inherits the workspace lints;
      #  B — the keyword lives in exactly one crate's src/, so gate C's `ls` is an `ls` of
      #      one directory rather than of the repo;
      #  ratchet — the block COUNT matches a committed number, so a new relaxation is a
      #      reviewed commit with an argument, and cannot drift upward inside a debugging
      #      diff. Raising it is a one-line change that shows up in review; the clippy lint
      #      `undocumented_unsafe_blocks = deny` (that crate's Cargo.toml) makes each one
      #      carry its own `// SAFETY:`, which is what makes the §11 review tractable.
      #
      # Same exit-code polarity trap as the three gates above: a `grep` HIT is the failure.
      - name: "Unsafe-containment gates (A: forbid inheritance, B: one crate, ratchet)"
        run: |
          # --- Gate A: every package but the ONE inherits `unsafe_code = "forbid"`.
          missing=""
          for m in crates/*/Cargo.toml tests/Cargo.toml; do
            case "$m" in crates/kayfabe-linux-raw/Cargo.toml) continue;; esac
            grep -q '^\[lints\]' "$m" && grep -q '^workspace = true' "$m" || missing="$missing $m"
          done
          if [ -n "$missing" ]; then
            echo "★ FORBID-INHERITANCE BREACH — l1_os_shell.md §4.1 gate A."
            echo "These manifests do not inherit the workspace lints, so they are NOT"
            echo "covered by \`unsafe_code = \"forbid\"\` and nothing would have said so:"
            for m in $missing; do echo "  $m"; done
            echo "Add:"
            echo "  [lints]"
            echo "  workspace = true"
            echo "There is exactly ONE crate allowed to omit it (kayfabe-linux-raw), and"
            echo "adding a second is a design decision, not a manifest edit."
            exit 1
          fi
          # --- Gate B: the surface lives in exactly one crate's src/.
          outside=$(find . -name '*_unsafe.rs' \
                      -not -path './crates/kayfabe-linux-raw/src/*' \
                      -not -path './target/*' -not -path './*/target/*' \
                      -not -path './mutants.out/*' || true)
          if [ -n "$outside" ]; then
            echo "$outside"
            echo ""
            echo "★ UNSAFE-CONTAINMENT BREACH — l1_os_shell.md §4.1 gate B."
            echo "The unsound surface is ONE crate: crates/kayfabe-linux-raw/src/. The"
            echo "files above are elsewhere. Move the code, or the audit stops being"
            echo "'read one crate in one sitting', which is its acceptance criterion."
            exit 1
          fi
          # --- The ratchet: the number of relaxations is a reviewed constant.
          # Counts the syntactic forms only (`unsafe {`, `unsafe fn/impl/trait`), so prose
          # inside those files — which gate C permits there — cannot inflate it.
          # ★ 7 -> 25 at M2-c (l1_os_shell.md §10), the stage that gives the raw crate
          # its first consumers. ★ 25 -> 37 at M2-d, the stage that gives it a reactor and
          # a guest. The surface, per file, each block carrying its own `// SAFETY:`
          # (clippy `undocumented_unsafe_blocks = deny`):
          #   window_unsafe.rs  (7) — the GuestWindow: one mmap, one MAP_FIXED shared by
          #     place/restore, one munmap in Drop, two copy_nonoverlapping, and the two
          #     PER-TYPE `Send`/`Sync` grants (§14.5 item 1 asked for exactly this shape,
          #     argued per type, never one blanket impl).
          #   host_fd_unsafe.rs (9) — from_raw_fd (the ONE adoption site), memfd_create,
          #     ftruncate, F_ADD_SEALS, F_DUPFD_CLOEXEC, the notify descriptor's create,
          #     write and read, and getrlimit (the §3.8 descriptor budget: the core's
          #     source cap may not be set optimistically past the process's real limit).
          #   kvm_unsafe.rs     (3) — open(/dev/kvm), the by-value ioctl, the memslot ioctl.
          #   epoll_unsafe.rs   (3) — M2-d, the readiness set: create, ctl (shared by
          #     watch/unwatch), and the wait. Level-triggered, keyed on a caller-chosen
          #     token that is deliberately NOT the descriptor (§3.2's O3 argument).
          #   vcpu_unsafe.rs    (8) — M2-d, the guest: KVM_RUN, the mmap of the shared run
          #     structure and its munmap in Drop, the read of the exit union, the write of
          #     an MMIO load's completion, the two by-reference register ioctls, and the
          #     per-type `Send` grant for a vCPU (one runner thread owns one; `Sync` is
          #     deliberately withheld).
          EXPECTED_UNSAFE_BLOCKS=37
          actual=$(grep -rhoE 'unsafe (\{|fn |impl |trait )' \
                     crates/kayfabe-linux-raw/src/*_unsafe.rs | wc -l | tr -d ' ')
          echo "unsafe blocks: $actual (bar: $EXPECTED_UNSAFE_BLOCKS)"
          grep -rcoE 'unsafe (\{|fn |impl |trait )' crates/kayfabe-linux-raw/src/*_unsafe.rs || true
          if [ "$actual" -ne "$EXPECTED_UNSAFE_BLOCKS" ]; then
            echo ""
            echo "★ UNSAFE RATCHET MOVED — l1_os_shell.md §4.1."
            echo "Expected $EXPECTED_UNSAFE_BLOCKS relaxation(s), found $actual."
            echo "If you ADDED one: change the number here in the same commit, and say in"
            echo "the message what the new block does and what its SAFETY invariant is."
            echo "If you REMOVED one: change the number here too — a ratchet that only"
            echo "catches growth stops being a count of the audit surface."
            exit 1
          fi
      - name: Format check (fuzz workspace)
        run: cargo fmt --all --check
        working-directory: fuzz

  aarch64:
    name: aarch64 — core cross-checks (no x86 assumptions)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-gnu
      - uses: Swatinem/rust-cache@v2
      - name: Cross-check the workspace for aarch64 (arch-portability gate; no linker needed)
        run: cargo check --workspace --target aarch64-unknown-linux-gnu

  nightly-fuzz:
    name: nightly — fuzz harness compiles
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Sets RUSTUP_TOOLCHAIN, overriding the repo's stable rust-toolchain.toml.
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz
      - name: Build fuzz harness (compile gate only; running it is manual)
        run: cargo build
        working-directory: fuzz

  slow:
    name: slow — full suite with the soaks (KAYFABE_SLOW=1)
    # Nightly cron + manual dispatch only — never the push path (the push gate's
    # job is to stay fast; this job's job is to make sure the soaks still run
    # WITHOUT a human remembering them).
    if: github.event.schedule == '43 2 * * *' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test with the slow gate open (pushbuffer proptest fuzz + 16-thread stress soak)
        run: KAYFABE_SLOW=1 cargo test --workspace

  tsan:
    name: tsan — race ceiling over the threaded suites
    if: github.event.schedule == '43 2 * * *' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # TSan needs nightly (-Zsanitizer) + rust-src (-Zbuild-std rebuilds std
      # instrumented — without it, std's own synchronization is invisible to TSan
      # and every lock handoff reads as a race).
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src
      - uses: Swatinem/rust-cache@v2
      # The exact first-campaign invocation (l1_concurrency.md §12.15: 28 tests,
      # 0 races), plus KAYFABE_SLOW=1 so the gated stress soak — the whole reason
      # this job exists — actually runs under the sanitizer. TSan inflates
      # runtimes ~20× (measured: concurrency_stress 290 s, rt_shell 69 s,
      # l1_mean 20 s), which is why the watchdog override exists: without it the
      # suites' own wedge-watchdogs would abort on instrumentation tax, not on a
      # real hang.
      - name: ThreadSanitizer (concurrency_stress, rt_shell, l1_verb_seam, l1_mean)
        run: |
          KAYFABE_SLOW=1 KAYFABE_STRESS_WATCHDOG_SECS=1800 RUSTFLAGS="-Zsanitizer=thread" \
            cargo +nightly test -p kayfabe-tests \
            --test concurrency_stress --test rt_shell --test l1_verb_seam --test l1_mean \
            -Zbuild-std --target x86_64-unknown-linux-gnu -- --test-threads=1

  mutants:
    name: mutants — L1-surface mutation gate
    # Weekly cron + manual dispatch — a mutation campaign is hours, not minutes.
    if: github.event.schedule == '43 4 * * 6' || github.event_name == 'workflow_dispatch'
    # ★★ MEASURED 2026-07-28 — WITHOUT THIS, A BROKEN SUITE SCORES 100%.
    # cargo-mutants baselines with `--package=<mutated pkgs>` while the mutants
    # themselves run `--workspace`. The baseline therefore runs only ~200 tests
    # across 39 binaries and OMITS `kayfabe-tests` ENTIRELY — the conformance
    # suite that catches most mutants. A red conformance suite would pass the
    # baseline and then make EVERY mutant look CAUGHT. `needs: stable` makes the
    # real suite a precondition of the gate rather than an assumption of it.
    needs: stable
    runs-on: ubuntu-latest
    # No `continue-on-error`: the threshold below IS the gate (see
    # core_mutation_gate.md §L1 baseline for the measurement it is derived from).
    timeout-minutes: 600
    env:
      # ★ KAYFABE_SLOW=1 — a slow-test gate silently weakened a SECURITY gate.
      #
      # This job used to run with KAYFABE_SLOW unset "because the fast path is what
      # makes mutants × suite tractable". Measured consequence: the 73 s pushbuffer
      # proptest fuzz is the ONLY coverage of the untrusted, guest-controlled
      # pushbuffer decoder, and skipping it let decoder mutants survive that the
      # fuzz kills (verified on the decoder scope: 2 missed → 1 with the flag set).
      # So the flag that was introduced to keep the *push* gate fast had, as a side
      # effect, hollowed out the mutation gate exactly where the input is hostile.
      # Cost, honestly: the two gated soaks add ~90 s per mutant, roughly doubling
      # this job's wall clock. It is a weekly cron; correctness of the gate wins.
      KAYFABE_SLOW: '1'
      # ★ CARGO_INCREMENTAL=0 — incremental compilation ICEs inside the mutants
      # temp tree, and cargo-mutants scores a build failure as "unviable".
      #
      # cargo-mutants rewrites one source file per mutant inside a copied tree that
      # reuses one `target/` (and therefore one incremental dep-graph cache). That
      # cache does not survive the churn: rustc aborts with
      # `on_disk_cache.rs: assertion left == right failed`. cargo-mutants cannot
      # tell a compiler crash from a type error, so every ICE'd mutant is filed
      # "unviable" and DROPPED FROM THE DENOMINATOR — silently inflating the score.
      # Measured on the first L1 campaign: 136 of 293 mutant builds ICE'd, and
      # `SourceRegistry::is_empty -> true` was reported unviable while the sibling
      # `-> false` was caught. Turning incremental off removed every ICE.
      # NEVER remove this without re-checking the ICE guard step below.
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-mutants
        run: cargo install --locked cargo-mutants
      # Scope = the L1 surface: kayfabe-rt (the threaded shell's logic), the
      # core's completion-source reactor, and the plan/execute/commit + isolate
      # pool/condemnation code (kayfabe-fwd and kayfabe-isolate are single-file
      # crates, so file scope == crate scope). Same knobs as the L0 campaign
      # (core_mutation_gate.md §Reproduce), except the baseline is NOT skipped:
      # in CI nothing has pre-verified the tree is green, and a broken baseline
      # must fail the campaign rather than poison every mutant's result.
      #
      # `cargo mutants` exits non-zero if ANY mutant survives, which is not the
      # bar this gate holds (see the scoring step) — hence `|| true` here and a
      # threshold check on the recorded outcome files afterwards.
      - name: cargo mutants over the L1 surface
        run: |
          # ★★ SCOPE = EVERY PRODUCTION CRATE. It used to be four hand-picked paths,
          # which by 2026-07-27 covered only ~17k of 41.6k implementation lines — so the
          # threshold described the OLD core while every real defect that week lived in
          # the NEW OS layer (an Arc-ownership R1 violation, a silent-wrap ledger race, an
          # address-blind arena). A gate that measures a shrinking minority reports a
          # number about code nobody is changing.
          #
          # Test scaffolding is excluded in mutants.toml (crates/kayfabe-mocks/**,
          # tests/src/**), not here — mutating an instrument is a category error, and 48%
          # of one run's misses were exactly that.
          # ★★ ABSOLUTE TIMEOUT, AND DELIBERATELY NOT --timeout-multiplier.
          # Measured 2026-07-28: the workspace suite takes 201 s ALONE on a
          # 25-core box, so a 4-vCPU runner at -j 2 is slower still — the old
          # `--timeout 240` sat at or BELOW honest completion. cargo-mutants
          # counts a TIMEOUT as KILLED, so mass timeouts would report ~100 % and
          # the gate would never fire: the failure is silent and one-directional.
          # A multiplier is worse than useless here because it is computed off
          # cargo-mutants' own baseline, which omits `kayfabe-tests` (see the
          # `needs: stable` note) and therefore measures ~14 s.
          cargo mutants --test-workspace true -j 2 \
            --timeout 1800 --build-timeout 900 \
            -f 'crates/*/src/**/*.rs' || true
      # ★ The anti-inflation guard. "Unviable" is supposed to mean "the mutant does
      # not typecheck" (a tool artifact). If it ever again means "rustc crashed",
      # the denominator is fiction and so is the score — so a single ICE in any
      # mutant's build log fails the job outright, BEFORE the threshold is read.
      - name: Guard — no compiler ICE may be scored as "unviable"
        run: |
          if grep -rlq "thread 'rustc'" mutants.out/log/; then
            echo "★ A mutant build ICE'd. cargo-mutants files that as 'unviable',"
            echo "which removes the mutant from the denominator and INFLATES the"
            echo "score. Do not trust this campaign's number. Offending logs:"
            grep -rl "thread 'rustc'" mutants.out/log/ | head -20
            exit 1
          fi
      # ★ The threshold, derived from the measured L1 baseline — not aspirational.
      # score = (caught + timeout) / (caught + timeout + missed); `unviable` is
      # excluded because it is a tool artifact, exactly as in the L0 table.
      # See core_mutation_gate.md §L1 baseline for why the bar sits here and not
      # at L0's 99.2%: this surface is measured, and a gate set above reality is
      # theatre that gets muted after the first red night.
      - name: Score the campaign against the measured L1 threshold
        run: |
          THRESHOLD=${MUTATION_THRESHOLD_PCT}
          n() { if [ -f "mutants.out/$1.txt" ]; then wc -l < "mutants.out/$1.txt"; else echo 0; fi; }
          caught=$(n caught); missed=$(n missed); to=$(n timeout); unviable=$(n unviable)
          killed=$((caught + to)); viable=$((killed + missed))
          if [ "$viable" -eq 0 ]; then
            echo "★ Zero viable mutants — the campaign tested nothing. Failing."
            echo "(The usual cause is a lost --test-workspace: kayfabe-fwd and"
            echo " kayfabe-rt have no unit tests of their own, so without it the"
            echo " harness runs an empty suite and reports everything MISSED.)"
            exit 1
          fi
          score=$((killed * 1000 / viable))
          echo "caught=$caught timeout=$to missed=$missed unviable=$unviable"
          echo "score = $killed/$viable = $((score / 10)).$((score % 10))% (bar: ${THRESHOLD}.0%)"
          if [ "$score" -lt $((THRESHOLD * 10)) ]; then
            echo "★ MUTATION SCORE REGRESSION — below the measured L1 baseline."
            echo "Survivors:"; cat mutants.out/missed.txt
            exit 1
          fi
        env:
          # The bar. Raise it when a campaign measures higher and the new number
          # holds across a run; never lower it to make a red night go away —
          # a survivor is a test gap, and this file is where that gets argued.
          # ⚠ PENDING RE-DERIVATION (2026-07-27). 91 was measured against the OLD
          # four-path scope (~17k of 41.6k lines). The scope above is now every
          # production crate, so this number describes a different population and MUST
          # be re-derived from the first full run under the new scope before it is
          # trusted as a bar. This job is weekly/dispatch only, so a temporarily wrong
          # bar blocks nothing — but do not quote the score until it is re-derived.
          MUTATION_THRESHOLD_PCT: '91'
