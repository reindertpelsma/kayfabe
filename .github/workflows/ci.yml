# CI green-gate (decision #33; the standing decision #15 follow-up).
#
# Two tiers, matching how the repo is actually built:
#
# Every-push gates (fast, deterministic — these stay the bar for landing anything):
# - stable: the main workspace — build, the full fast suite (KAYFABE_SLOW unset:
#   the two measured-slow tests skip loudly, everything else runs), clippy -D
#   warnings, rustfmt --check (both workspaces; the fuzz crate is its own
#   workspace so it needs its own fmt pass), and the §6.2 hexagonal boundary grep
#   (decision #37): the pure logic crates must name NO OS readiness primitive, in
#   code or in comments.
# - aarch64: cross-`cargo check` the whole workspace for arm64 (decision #36).
#   The pure logic core must carry NO x86/CPU-arch assumption, so arm64 (later:
#   Grace-Hopper / Jetson) can be added as an adapter, never a core bolt-on.
#   `cargo check` type-checks without linking, so no cross-toolchain/QEMU is
#   needed — an x86-ism that ever creeps into the core fails THIS gate on the push
#   that introduces it. See docs/design/portability_arm64.md.
# - nightly: the fuzz crate (libfuzzer needs nightly) — a plain `cargo build` in
#   fuzz/ so the one raw-guest-bytes harness KEEPS COMPILING as the core evolves
#   (it is a separate workspace, so nothing else rebuilds it). Actually *running*
#   the fuzzer stays a manual/local gate (`cargo +nightly fuzz run`, see README);
#   CI only pins compilation.
#
# Standing scheduled gates (slow, so not per-push — but STANDING, not
# remembered-by-a-human; that is how 9k lines of L1 once reached master with
# neither TSan nor a mutation run):
# - slow (nightly + dispatch): the whole suite with KAYFABE_SLOW=1 — the
#   pushbuffer proptest fuzz (73 s) and the 16-thread stress soak (≈20 s), the
#   two tests measurement showed dominate the wall clock, actually run.
# - tsan (nightly + dispatch): ThreadSanitizer over the four threaded suites —
#   the §8.2 race ceiling (l1_concurrency.md §12.15 records the first run: 28
#   tests, 0 races).
# - mutants (weekly + dispatch): cargo-mutants over the L1 surface — the
#   core_mutation_gate.md standing gate. Runs with KAYFABE_SLOW=1 (the gated
#   pushbuffer fuzz is the only coverage of the hostile-input decoder, and gating
#   it hollowed out a security gate), CARGO_INCREMENTAL=0 (incremental ICEs get
#   mis-scored as "unviable" and inflate the number), and a HARD threshold read
#   off the measured baseline — see the job's own comments for each.

name: CI

on:
  push:
  pull_request:
    branches: [master]
  schedule:
    # Nightly (slow + tsan) and weekly (mutants) — the job `if:`s key off the
    # exact cron string, so keep these in sync with them.
    - cron: '43 2 * * *'
    - cron: '43 4 * * 6'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  stable:
    name: stable — build, test, clippy, fmt, boundary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          # ★★★ The isolate is EMBEDDED, and it is embedded as a STATIC binary:
          # `crates/kayfabe-isolate-host/build.rs` runs a nested cargo for this triple and
          # `include_bytes!`s the result. Without the target installed, every cargo command
          # in this job fails in the build script. It is a build input, not an optimisation:
          # the isolate is `exec`'d from a memfd inside a mount namespace that has no path to
          # a dynamic loader.
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --workspace
      # (Deliberately not naming a test count here — it rots on every PR.)
      #
      # ★★ KAYFABE_NO_KVM=1 PINS THE OS-FREE CONFIGURATION. GitHub runners have no
      # /dev/kvm, so this job was *already* running that configuration — but by accident
      # of what the runner image happens to lack, which would lapse silently the day an
      # image starts shipping the device. The guarantee it protects is architectural: the
      # pure logic core must stay testable with NO OS layer, or we lock in Linux/KVM/QEMU/
      # x86 semantics and only find out when a second VMM or a second architecture is
      # attempted. `kayfabe-mocks` is the backend for this configuration.
      #
      # The with-KVM configuration is covered on developer boxes and the bench; the
      # reached-count gate below is what stops the gated tests from silently vanishing
      # from BOTH.
      - name: Test (OS-free configuration — KVM forced absent)
        run: KAYFABE_NO_KVM=1 cargo test --workspace 2>&1 | tee /tmp/kayfabe-test.log; exit "${PIPESTATUS[0]}"
      # ★★ KVM-gate non-vacuity. GitHub runners do NOT provide /dev/kvm, so the ~33
      # tests that need a real VM fd SKIP here — and a skip that nobody counts is the
      # "green instrument on an unexercised path" failure this repo cares most about
      # (testing_doctrine.md §1). CI therefore asserts the gated tests were REACHED,
      # not that they ran: RAN + SKIPPED must meet the floor. Each test binary is its
      # own process, so the counting has to be external to the harness.
      #
      # This exists because CI was RED for three commits (1336ce1, 42d850c, 0a6826c)
      # while the local suite was green on a box that happens to have KVM. The floor
      # is what stops the reverse failure: all 33 quietly vanishing and CI staying
      # green.
      - name: KVM-gate reached-count (floor, not an exact match)
        run: |
          set -euo pipefail
          ran=$(grep -c 'KVM-GATE: RAN' /tmp/kayfabe-test.log || true)
          skipped=$(grep -c 'KVM-GATE: SKIPPED' /tmp/kayfabe-test.log || true)
          total=$(( ran + skipped ))
          echo "KVM-gate: ran=$ran skipped=$skipped total=$total (floor 35)"
          if [ "$total" -lt 35 ]; then
            echo "::error::KVM-gated tests were not reached: $total < 35." \
                 "Either they were deleted, or the gate stopped announcing itself." \
                 "A silent skip is worse than a red build."
            exit 1
          fi
          if [ "$ran" -gt 0 ]; then
            echo "This runner has /dev/kvm: $ran gated tests actually executed."
          fi
      # ★★ SANDBOX-gate non-vacuity — the same argument as the KVM gate above, for the
      # tests that need a mount or user namespace. They are the ONLY tests that assert the
      # isolate's containment (a `/dev` descriptor that cannot name `..`, a child that holds
      # no capability), so a runner where they silently stop running is a runner where a
      # security property stops being checked while the build stays green.
      #
      # Deliberately a floor over RAN+SKIPPED and not an exact match: the gated set grows.
      # The `RAN` line is printed too, so a job that HAS the capability says how many
      # actually executed rather than leaving it to be inferred.
      - name: SANDBOX-gate reached-count (floor, not an exact match)
        run: |
          set -euo pipefail
          ran=$(grep -c 'SANDBOX-GATE: RAN' /tmp/kayfabe-test.log || true)
          skipped=$(grep -c 'SANDBOX-GATE: SKIPPED' /tmp/kayfabe-test.log || true)
          total=$(( ran + skipped ))
          echo "SANDBOX-gate: ran=$ran skipped=$skipped total=$total (floor 10)"
          if [ "$total" -lt 10 ]; then
            echo "::error::sandbox-gated tests were not reached: $total < 10." \
                 "Either they were deleted, or the gate stopped announcing itself." \
                 "These are the tests that assert the isolate cannot reach the host" \
                 "filesystem and holds no capability; a silent skip is worse than red."
            exit 1
          fi
          if [ "$ran" -gt 0 ]; then
            echo "This runner permits namespaces: $ran gated tests actually executed."
          fi
      # ★★ VBIOS-ORACLE-gate non-vacuity — the same argument as the two gates above, for the
      # tests that run NVIDIA's OWN VBIOS parser (`tests/oracle/vbios_oracle.c`, compiled by
      # `tests/build.rs` out of the vendored open-kernel-modules trees).
      #
      # ★ Its honest limit, stated rather than glossed: **GitHub's runners do not have those
      # trees**, and nothing is vendored here to stand in for them, so on THIS runner the
      # suite is counted and never passes. It is a developer-box and bench gate. That is the
      # KVM gate's failure mode repeated knowingly, and the floor is the only thing that
      # stops the tests vanishing from both places at once.
      #
      # Why it is nonetheless worth a step: what the oracle tests catch is a MISREADING
      # SHARED between the VBIOS builder and its transcribed Rust test oracle — measured, by
      # transposing `StoredSize` and `PKCDataOffset` in both at once: `kayfabe-abi`'s own 94
      # tests stayed GREEN and the real parser answered
      # `failed to parse/prepare Falcon ucode … 0x37` (NV_ERR_INVALID_OFFSET). No amount of
      # Rust-side testing reaches that class.
      #
      # Floor 10 = the ten tests in the suite; a floor, not an equality, because the set grows.
      - name: VBIOS-ORACLE-gate reached-count (floor, not an exact match)
        run: |
          set -euo pipefail
          ran=$(grep -c 'VBIOS-ORACLE-GATE: RAN' /tmp/kayfabe-test.log || true)
          skipped=$(grep -c 'VBIOS-ORACLE-GATE: SKIPPED' /tmp/kayfabe-test.log || true)
          total=$(( ran + skipped ))
          echo "VBIOS-oracle gate: ran=$ran skipped=$skipped total=$total (floor 10)"
          if [ "$total" -lt 10 ]; then
            echo "::error::VBIOS-oracle tests were not reached: $total < 10." \
                 "Either they were deleted, or the gate stopped announcing itself." \
                 "These are the ONLY tests that judge the synthetic VBIOS against the" \
                 "real driver's parser rather than against a transcription of it;" \
                 "a silent skip is worse than a red build."
            exit 1
          fi
          if [ "$ran" -gt 0 ]; then
            echo "This machine has the vendored ogkm trees: $ran oracle tests actually executed."
          fi
      - name: Clippy (-D warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Format check
        run: cargo fmt --all --check
      # ★ The hexagonal boundary gate (l1_concurrency.md §6.2, decision #37). The
      # completion-source reactor's MODEL is core-owned and PURE: the core says
      # "notifiable source" and "completion source", full stop. The OS half — the
      # source→host-primitive table, the real wait loop, the real wake — is L1's
      # adapter, and adapters do not live in these crates. A logic-crate diff that
      # names an OS readiness primitive has breached the boundary, in code OR in a
      # comment, so this greps both. Exit-code polarity: `grep -r` returns 0 on a
      # HIT (= boundary breach = fail) and 1 on no match (= the success case), hence
      # the `if`, never a bare `grep` under `set -e`.
      - name: Hexagonal boundary gate (no OS vocabulary in the pure logic crates)
        run: |
          pure="crates/kayfabe-core crates/kayfabe-completion crates/kayfabe-fwd \
                crates/kayfabe-mmu crates/kayfabe-gsp crates/kayfabe-rmrpc crates/kayfabe-arch \
                crates/kayfabe-abi \
                crates/kayfabe-util crates/kayfabe-trace crates/kayfabe-isolate crates/kayfabe-vmm"
          if grep -rniE 'eventfd|epoll|timerfd|rawfd|libc|O_NONBLOCK' $pure; then
            echo ""
            echo "★ BOUNDARY BREACH — l1_concurrency.md §6.2."
            echo "The pure logic crates own the completion-source MODEL, never the OS"
            echo "readiness machinery: no host descriptor types, no syscall names, not"
            echo "even in comments. The lines above name one. Move it into the L1"
            echo "adapter and refer to it from the core as a 'notifiable source' /"
            echo "'completion source'. Reword the comment; never weaken this gate."
            exit 1
          fi
      # ★ The VMM-VOCABULARY gate (l1_os_shell.md §6.0, decision #39) — the sibling of
      # the hexagonal gate, for the OTHER axis of portability.
      #
      # The hexagonal gate above keeps OS vocabulary out of the pure crates. Nothing
      # kept *hypervisor* vocabulary out of anything — and hypervisor-agnosticism is a
      # founding requirement of this port (`kayfabe-vmm`'s crate docs; arch §4.1's
      # "count is not the invariant; hypervisor-agnosticism is"). The structural tell
      # that it had gone unwritten: the word "agnostic" appears ZERO times in
      # l1_concurrency.md and l1_os_shell.md combined. A requirement restated nowhere
      # below the architecture doc is one the next adapter quietly breaks.
      #
      # Scope = the 11 pure logic crates PLUS `kayfabe-rt`. The shell is an adapter for
      # *threads and locks*, deliberately outside the hexagonal list — but it is not a
      # hypervisor adapter, and the concurrency shape it encodes (`SharedDevice`'s
      # `&self` ranked locking) is precisely what a second backend must be able to reuse.
      #
      # ★ It gates API IDENTIFIERS, never the string "QEMU". That is the whole design:
      # naming the adapter crates (`kayfabe-vmm-qemu`, `kayfabe-vmm-ch`), citing a QEMU
      # source file, or writing "QEMU's BQL is one instance of the class" must all stay
      # writable — so the pattern names things that only ever appear when QEMU's API has
      # leaked inward (`BQL_LOCK_GUARD`, `memory_region_*`, `qdev_*`, `QEMUBH`), plus the
      # two English phrases that are pure QEMU idiom ("bottom half", "main loop"). No
      # allowlist exists and none is ever needed: every legitimate mention is rephrasable
      # in one word ("the VMM's global lock", "the adapter's serialized executor"), and a
      # gate with an allowlist is a gate with a negotiation.
      #
      # The two English idioms carry a LEADING \b, and it is load-bearing rather than
      # tidiness: without it `main.?loop` matches the ordinary phrase "do-main loop"
      # (and any word ending in "main" followed by "loop"). A gate that fires on English
      # is a gate that gets muted, which is the §5.1 lesson applied one section early.
      # The trailing side needs no anchor — "main-loop", "mainloop" and "main_loop" must
      # all match, which is exactly what `.?` plus no trailing anchor gives.
      #
      # Exit-code polarity, as above: `grep -r` exits 0 on a HIT, and a hit here is the
      # FAILURE case — hence the `if`, never a bare `grep` under `set -e`. (This polarity
      # has been got wrong twice in this repo; it is written out at all three gates for
      # that reason.)
      - name: VMM-vocabulary gate (no hypervisor API vocabulary in the core or the shell)
        run: |
          portable="crates/kayfabe-core crates/kayfabe-completion crates/kayfabe-fwd \
                    crates/kayfabe-mmu crates/kayfabe-gsp crates/kayfabe-rmrpc \
                    crates/kayfabe-arch crates/kayfabe-abi \
                    crates/kayfabe-util crates/kayfabe-trace crates/kayfabe-isolate \
                    crates/kayfabe-vmm crates/kayfabe-rt crates/kayfabe-shell"
          # ★ `crates/kayfabe-shell` ADDED 2026-07-29 (task #100). This step is named
          # *"…in the core or the shell"* and did not cover the crate literally called
          # `kayfabe-shell` — the L1 OS shell, which owns the reactor and the executor
          # thread, i.e. exactly the code a QEMU-ism would reach for. `kayfabe-rt` (the
          # L1 *threaded* shell) was in the list and `kayfabe-shell` was not; that reads
          # as an omission when the second crate was split out, not as a decision. It is
          # clean today, so this widens the gate's reach without moving anything.
          if grep -rniE '\bBQL\b|bql_lock|qemu_mutex_lock_iothread|BQL_LOCK_GUARD|MemoryRegion|memory_region_|qemu_bh|QEMUBH|aio_bh|qdev_|VMStateDescription|\bbottom.?half|\bmain.?loop|iothread' $portable; then
            echo ""
            echo "★ HYPERVISOR-VOCABULARY BREACH — l1_os_shell.md §6.0."
            echo "The core and the L1 shell must name hypervisor CAPABILITIES, never one"
            echo "hypervisor's API. The lines above name QEMU's. A CH/rust-vmm port must"
            echo "cost one adapter crate and zero trait changes; every QEMU-ism that"
            echo "reaches these crates is a line of that adapter written in the wrong"
            echo "place. Reword to the capability:"
            echo "  QEMU's BQL / iothread lock -> 'the VMM's global lock' (§6.3's CLASS:"
            echo "                                'a lock the VMM owns, that we neither"
            echo "                                 construct nor rank')"
            echo "  bottom half / main loop    -> 'the adapter's serialized executor'"
            echo "  MemoryRegion / qdev_*      -> the Vmm trait method that means it"
            echo "Naming the adapter crates (kayfabe-vmm-qemu, kayfabe-vmm-ch) never trips"
            echo "this gate — it matches API identifiers, not the vendor's name. So there"
            echo "is no allowlist, and there is nothing to argue about in review."
            exit 1
          fi
      # ★ The GENERATION-NAME gate (CLAUDE.md rule 1, decision #37's third axis) — the
      # third vocabulary gate, and the one that was DOCUMENTED BUT ABSENT. CLAUDE.md has
      # said "Grep gate (CI): no `Ampere|Turing|Hopper|Blackwell|Ada|V5\d\d` in any logic
      # crate" since the repo was founded; ci.yml never had it, and on 2026-07-27 two
      # independent agents went looking for it and found nothing. A gate that exists only
      # in a rulebook is the same green-instrument-on-an-unexercised-path this suite is
      # about, one level up: nobody was reading it, so nobody could see it was not there.
      #
      # The rule it enforces: **a concrete GPU generation or driver version is a fact about
      # ONE chip, and one chip's facts live in an arch-impl crate.** Rule 2 is that adding
      # a generation costs `impl Arch for <Gen>` plus maybe one `GmmuFmt`, with ZERO edits
      # to any logic crate; the moment a logic crate can say the chip's name, that
      # invariant is enforceable only by review.
      #
      # Three scope decisions, each of which had to go the way it did:
      #
      # 1. **`kayfabe-abi` is OUT** — the one deliberate difference from the hexagonal
      #    gate's `pure=` list, which is otherwise copied verbatim so the lists stay in
      #    sync. Axis A quarantine (CLAUDE.md rule 1) puts the concrete driver version in
      #    `kayfabe-abi` ON PURPOSE: `kayfabe-abi/src/lib.rs:11` says so in as many words,
      #    and the crate is built out of `V575`/`NVOS46_PARAMETERS_V580` version tables.
      #    Running this gate over it would fail on ~15 lines that are the crate's whole
      #    reason to exist. The GPA-accessor gate below already sets the precedent for a
      #    documented scope difference; this is the second.
      # 2. **Comment lines are OUT** — the deliberate departure from the other gates'
      #    "prose counts" rule, and it is a departure, so here is the evidence. The pure
      #    crates carry 14 generation-name mentions today and every one is legitimate:
      #    `kayfabe-arch/src/gsp.rs` cites `ogkm`'s per-generation source files by path
      #    (`gsp/arch/turing/kernel_gsp_tu102.c`, `falcon/arch/ampere/kernel_falcon_ga102.c`)
      #    — those citations ARE the ground truth this crate is derived from, and a rule
      #    that forbade them would mean deriving the traits from an unnameable source;
      #    and `kayfabe-arch/src/lib.rs:20-24, 349` TEACHES rule 2 by writing out
      #    `struct Ampere; impl Arch for Ampere` in a doc example, i.e. the prose that
      #    would trip the gate is the prose that states the gate. Prose counts where prose
      #    is rephrasable (the hexagonal gate: "eventfd" -> "notifiable source"); a source
      #    citation is not rephrasable, so here it does not.
      #    ★ The consequence is stated so nobody has to rediscover it: a chip name hidden
      #    in a trailing comment on a code line still trips this gate (the filter drops
      #    whole comment LINES, not trailing ones), and a chip name in a `///` doc line
      #    does not. If that ever stops being true — if a leak arrives dressed as a doc —
      #    the fix is a narrower filter, never a wider allowlist.
      # 3. **Anchors, per name, for the same reason the VMM gate anchors its two English
      #    idioms.** Most names carry a LEADING \b and no trailing one, so `ampere_pte`,
      #    `turingFmt` and `HopperGmmu` are all caught — an identifier is exactly how a
      #    chip fact actually leaks. Three names are the exception and carry BOTH anchors,
      #    because each is a prefix of ordinary vocabulary this repo uses constantly:
      #    `Ada` ("adapter", "adaptive"), `Volta` ("voltage"), `Pascal` (`pascal_case`,
      #    "PascalCase"). A gate that fires on the word "adapter" in a hexagonal-
      #    architecture codebase is a gate that gets muted within the day.
      #
      # Exit-code polarity: `grep -r` exits 0 on a HIT and a hit is the FAILURE case, as at
      # every gate here. This one needs a second filter stage, so it takes the
      # unsafe-surface gate's form instead of the `if grep` form — captured output, the
      # pipeline ending in `|| true` (without it, `grep -v` exiting 1 on "everything was
      # filtered" — the SUCCESS case — would abort the step under `set -e` and the gate
      # would pass by crashing), and the verdict as `[ -n "$hits" ]`.
      - name: Generation-name gate (no concrete chip or driver version in the logic crates)
        run: |
          pure="crates/kayfabe-core crates/kayfabe-completion crates/kayfabe-fwd \
                crates/kayfabe-mmu crates/kayfabe-gsp crates/kayfabe-rmrpc crates/kayfabe-arch \
                crates/kayfabe-util crates/kayfabe-trace crates/kayfabe-isolate \
                crates/kayfabe-vmm"
          hits=$(grep -rniE \
            '\b(kepler|maxwell|turing|ampere|lovelace|hopper|blackwell|rubin)|\b(ada|pascal|volta)\b|\b(g[kmpvab][0-9]{3}|tu1[0-9]{2}|ad1[0-9]{2}|gh[0-9]{3}|v[56][0-9]{2})\b' \
            $pure | grep -vE '^[^:]*:[0-9]+:[[:space:]]*(//|/\*|\*)' || true)
          if [ -n "$hits" ]; then
            echo "$hits"
            echo ""
            echo "★ GENERATION-NAME BREACH — CLAUDE.md rule 1."
            echo "The lines above name a concrete GPU generation, chip or driver version"
            echo "in a PURE LOGIC crate. That is one chip's fact, and rule 2 is that a"
            echo "chip's facts cost an adapter and ZERO logic-crate edits. What to do:"
            echo "  - a value that differs per generation -> put it behind a kayfabe-arch"
            echo "    TRAIT (Arch / GmmuFmt / UserdModel), and give it a name that says"
            echo "    what it MEANS, not which chip has it."
            echo "  - the concrete number itself       -> an arch-impl crate"
            echo "    (\`impl Arch for <Gen>\`), never a logic crate. kayfabe-mocks::MockArch"
            echo "    is the standing proof the seam holds without one."
            echo "  - a concrete DRIVER version        -> kayfabe-abi (Axis A quarantine),"
            echo "    which is out of scope here precisely because that is its job."
            echo "  - an \`ogkm\` source citation        -> keep it, on its OWN comment line."
            echo "    Whole comment lines are out of scope; a trailing comment on a code"
            echo "    line is not."
            echo "Never widen the pattern to make a leak fit: the whole value of this gate"
            echo "is that the answer is always 'move it', never 'allow it here'."
            exit 1
          fi
      # ★ The UNSAFE-SURFACE gate — the auditability rule, landed while it is free.
      #
      # The workspace is `unsafe_code = "forbid"` (root `Cargo.toml`,
      # `[workspace.lints.rust]`), so today this gate has nothing to find. That is
      # precisely why it lands now: the L1 OS adapter (`kayfabe-linux-raw`) will need
      # ONE audited relaxation, and a naming convention introduced *after* the first
      # exception exists is a convention nobody can trust retroactively.
      #
      # The rule it enforces, in full: **an auditor must be able to enumerate the
      # entire unsafe surface with `ls`.** So any `.rs` file that uses the keyword
      # must be named `*_unsafe.rs`. `#![forbid(unsafe_code)]` stays workspace-wide
      # and is what actually BANS it; this gate is what makes the eventual exception
      # findable without reading 50 files.
      #
      # Three details decide whether a gate like this is real or decorative:
      #
      # 1. **Exit-code polarity.** `grep -l` exits 0 on a HIT — and a hit here is a
      #    VIOLATION, the inverse of the usual reading. So the verdict is an
      #    `if [ -n "$offenders" ]` over captured output, and the pipeline that
      #    produces it ends in `|| true`: without that, `find -exec grep +` returning
      #    1 for "no matches" (the SUCCESS case) would abort the step under `set -e`
      #    and the gate would pass by crashing.
      # 2. **Prose counts.** A mention in a comment, doc or string is a violation
      #    too. Not because a comment is dangerous, but because a gate whose verdict
      #    depends on reading intent is one that eventually gets mis-read — and the
      #    cost is asymmetric: prose can always be reworded, a block cannot.
      # 3. **The one exception is lexical, not editorial.** `grep -w` counts `_` as a
      #    word character, so the LINT NAME `unsafe_code`, the lint
      #    `unsafe_op_in_unsafe_fn`, and the filename suffix `_unsafe.rs` never
      #    match — while `unsafe {`, `unsafe fn`, `unsafe impl`, `` `unsafe` `` and
      #    `thread-unsafe` all do. So the rule stays writable *by construction*: say
      #    `unsafe_code`, or put it in a `*_unsafe.rs` file. No allowlist, no
      #    per-file judgement, nothing to argue about in review.
      #
      # ★ AXIS A, and until 2026-07-29 (task #100) NOTHING ENFORCED IT.
      #
      # CLAUDE.md rule 1 says, verbatim: *"Quarantine: `#[repr(C)]` NVIDIA layouts live
      # ONLY in `kayfabe-abi` (Axis A)"*, and ARCHITECTURE.md's port table repeats it.
      # There was a gate for the generation name (Axis B), a gate for the hypervisor
      # vocabulary (Axis D) and a gate for the unsafe surface — and none for the rule
      # the driver-version axis actually turns on. It held at HEAD, but it held by
      # discipline: on 2026-07-29 `kayfabe-isolate-host` was written against a REAL
      # driver, and a struct transcribed inline there rather than into `kayfabe-abi`
      # would have made a 610 driver a retrofit with nothing saying so.
      #
      # TWO crates may carry `#[repr(C)]`, and they are quarantines of two DIFFERENT
      # foreign ABIs — which is why this is a two-entry list and not one:
      #   kayfabe-abi       — NVIDIA's wire layouts (Axis A). Version-dispatched.
      #   kayfabe-linux-raw — the KERNEL's uapi structs (Axis C). Already the sole
      #                       `unsafe` crate; a uapi mirror is exactly the surface its
      #                       audit is for, and it is the crate a kernel change edits.
      # A third entry is a design decision about where a foreign ABI is allowed to
      # live, not a CI edit — same rule as AUDITED in the unsafe-containment gate.
      #
      # ★★★ 2026-07-30 — THE RULE IS NOW A PREDICATE, NOT A LIST. Owner ruling, stage Q2.
      #
      # The hypervisor seam needs C layouts and no existing crate fits: `kayfabe-abi` is
      # codegen'd from the open kernel modules and quarantines NVIDIA's ABI (our seam's
      # structs would dilute what that crate MEANS), and `kayfabe-linux-raw` holds OS
      # syscall wrappers and must stay OS-generic for the aarch64 and musl cross-checks.
      # The obvious fix — add a third crate name above — was REFUSED, and the reasoning is
      # worth keeping because it is this repository's most expensive recurring mistake:
      #
      #   ★ Lengthening an exemption list weakens the rule with ZERO RED TESTS, and sets
      #     the precedent for a fourth. `gates_quantified_over_a_list` records three
      #     separate instances. An exemption list cannot say WHY, so the next reader
      #     cannot tell a considered entry from a convenient one.
      #
      # So the gate now asks the question the rule was always about:
      #
      #     Is this layout FOREIGN, or is it OUR OWN WIRE?
      #
      # Foreign means somebody else decides when it changes — a driver release, a kernel
      # release — and that is the whole hazard: a layout frozen into a crate with no
      # version dispatch. Own-wire means both sides are files in THIS repository.
      #
      # ★★ OWN-WIRE MUST BE PROVED, NOT ASSERTED, and the proof is two facts this gate
      # checks directly:
      #
      #   (1) a repository-local C header declares a structure of the SAME NAME. Same
      #       name, not a mapping: a hand-maintained Rust-name-to-C-name table would be
      #       the list problem one level down, and identical names let a shell gate
      #       re-derive the proof without parsing Rust.
      #   (2) the declaring crate carries `tests/wire_mirror.rs`, which enforces the
      #       mirror in BOTH directions — every C layout has a header counterpart AND
      #       every header structure has a Rust one. Clause (1) alone would admit a type
      #       whose name merely happens to appear somewhere; (2) is what makes the pair a
      #       maintained invariant. This is the `*_unsafe.rs` doctrine reused: a naming
      #       convention `ls` can enumerate, never an allowlist.
      #
      # ★★★ IT FAILS CLOSED. A `#[repr(C)]` anywhere outside the quarantine crates is
      # refused unless BOTH proofs hold, so this is strictly STRONGER than the rule it
      # replaces: previously a third crate needed a CI edit and got one; now a fourth
      # needs no CI edit and cannot arrive without both proofs. A logic crate cannot
      # acquire a C layout by any route, which is the property that must not have been
      # loosened and is negative-tested three ways.
      #
      # ★ Why not flatten the structures instead and keep two crates? Because it is LESS
      # safe. `KayfabeHostOps` is a function-pointer table; an untyped array plus an index
      # makes all thirteen call sites transmute-by-position and stops the compiler
      # checking arity and signature at the exact seam where a mistake is a memory-safety
      # bug. Simpler only in gate-satisfaction terms.
      #
      # `find` over the whole repo, not a crate list: a new crate is covered the day it
      # is added (the failure mode the enumerated gates below this one still have).
      # Comment lines are out of scope, by the same rule and the same expression the
      # generation-name gate uses — a doc citing `#[repr(C)]` in prose is how these
      # invariants get explained, and four such lines exist today.
      - name: ABI-quarantine gate (Axis A — a C layout is quarantined, or provably own-wire)
        run: |
          # Every repository-local C header, once. A structure declared in one of these is
          # something WE wrote; anything else is somebody else's release schedule.
          headers=$(find . -name '*.h' \
                      -not -path './target/*' -not -path './*/target/*' \
                      -not -path './mutants.out/*' || true)

          fail=0
          # Candidates: every C-layout attribute outside the two quarantine crates. Comment
          # lines are out of scope, by the same expression the generation-name gate uses.
          #
          # ★ The attribute must START its line, which is how one is written and is also the
          # only way this gate can avoid matching a STRING LITERAL — `wire_mirror.rs` has to
          # be able to name the attribute in order to scan for it, and the previous gate
          # reported that scanner as an offender. Same shape as the unsafe-surface gate,
          # whose own mirror assembles the keyword from fragments for the same reason; the
          # test does that too, so this anchor is a second line of defence and not the only
          # one. Known lexical limit, stated: an attribute written mid-line after a `;` or a
          # `{` is not matched. There are none, and the compiler makes that spelling rare.
          while IFS=: read -r file line _; do
            [ -z "$file" ] && continue
            crate=$(echo "$file" | sed -nE 's|^\./(crates/[^/]+)/.*|\1|p')

            # The type name: the next `struct`/`union`/`enum` at or after the attribute.
            ty=$(tail -n +"$line" "$file" \
                 | grep -m1 -oE '(struct|union|enum) [A-Za-z_][A-Za-z0-9_]*' \
                 | awk '{print $2}')

            # PROOF (1) — a repository-local header declares the SAME NAME.
            mirrored=""
            if [ -n "$ty" ] && [ -n "$headers" ]; then
              mirrored=$(grep -l -E "^\} ${ty};" $headers 2>/dev/null || true)
            fi
            # PROOF (2) — the declaring crate enforces the mirror in BOTH directions.
            proof=""
            if [ -n "$crate" ] && [ -f "$crate/tests/wire_mirror.rs" ]; then
              proof="yes"
            fi

            if [ -n "$mirrored" ] && [ -n "$proof" ]; then
              continue
            fi
            fail=1
            echo "$file:$line: \`$ty\` is a C layout and is NOT provably own-wire:"
            [ -z "$ty" ]       && echo "    - the attribute is not on a named type"
            [ -n "$ty" ] && [ -z "$mirrored" ] && \
              echo "    - no repository-local header declares \`} $ty;\`  (proof 1 FAILED)"
            [ -z "$proof" ] && \
              echo "    - ${crate:-that crate} has no tests/wire_mirror.rs (proof 2 FAILED)"
          # ★ Process substitution, NOT a heredoc. A heredoc's terminator must start at
          # column 0, which ends the YAML block scalar this whole step lives in — the step
          # then parses as a truncated fragment and the runner reports ZERO steps rather
          # than a failure. Watched happening. Gate B above uses the same form for the same
          # reason.
          done < <(find . -name '*.rs' \
                     -not -path './crates/kayfabe-abi/*' \
                     -not -path './crates/kayfabe-linux-raw/*' \
                     -not -path './target/*' -not -path './*/target/*' \
                     -not -path './mutants.out/*' \
                     -exec grep -Hn '^[[:space:]]*#\[repr(C' {} + 2>/dev/null \
                   | grep -vE '^[^:]*:[0-9]+:[[:space:]]*(//|/\*|\*)' || true)

          if [ "$fail" -ne 0 ]; then
            echo ""
            echo "★ ABI-QUARANTINE BREACH — CLAUDE.md rule 1, Axis A."
            echo "A C layout may live outside the quarantine crates ONLY when it is"
            echo "provably OUR OWN WIRE FORMAT rather than somebody else's ABI. Foreign is"
            echo "the DEFAULT, because the hazard is a layout whose owner decides when it"
            echo "changes: one driver version's (or one kernel's) memory shape, frozen into"
            echo "a crate with no version dispatch. Four ways out, no fifth:"
            echo "  - an NVIDIA wire struct -> kayfabe-abi, and give it a"
            echo "    kayfabe_abi::versions::DriverAbiTable arm if its shape has ever"
            echo "    differed across versions. Encode/decode over a byte slice; the"
            echo "    crate's own convention is that callers never see the layout."
            echo "  - a KERNEL uapi struct  -> kayfabe-linux-raw, in a *_unsafe.rs file,"
            echo "    where the unsafe audit already covers it."
            echo "  - OUR OWN wire format   -> declare the counterpart structure under the"
            echo "    SAME NAME in a repository-local .h, and add tests/wire_mirror.rs to"
            echo "    the crate so the pair is enforced in BOTH directions. Both proofs, or"
            echo "    it is foreign."
            echo "  - none of these         -> you do not need repr(C). Rust's default"
            echo "    layout is correct for anything that is not crossing an ABI."
            echo "There is no exemption list to add a name to, and that is deliberate:"
            echo "lengthening one weakens the rule with no test going red."
            exit 1
          fi

      # `find` walks the whole repo minus build output, rather than a list of known
      # directories: a gate that enumerates today's crates stops covering the code
      # the moment someone adds one.
      - name: Unsafe-surface gate (every unsafe file is named *_unsafe.rs, so `ls` enumerates it)
        run: |
          offenders=$(find . -name '*.rs' -not -name '*_unsafe.rs' \
                        -not -path './target/*' -not -path './*/target/*' \
                        -not -path './mutants.out/*' \
                        -exec grep -lw unsafe {} + || true)
          if [ -n "$offenders" ]; then
            echo "$offenders"
            echo ""
            echo "★ UNSAFE-SURFACE BREACH — the *_unsafe.rs naming rule."
            echo "An auditor must be able to enumerate the ENTIRE unsafe surface with"
            echo "\`ls\`: every .rs file that uses the keyword is named *_unsafe.rs, and"
            echo "the files above are not. Two legitimate fixes, no third:"
            echo "  - real unsafe code  -> move it into a *_unsafe.rs module, and"
            echo "    justify the relaxation there (the workspace lint is 'forbid')."
            echo "  - a comment or doc  -> reword it. Naming the LINT, \`unsafe_code\`,"
            echo "    never trips this gate, and neither does the suffix _unsafe.rs."
            echo "Never widen the pattern and never add an allowlist: the moment this"
            echo "gate needs a judgement call, \`ls\` stops being the audit."
            exit 1
          fi
      # ★★ The HOST-POINTER half of gate C (l1_os_shell.md §9.3, §4.1.1, §4.6's ex-row 10,
      # decision #33). §9.3 has described gate C as two-sided since it was written —
      # "`unsafe` appears in a file not named *_unsafe.rs, OR a host pointer type
      # (`*mut`/`*const`/`NonNull`/`transmute`) appears outside one" — and only the
      # first half was implemented. This is the second half. Added 2026-07-28.
      #
      # ★ Honest scope, so nobody over-reads it. Three limits, all deliberate:
      #
      # 1. It is per-FILE, not per-VISIBILITY. A `pub fn` returning `*mut u8` from
      #    INSIDE a *_unsafe.rs file passes this gate and passes every trybuild row
      #    (a compile-fail test asserts that ONE written snippet fails; the
      #    crate-boundary rule is universally quantified over the API surface, which
      #    is why §4.6's row 10 was never expressible as a trybuild row and is a CI
      #    gate instead). The property holds in today's tree by construction — the
      #    pointer types occur only in PRIVATE fields inside *_unsafe.rs — so this is
      #    a ratchet against tomorrow, not a hole being closed.
      # 2. `usize`-as-an-address, the fourth shape decision #33 names, is not
      #    lexically detectable at all. `no_base_address.rs` covers its constructive
      #    instance (`.base()`/`.addr()`/a public field); nothing covers it in general.
      # 3. Line comments are stripped before matching, unlike the `unsafe` half where
      #    prose deliberately counts. The reason is the same "the rule must stay
      #    writable" argument that makes `unsafe_code` a lexical escape there:
      #    `kayfabe-linux-raw/src/lib.rs` has to be able to NAME the forbidden types
      #    in order to state the rule (:35, :61, :77 do exactly that). A block comment
      #    is a known lexical gap; there are none today.
      #
      # `PhantomData<…>` is erased before matching. Not an allowlist — a PhantomData
      # is zero-sized and cannot carry an address by construction, and
      # `PhantomData<*mut ()>` is the standard !Send marker (kayfabe-rt/src/lock.rs).
      #
      # Exit-code polarity: same trap as the gate above. `grep` exits 1 on NO match,
      # which is the SUCCESS case here, so every grep ends in `|| true` and the
      # verdict is an `if [ -n … ]` over captured output. Note the loop body uses
      # `if`/`fi` rather than `[ -n "$hits" ] && …`, because the `&&` form returns 1
      # on the common (clean) path and would abort the step under `set -e`.
      - name: Host-pointer gate (no *mut/*const/NonNull/transmute outside *_unsafe.rs)
        run: |
          offenders=""
          while IFS= read -r f; do
            hits=$(sed -e 's|//.*||' -e 's|PhantomData<[^>]*>||g' "$f" \
                   | grep -nE '\*mut |\*const |NonNull|transmute' || true)
            if [ -n "$hits" ]; then
              offenders="$offenders$(echo "$hits" | sed "s|^|$f:|")
          "
            fi
          done < <(find . -name '*.rs' -not -name '*_unsafe.rs' \
                     -not -path './target/*' -not -path './*/target/*' \
                     -not -path './mutants.out/*')
          if [ -n "$(echo "$offenders" | tr -d '[:space:]')" ]; then
            echo "$offenders"
            echo ""
            echo "★ HOST-POINTER BREACH — gate C's second half (l1_os_shell.md §9.3)."
            echo "A host CPU address type appears in a file that is not named"
            echo "*_unsafe.rs. A raw pointer is unsafe to HOLD even in safe code, and"
            echo "the whole audit claim of decision #33 is that host addresses do not"
            echo "leave \`kayfabe-linux-raw\`'s *_unsafe.rs files. Two fixes, no third:"
            echo "  - real pointer code -> move it into a *_unsafe.rs module, behind a"
            echo "    bounded type (MappedRegion / RegionView / VolatileRegion). It must"
            echo "    not appear in any signature reachable from outside the crate."
            echo "  - a comment or doc  -> whole-line comments are already stripped, so"
            echo "    a hit means it is on a CODE line. Move the prose to its own line."
            echo "Never widen the pattern and never add an allowlist: the exception is"
            echo "lexical (PhantomData is a ZST), never editorial."
            exit 1
          fi
      # ★★★ The GPA-ACCESSOR gate (l1_os_shell.md §6.1/§6.3/§10.1 item 6, the 2026-07-27
      # contact round). `Vmm::gpa_read`/`gpa_write` are the ONLY in-lock-legal capability
      # that takes a GUEST-CHOSEN address, and their legality rests entirely on the
      # implementation being unable to reach VMM-global API. On a real backend that is
      # decided at run time by which region the guest's number lands on — a lock inversion
      # the guest constructs on demand, invisible to the type system, to the lock ranks
      # (a lock we do not take ourselves has no rank), to the written list of VMM
      # functions an in-lock-legal method may call, and to the other three greps here.
      #
      # The defence is a POSITIVE proof (`kayfabe_vmm::GuestRamMap`) plus ONE core-side
      # classification site (`kayfabe_fwd::guest_read`), because a second call site is a
      # second place a refusal can be folded into a generic fault — which is exactly what
      # the code did before (`map_err(|_| FwdFault::GpaRead { .. })`, discarding the
      # variant that says "the guest aimed at a device").
      #
      # Scope = the PURE crates only. `kayfabe-mocks` implements the accessors (that is
      # its job), `kayfabe-rt` passes a `&mut dyn Vmm` through without calling them, and
      # the tests drive both sides deliberately.
      #
      # Exit-code polarity, as at every gate above: `grep -r` exits 0 on a HIT, and a hit
      # is the FAILURE case — hence the `if`, never a bare `grep` under `set -e`.
      - name: GPA-accessor gate (exactly one core-side classification site)
        run: |
          pure="crates/kayfabe-core crates/kayfabe-completion crates/kayfabe-mmu \
                crates/kayfabe-gsp crates/kayfabe-rmrpc crates/kayfabe-arch crates/kayfabe-abi \
                crates/kayfabe-util crates/kayfabe-trace crates/kayfabe-isolate"
          if grep -rnE '\.gpa_(read|write)\(' $pure; then
            echo ""
            echo "★ GPA-ACCESSOR BREACH — l1_os_shell.md §6.1 / §10.1 item 6."
            echo "Guest-physical access belongs to ONE core-side site,"
            echo "kayfabe_fwd::guest_read, which classifies the refusal:"
            echo "  VmmError::NonRamGpa -> FwdFault::NonRamGpa  (the guest aimed a"
            echo "                         descriptor at a DEVICE register window; on a"
            echo "                         real backend serving it takes the VMM's global"
            echo "                         lock beneath one of our ranked locks)"
            echo "  anything else       -> FwdFault::GpaRead    (nothing is there)"
            echo "Route the access through it. Never re-derive the classification, and"
            echo "never map_err(|_| ..) it away — the discarded variant IS the finding."
            exit 1
          fi
          n=$(grep -cE '\.gpa_(read|write)\(' crates/kayfabe-fwd/src/lib.rs || true)
          if [ "$n" != "1" ]; then
            echo ""
            echo "★ GPA-ACCESSOR BREACH — kayfabe-fwd has $n guest-memory access sites,"
            echo "expected exactly 1 (kayfabe_fwd::guest_read). See the message above."
            exit 1
          fi
      # ★ The BRIDGE-EXCLUSIVITY gate (docs/design/gsp_core_bridge.md §1.2, which asks for
      # it in as many words: "It is the ONLY crate in the tree permitted to name both
      # `RpcCommand` and `RmEvent`. That is a one-line CI grep and should be added as one").
      #
      # What it protects. The lattice has ONE crate where the GSP transport's decoded
      # command meets the core's object-model vocabulary, and the placement is argued three
      # ways: `kayfabe-core` may name no NVIDIA struct layout; `kayfabe-abi` may not depend
      # on the core; and `kayfabe-gsp` must not acquire a core dependency, because a GSP FSM
      # that can see the RM graph can start firing on graph state — protocol-not-trace
      # violated one level down, and precisely the shape the C fell into when a control
      # command's side effect on the object model became a transport-level action
      # (`C:2835-2837`). None of those three is expressible as a dependency rule alone: a
      # crate can name both types the moment it happens to depend on both.
      #
      # Scope = `crates/*/src` only. The conformance suite composes every crate by
      # definition — that is its job — so including `tests/` would gate the instrument
      # rather than the lattice (same reasoning that keeps `kayfabe-mocks` out of the
      # mutation denominator). A crate's own `tests/` directory is out for the same reason.
      #
      # `grep -w` so `RmEventKind` or a `RpcCommands` field never trips it, and prose
      # counts: naming both types in a comment is how a doc claims a seam it does not have,
      # which is exactly the drift `gsp_core_bridge.md` §8 had to correct in two places.
      #
      # Exit-code polarity, as at every gate here: a HIT is the failure, so the verdict is
      # `if [ -n ... ]` over captured output and every grep ends in `|| true`.
      - name: Bridge-exclusivity gate (one crate names both RpcCommand and RmEvent)
        run: |
          offenders=""
          for d in crates/*/src; do
            crate=$(basename "$(dirname "$d")")
            case "$crate" in kayfabe-rmrpc) continue;; esac
            names_cmd=$(grep -rlw RpcCommand "$d" || true)
            names_ev=$(grep -rlw RmEvent "$d" || true)
            if [ -n "$names_cmd" ] && [ -n "$names_ev" ]; then
              offenders="$offenders $crate"
            fi
          done
          if [ -n "$offenders" ]; then
            for c in $offenders; do
              echo "=== $c"; grep -rnw -e RpcCommand -e RmEvent "crates/$c/src" || true
            done
            echo ""
            echo "★ BRIDGE-EXCLUSIVITY BREACH — gsp_core_bridge.md §1.2."
            echo "The crates above name BOTH the GSP transport's decoded command and the"
            echo "core's object-model event. There is exactly one seam between those two"
            echo "vocabularies and it is kayfabe-rmrpc. Two fixes, no third:"
            echo "  - real code -> call kayfabe_rmrpc::translate and pass the RmEvent on."
            echo "    A second translation site is a second source of truth for namespace"
            echo "    attribution, which is THE thing this seam gets right."
            echo "  - a comment -> reword it. Naming one of the two is always fine; a"
            echo "    doc that names both is usually a doc claiming a seam it does not own"
            echo "    (§8 corrects two such claims)."
            exit 1
          fi
      # ★ The OGKM-VERSION-TAG gate — mode2_gsp_port_plan.md §0.1, correction brief B11.
      #
      # `ogkm` is not a tree, it is a FAMILY of trees, and a citation that does not say
      # which one it came from is unverified by definition. Two are vendored and they are
      # different specifications: ogkm-580 (580.159.04, the driver the bench actually runs)
      # and ogkm-610 (610.43.02). They disagree BEHAVIOURALLY on the GSP path, not
      # cosmetically — the element layout, the element-count semantics, the transport
      # headers, the init-args struct, the boot-FSM ordering and the suspend sentinel's
      # comparison all differ, the whole msgq library sits at a different PATH, and
      # NV_CHANNEL_ALLOC_PARAMS diverges at +32 INSIDE the supported range, which mis-reads
      # every field beyond it. One plan row was once marked RESOLVED with the answer that is
      # backwards for the driver we face, which is what this gate exists to stop recurring.
      #
      # Gate A is a hard zero: the crates are code, and a citation there is the argument for
      # what an offset or an ordering IS. Gate B is a ratchet rather than a zero because the
      # 160 doc citations are debt this gate's own commit did not adjudicate — and pretending
      # otherwise with a blanket exemption is how a gate becomes permanent decoration.
      #
      # ★ Note the docs ratchet is EXACT-equality, same polarity as the unsafe ratchet below:
      # driving the debt down is the goal, and it must show up as a reviewed constant change
      # rather than as silent slack a later citation can be added into.
      #
      # ★ Scope note: `ogkm-580:` / `ogkm-610:` do not contain the substring `ogkm:`, so the
      # tagged forms are invisible to this grep and no allowlist is needed. Prose that MENTIONS
      # the defect (the rule's own text in mode2_gsp_port_plan.md §0.1 writes a bare `ogkm:` to
      # define it) is counted in the docs baseline rather than special-cased — a
      # mention-vs-use exception would be a pattern this gate could not keep honest.
      #
      # Same exit-code polarity trap as the gates around it: a `grep` HIT is the failure.
      - name: "ogkm-version-tag gate (every NVIDIA citation names its tree)"
        run: |
          # --- Gate A: ZERO bare `ogkm:` citations in ANY Rust source.
          # ★ `tests/` is in scope, not just `crates/`. The mock guest (tests/src/gspworld.rs)
          # and the wire helper (tests/src/rpcwire.rs) do not merely describe the driver, they
          # MODEL it, and every test judges production code against that model. The oracle was
          # once 610-shaped for BOTH profiles (correction brief B1) — an untagged citation there
          # is a wrong test, which is worse than a wrong comment because it reports green.
          hits=$(grep -rn 'ogkm:' crates tests fuzz --include='*.rs' 2>/dev/null || true)
          if [ -n "$hits" ]; then
            echo "$hits"
            echo ""
            echo "★ UNTAGGED-CITATION BREACH — mode2_gsp_port_plan.md §0.1."
            echo "The lines above cite NVIDIA source as plain 'ogkm:', which does not say"
            echo "WHICH vendored tree the claim was read from. Two are vendored and they"
            echo "are different specifications:"
            echo "  ogkm-580: = research_clones/ogkm-580.159.04/  (580.159.04)"
            echo "              ★ the bench's own driver. Governs when the two disagree."
            echo "  ogkm-610: = research_clones/ogkm/             (610.43.02)"
            echo "Re-read the claim against a tree and tag it. Three outcomes, all legitimate:"
            echo "  - holds at BOTH, identically -> cite both, e.g."
            echo "        (\`ogkm-610: rpc.c:10856\`, \`ogkm-580: :11051\`)"
            echo "    This is a load-bearing negative result, not a shrug: it tells the next"
            echo "    reader there is no version seam here, so nobody adds a version profile"
            echo "    for a struct that has none."
            echo "  - DIFFERS between the tags -> that is a SEAM. Tag it with the version it"
            echo "    describes and say what the other tag does. A version-split fact is a"
            echo "    profile/table entry, NEVER an \`if version ==\` in a logic crate."
            echo "  - the path or line MOVED -> correct it, with the tag. The whole msgq"
            echo "    library is src/common/shared/msgq/ at 580 and"
            echo "    src/nvidia/src/libraries/msgq/ at 610; path drift is as dangerous as"
            echo "    content drift and less visible."
            echo "Line numbers belong to the tagged tree ONLY — never carry one across a tag,"
            echo "even where the code is byte-identical."
            echo "If the citation says what it claims at NEITHER tag, do not quietly repoint"
            echo "it: that is a phantom, and it is the most valuable thing you can find."
            exit 1
          fi
          # --- Gate B: the docs ratchet — a reviewed constant, driven toward zero.
          # 160 -> 161: 3987106 (the gsp_core_bridge reconciliation) added one more
          # line of PROSE ABOUT THE NOTATION -- "a bare `ogkm:` is untagged and
          # unverified by definition" -- which is the same legitimate use that makes
          # this a ratchet rather than a hard zero (mode2_gsp_port_plan.md:59 quotes
          # a bare citation in order to DEFINE the defect, so a zero-gate would fire
          # on its own charter). Raise this only for that reason, and say which
          # commit and which line; never raise it to absorb a real untagged citation.
          EXPECTED_DOC_CITATIONS=161
          actual=$(grep -rho 'ogkm:' docs --include='*.md' | wc -l | tr -d ' ')
          echo "untagged doc citations: $actual (bar: $EXPECTED_DOC_CITATIONS)"
          if [ "$actual" -ne "$EXPECTED_DOC_CITATIONS" ]; then
            echo ""
            echo "★ OGKM DOC RATCHET MOVED — mode2_gsp_port_plan.md §0.1."
            echo "Expected $EXPECTED_DOC_CITATIONS untagged doc citation(s), found $actual."
            echo "If you ADDED one: don't. Tag it — see the three outcomes above."
            echo "If you REMOVED one (thank you): change the number here in the same commit."
            echo "A ratchet that only catches growth leaves slack a later citation can be"
            echo "added into without anything saying so."
            grep -rn 'ogkm:' docs --include='*.md' | sed 's/^/  /' || true
            exit 1
          fi
      # ★ The UNSAFE-CONTAINMENT gates — A, B and the ratchet (l1_os_shell.md §4.1).
      #
      # Landed WITH `kayfabe-linux-raw`, because that crate is what makes them necessary.
      # `unsafe_code = "forbid"` cannot be relaxed by an `allow` inside a crate — that is
      # the point of `forbid` — so the one crate that needs the relaxation must OMIT
      # `[lints] workspace = true` and restate its lints. That creates a silent opt-out for
      # the whole workspace: any future crate that merely forgets the inheritance block
      # loses `forbid` with no diagnostic at all. Gate A closes it.
      #
      # Gate C (above) already pins the *file naming*; these pin the *containment*:
      #  A — every package except kayfabe-linux-raw inherits the workspace lints;
      #  B — the keyword lives in exactly one crate's src/, so gate C's `ls` is an `ls` of
      #      one directory rather than of the repo;
      #  ratchet — the block COUNT matches a committed number, so a new relaxation is a
      #      reviewed commit with an argument, and cannot drift upward inside a debugging
      #      diff. Raising it is a one-line change that shows up in review; the clippy lint
      #      `undocumented_unsafe_blocks = deny` (that crate's Cargo.toml) makes each one
      #      carry its own `// SAFETY:`, which is what makes the §11 review tractable.
      #
      # Same exit-code polarity trap as the three gates above: a `grep` HIT is the failure.
      # ★★ AMENDED AT L2-Q STAGE Q0 (l2_qemu_adapter.md §2.2, decision Q2). The three
      # sub-gates below moved from a **constant** — one crate, one number — to a **named
      # list with a per-crate expected count**, because the QEMU adapter needs a second
      # audited raw crate and gate A's own failure text said what that costs:
      #
      #   "There is exactly ONE crate allowed to omit it (kayfabe-linux-raw), and adding
      #    a second is a design decision, not a manifest edit."
      #
      # The decision has been made and here is its price, stated rather than argued away:
      # the acceptance criterion this whole gate exists to protect — "read one crate in
      # one sitting" — becomes "read two". The reason it is nonetheless the right split is
      # that QEMU is not Linux: `kayfabe-linux-raw` is licensed to hold host-side *OS*
      # specificity, not host-side *hypervisor* specificity, and folding an FFI surface
      # for a hypervisor into it would make the OS crate un-auditable in a different way.
      #
      # ★★★ `kayfabe-qemu-raw` 0 -> 31 AT STAGE Q2, 2026-07-30 — the stage that gives the
      # crate its first contents. The bar was 0 precisely so that this had to be a reviewed
      # commit rather than a manifest edit, and here is the review. Five groups:
      #
      #   shim_unsafe.rs (31), and the whole file is the surface:
      #
      #   [G1] 13 calls into the C shim's primitive table — one per method of the
      #        `QemuHost` port that has a foreign implementation. Each is
      #        `unsafe { (table.f)(device_token, ...) }` with its own `// SAFETY:` naming
      #        its own obligation: the table was validated at adopt time, the token is the
      #        one that table came with, and — for the two copy primitives — the buffer
      #        bound we pass is the bound the C is required to honour.
      #        ★ THIRTEEN IS THE SURFACE, NOT A STYLE. A macro emitting the call would
      #        collapse all thirteen into ONE textual relaxation, because this ratchet
      #        counts source tokens and a macro body is one token. That is gaming the
      #        instrument. There really are thirteen foreign calls with thirteen different
      #        obligations, and the count says so.
      #
      #   [G2]  8 `extern "C"` entry points the C shim calls: realize, unrealize,
      #        region_add, region_del, bar_move_requested, note_bar_mapping,
      #        install_window, audit. Each carries a `# Safety` clause stating what the
      #        caller must guarantee about the handle and the out-parameters. A ninth entry
      #        point, the ABI-number query, takes no address and is therefore SAFE and not
      #        counted — which is what makes it usable as the first call, before anything
      #        has been validated.
      #
      #   [G3]  6 structure reads/writes across the seam: the primitive table, the realize
      #        configuration and one topology section are `ptr::read`; the register array is
      #        `slice::from_raw_parts`; the handle and the audit block are writes through
      #        caller-supplied out-parameters. All six are plain `Copy` data with no
      #        ownership in it, so none can leak or double-drop.
      #
      #   [G4]  2 `unsafe impl` — Send and Sync for the device token. It is an opaque value
      #        this crate never dereferences, so the claim is about the C side's obligation
      #        (stated in kayfabe_shim.h) and not about anything Rust can see. Kept as two
      #        explicit relaxations with a written argument rather than laundered through
      #        an `AtomicPtr`, which would confer both for free and record nothing.
      #
      #   [G5]  2 handle/allocation transitions: `Box::from_raw` in unrealize (the ONE place
      #        the plane is reclaimed) and the single `&*handle` in `borrow`.
      #
      # ★★ WHAT WAS FOLDED, so the number is not padded. An earlier draft was 42. Three
      # private helpers — the out-parameter writer, `borrow`, and the table adopter — were
      # `unsafe fn`s that every caller re-acknowledged, which cost ~20 blocks to say one
      # thing twenty times. Each has exactly ONE kind of caller: an entry point that is
      # already `unsafe` and whose `# Safety` clause states the very precondition the helper
      # needs. They are now ordinary functions with one documented relaxation inside each.
      #
      # ★★★ AND THE RATCHET'S OWN PATTERN WAS WRONG, found by being its first FFI consumer.
      # `unsafe (\{|fn |impl |trait )` cannot match `unsafe extern "C" fn` — the dominant
      # form in a foreign-function crate, i.e. exactly what this crate was added to hold. It
      # counted 23 of 31 and called it a complete audit. The pattern now also matches an
      # `extern "C"` DEFINITION (`fn ` followed by a name), and deliberately not the
      # `Option<unsafe extern "C" fn(...)>` FIELD TYPES, which are declarations and not
      # relaxations.
      #
      # ★★★ `kayfabe-linux-raw` 60 -> 73 AT THE EMBEDDED-ISOLATE CHANGE. All 13 are in
      # `spawn_unsafe.rs`, itemised block-by-block in the list below, and every one of them
      # is `std::process::Command`'s mechanism moving INTO the audited crate rather than new
      # surface appearing: `Command` cannot `exec` a descriptor and cannot `clone`, so it
      # could express neither of the two properties this change is for. `sandbox_unsafe.rs`
      # is UNCHANGED at 9 — re-measured, not carried forward — which is itself the finding
      # recorded in its module docs: a branch written to handle "born in a user namespace"
      # was poisoned to prove it was load-bearing, the test passed anyway (the nested
      # `unshare(CLONE_NEWUSER)` works), and the branch was deleted rather than shipped
      # untested.
      #
      # ★★ THE CORRECTION DOES NOT MOVE THE OTHER CRATE'S BAR, RE-MEASURED AT THIS TIP.
      # `kayfabe-linux-raw` is 60 under the corrected pattern and 60 under the old one,
      # because it contains ZERO occurrences of `unsafe extern` in any form — checked across
      # every file including `sandbox_unsafe.rs`, which is new in this same merge and added
      # three of that 60. This is stated as a re-measurement and not as a number carried
      # forward: the pattern changed in one commit and the bar changed in another, they
      # landed together, and "it was 57 when I looked" would have been a claim about a tree
      # that no longer exists.
      - name: "Unsafe-containment gates (A: forbid inheritance, B: the named crates, ratchet)"
        run: |
          # ★ THE ONE LIST. `crate:expected-relaxations`, and all three sub-gates read it.
          # A crate is exempt from gate A, permitted *_unsafe.rs files by gate B, and
          # counted by the ratchet if and only if it appears here — so "which crates may
          # contain the unsound surface?" is answered by reading one line.
          AUDITED="kayfabe-linux-raw:77 kayfabe-qemu-raw:31"

          # --- Gate A: every package but the named ones inherits `unsafe_code = "forbid"`.
          missing=""
          for m in crates/*/Cargo.toml tests/Cargo.toml; do
            exempt=0
            for entry in $AUDITED; do
              case "$m" in "crates/${entry%%:*}/Cargo.toml") exempt=1;; esac
            done
            [ "$exempt" -eq 1 ] && continue
            grep -q '^\[lints\]' "$m" && grep -q '^workspace = true' "$m" || missing="$missing $m"
          done
          if [ -n "$missing" ]; then
            echo "★ FORBID-INHERITANCE BREACH — l1_os_shell.md §4.1 gate A."
            echo "These manifests do not inherit the workspace lints, so they are NOT"
            echo "covered by \`unsafe_code = \"forbid\"\` and nothing would have said so:"
            for m in $missing; do echo "  $m"; done
            echo "Add:"
            echo "  [lints]"
            echo "  workspace = true"
            echo "The crates allowed to omit it are EXACTLY these, and adding a third is a"
            echo "design decision, not a manifest edit:"
            for entry in $AUDITED; do echo "  ${entry%%:*}"; done
            exit 1
          fi

          # --- Gate B: the surface lives in the named crates' src/, and nowhere else.
          # ★ An ARRAY, not a string. The string form was written first and it made this
          # gate PASS BY CRASHING: an unquoted `$prune` is word-split AND glob-expanded,
          # so `./crates/<c>/src/*` became a list of real filenames, `find` died with
          # "paths must precede expression", and the empty output read as "no offenders".
          # Exactly the green-instrument-on-an-unexercised-path failure this suite is
          # about, inside the gate that enforces it.
          prune=()
          for entry in $AUDITED; do
            prune+=( -not -path "./crates/${entry%%:*}/src/*" )
          done
          outside=$(find . -name '*_unsafe.rs' "${prune[@]}" \
                      -not -path './target/*' -not -path './*/target/*' \
                      -not -path './mutants.out/*' || true)
          if [ -n "$outside" ]; then
            echo "$outside"
            echo ""
            echo "★ UNSAFE-CONTAINMENT BREACH — l1_os_shell.md §4.1 gate B."
            echo "The unsound surface lives in the audited crates' src/ ONLY:"
            for entry in $AUDITED; do echo "  crates/${entry%%:*}/src/"; done
            echo "The files above are elsewhere. Move the code, or the audit stops being"
            echo "'read the audited crates in one sitting', which is its acceptance"
            echo "criterion."
            exit 1
          fi

          # --- The ratchet: the number of relaxations is a reviewed constant PER CRATE.
          # Counts the syntactic forms only (`unsafe {`, `unsafe fn/impl/trait`), so prose
          # inside those files — which gate C permits there — cannot inflate it.
          #
          # kayfabe-linux-raw (50). ★ 7 -> 25 at M2-c (l1_os_shell.md §10), the stage that
          # gives the raw crate its first consumers. ★ 25 -> 37 at M2-d, the stage that
          # gives it a reactor and a guest. ★ 37 -> 47 at L1-#91, the stage that gives it
          # a HOST GPU and a child process (host_execution_plane.md §3 step 2): until then
          # the entire host side of this project was a double, and a double needs no
          # syscalls. The three new files are argued at the bottom of this list.
          # ★ 49 -> 50 at L2-Q stage Q2, the stage that gives it a machine it did not
          # create: ONE block, in kvm_unsafe.rs, argued in full below.
          # ★★ 50 -> 57 CLOSING THE MEASURED HOST-FILESYSTEM ESCAPE. Six new blocks in
          # `sandbox_unsafe.rs` and one in `chardev_unsafe.rs`, all argued below. The bar
          # moved because the isolate's `/dev` descriptor was measured to open
          # `../etc/shadow` on a real host — an `O_PATH` dirfd restricts enumeration and
          # places NO restriction on `..` — and the only fix is a mount namespace plus a
          # `pivot_root`, which is six syscalls glibc either does not wrap or must not be
          # allowed to swallow the return value of. The seventh block is the probe that
          # makes the fix MEASURABLE rather than argued; it is why the bar is raised for a
          # security fix and not only for a feature.
          # ★★ 57 -> 60 CLOSING THE PRIVILEGE HALF. Three new blocks, all in
          # `sandbox_unsafe.rs`, itemised in full below: the capability drop the C carries
          # (`prctl`, `capget`, `capset`) and the read-back that turns "we dropped them"
          # from a sequence of calls into a checked outcome. The filesystem containment
          # landed around a process that still held EVERY capability, which is what made
          # this the same piece of work and not a follow-up.
          # The surface, per file, each block carrying its
          # own `// SAFETY:` (clippy `undocumented_unsafe_blocks = deny`):
          #   window_unsafe.rs  (7) — the GuestWindow: one mmap, one MAP_FIXED shared by
          #     place/restore, one munmap in Drop, two copy_nonoverlapping, and the two
          #     PER-TYPE `Send`/`Sync` grants (§14.5 item 1 asked for exactly this shape,
          #     argued per type, never one blanket impl).
          #   host_fd_unsafe.rs (9) — from_raw_fd (the ONE adoption site), memfd_create,
          #     ftruncate, F_ADD_SEALS, F_DUPFD_CLOEXEC, the notify descriptor's create,
          #     write and read, and getrlimit (the §3.8 descriptor budget: the core's
          #     source cap may not be set optimistically past the process's real limit).
          #   kvm_unsafe.rs     (4) — open(/dev/kvm), the by-value ioctl, the memslot
          #     ioctl, and ★ ADDED AT L2-Q STAGE Q2 (host_execution_plane.md §1): the
          #     `BorrowedFd::borrow_raw` in `KvmVm::discover_in_this_process`. Under §1 the
          #     hypervisor RESERVES the guest-physical window and does not back it, and we
          #     install the memslots that shadow it — which means we need the descriptor of
          #     a VM WE DID NOT CREATE. There is no API for that: the descriptor is an
          #     anonymous inode, so `/proc/self/fd/N` cannot be re-opened (measured: ENXIO)
          #     and it must be DUPLICATED, which needs a `BorrowedFd` over a number read
          #     out of `/proc/self/fd`. This is the C's own mechanism
          #     (`C: src/qemu/virtio_nvgpu.c:1114-1141`, which scans for the same symlink
          #     target because the header that would expose the handle is target-only).
          #     ★ Its SAFETY comment states an obligation it CANNOT discharge — that no
          #     other thread closed the number in between — and closes the resulting
          #     descriptor-identity hazard by re-reading the link of the descriptor it now
          #     OWNS, which no other thread can change. Losing the race is a refusal, never
          #     a wrong machine. The residual (the number closed AND recycled onto a second
          #     VM) needs a second VM to exist, which the ambiguity arm already refuses.
          #   mapping_unsafe.rs (6) — ★ ADDED TO THE ITEMISATION AT Q0, not to the count:
          #     the list below this line accounted for 30 of the 37 the ratchet has been
          #     asserting since M2-d, and the two files that make up the other 7 were
          #     never named. The bounded mapping primitive: the mmap, the munmap in Drop,
          #     the two MAP_FIXED arms (place / restore), the bounds-checked view
          #     projection, and the mprotect.
          #   sysconf_unsafe.rs (1) — the page-size query, the one syscall the geometry
          #     newtype is derived from.
          #   epoll_unsafe.rs   (3) — M2-d, the readiness set: create, ctl (shared by
          #     watch/unwatch), and the wait. Level-triggered, keyed on a caller-chosen
          #     token that is deliberately NOT the descriptor (§3.2's O3 argument).
          #   vcpu_unsafe.rs    (8) — M2-d, the guest: KVM_RUN, the mmap of the shared run
          #     structure and its munmap in Drop, the read of the exit union, the write of
          #     an MMIO load's completion, the two by-reference register ioctls, and the
          #     per-type `Send` grant for a vCPU (one runner thread owns one; `Sync` is
          #     deliberately withheld).
          #   chardev_unsafe.rs (4) — ★ L1-#91, the RM connection: open(O_PATH) of the
          #     device DIRECTORY (so an isolate with no path to /dev can still name its
          #     nodes), openat of a device node, and THE ioctl. The third is the one that
          #     matters: it is the only place in the workspace where a host CPU address is
          #     written into a caller-supplied buffer, it is bounds-checked before the write
          #     and SCRUBBED after the syscall, so §4.2.1's "no host address crosses a crate
          #     boundary" is a property of the values the caller can observe rather than of
          #     who wrote the keyword.
          #     ★ 3 -> 4: `DevDir::can_reach`, an `openat(O_RDONLY)` that immediately closes
          #     what it opened. It exists so the containment question is a SYSCALL rather
          #     than a comment — this file's own docs once argued the descriptor was bounded
          #     and it was not. Its invariant is the same as `openat`'s neighbour above (a
          #     live owned dirfd, a `&CStr` path outliving the call) and it takes ownership
          #     through the same checked `adopt_fd`, so nothing is leaked on either arm.
          #   signal_unsafe.rs  (6) — ★ L1-#91, the break signal (§7.2, C #73): zeroing a
          #     sigaction, sigemptyset, sigaction WITHOUT SA_RESTART, gettid, getpid, and
          #     tgkill. Six blocks for what reads as three calls because each libc entry
          #     point is relaxed separately rather than one block spanning the function —
          #     the house rule is that every SAFETY comment's invariant is established on a
          #     line above it, and a single block would have four unrelated invariants.
          #   spawn_unsafe.rs   (16) — ★★★ 3 -> 16 AT THE EMBEDDED-ISOLATE CHANGE. The
          #     whole of `std::process::Command` was removed from the spawn path and the file
          #     now owns fork/exec/wait outright, so the +13 is a mechanism moving INTO the
          #     audited crate rather than new surface appearing. It buys three things that
          #     were previously impossible and were all named as gaps in this same file's
          #     docs: the isolate is `exec`'d from a **sealed memfd** with no path anywhere
          #     (`KAYFABE_ISOLATE_BIN` and the `current_exe()` sibling search are deleted —
          #     this process hands the child a descriptor for `/dev`, and it used to let an
          #     environment variable choose which binary that was); the child is **cloned into
          #     its own pid namespace**, which `unshare` after `exec` can never do; and the
          #     uid/gid map handshake exists at all. Each is argued below.
          #
          #     The image (4): `memfd_create` — ONE block for both attempts, because the
          #       `MFD_EXEC` retry differs by a single flag bit and has the identical
          #       obligation (a `&CStr` name, nothing else dereferenced); the `from_raw_fd`
          #       that adopts the result; the write loop, whose bound IS the caller's slice
          #       length; and `F_ADD_SEALS`, an integer bitmask on a live descriptor.
          #     The child half of the descriptor contract (2): `adopt_inherited_fd`'s liveness
          #       probe and its `from_raw_fd`, two blocks because the second's invariant IS
          #       the first's result.
          #     The post-`fork` child (2): `child_after_fork` is an `unsafe fn` (its
          #       precondition — "only in a just-forked child, on a plan built before the
          #       fork" — is a real soundness contract and belongs in the signature) plus the
          #       ONE block that discharges it. Deliberately not split per call: the
          #       async-signal-safety argument is about the whole sequence, and five SAFETY
          #       comments would each be unable to state the invariant that matters. The two
          #       helpers it calls (`errno_now`, `report_and_exit`) are ORDINARY functions
          #       with one block each — they are sound to call anywhere, and marking them
          #       `unsafe fn` cost two extra relaxations to restate a contract their caller
          #       already carries.
          #     The fork (1): `fork` in the plain case, raw `clone` with the C's flag word in
          #       the namespaced one (`C: nvkvm_isolate.c:124-133`), and the child-side
          #       dispatch — one block, because "the child never returns from here" is the
          #       invariant and it spans all three.
          #     Reaping (2): `kill` and `waitpid`. Two, because the invariant differs: `kill`
          #       must argue that the pid has NOT been reaped (a recycled pid is a signal to a
          #       stranger), `waitpid` that it is ours to wait on.
          #     Parent-side plumbing (3): `dup_above`'s `F_DUPFD_CLOEXEC` and its
          #       `from_raw_fd` (same two-block shape as `adopt_inherited_fd`, same reason),
          #       and `geteuid`/`getegid` in `write_child_maps` — read in the PARENT, because
          #       the map line must name the ids the outer namespace uses.
          #     ★ `errno_now` and `report_and_exit` account for the remaining 2 blocks.
          #   sandbox_unsafe.rs (9) — ★★ THE CONTAINMENT, and the reason it is nine and not
          #     one: every entry point is a syscall whose RETURN VALUE is the security
          #     property, so each gets its own checked wrapper rather than one block
          #     spanning the sequence. `unshare_` (mount / user namespace),
          #     `mount_` (the ONE mount entry point — the private-propagation flip, the
          #     scratch tmpfs, each device bind AND the read-only reseal all go through it,
          #     so there is exactly one place a return could be dropped and the C's R4-L1
          #     audit finding — a silently ignored reseal, i.e. a writable sandbox root —
          #     cannot recur), `pivot_root_` (no libc wrapper exists on any target),
          #     `umount_detach`, `outer_ids` (getuid/getgid, which cannot fail and must be
          #     read BEFORE the uid_map is written), and the capability probe in
          #     `can_unshare`, which forks a child that calls `unshare` and `_exit` and
          #     nothing else. Everything else in the sequence is plain
          #     `std::fs` and needs no relaxation at all — this runs in the child's own
          #     `main`, not post-`fork`, so the async-signal-safety constraint that shapes
          #     `spawn_unsafe.rs` does not apply here.
          #     ★★ 6 -> 9 CLOSING THE PRIVILEGE HALF (#96). The filesystem containment shipped
          #     around a process that still held `CapEff = 000001ffffffffff` — measured, on
          #     the host this ships on — which is a boundary with a key taped to it:
          #     `CAP_SYS_PTRACE` reaches the PARENT's memory, and the parent holds the KVM
          #     descriptor and all guest RAM. The three new blocks are the C's capability
          #     drop (`C: src/qemu/nvkvm_isolate.c:66-81`) plus the read-back that makes it
          #     checkable:
          #       `prctl_`  — ONE block for every process-control operation, because they
          #         all have the same shape and the same invariant: `prctl` is variadic and
          #         each of `PR_SET_NO_NEW_PRIVS`, `PR_SET_DUMPABLE`, `PR_CAPBSET_READ`,
          #         `PR_CAPBSET_DROP`, `PR_CAP_AMBIENT` and the two `PR_GET_*` reads passes
          #         its arguments BY VALUE. No memory crosses to the kernel, so there is
          #         nothing per-call to argue and five copies of one sentence would be five
          #         places for it to rot.
          #       `capget_` / `capset_` — two blocks, not one, because the direction is the
          #         invariant: one has the kernel WRITE into a local array, the other has it
          #         READ one. Both pass a version-3 header and an array of exactly the two
          #         `CapData` words that ABI requires — passing fewer is the one way to make
          #         `capget` write out of bounds, and the array's TYPE is what prevents it.
          #         `pid: 0` in the header means "this thread", so no other process is
          #         addressed by either.
          #     ★ The refusal is on the MEASUREMENT, not on the calls: individual failures
          #     are tolerated (`PR_CAPBSET_DROP` answers EINVAL past the last capability by
          #     design), then `privileges()` is read again and one surviving bit returns Err
          #     — which drops the `DevDir` on the way out, so the isolate never receives a
          #     device descriptor it would have been holding with privilege. Watched to fire:
          #     deleting the `PR_CAPBSET_DROP` loop makes `enter` REFUSE, not pass.
          #
          # ★★ 60 -> 62 AT WORK-SUBMISSION RUNG 2. Two blocks, both in
          #    `mapping_unsafe.rs`, both `unsafe impl` and NEITHER a new syscall:
          #    `Send`/`Sync` for `VolatileRegion`. Itemised because the ratchet is a
          #    review gate, not a counter:
          #      - Send  — the same argument as `GuestWindow`'s, one layer in: the type
          #        owns a process-wide mapping, its fields are immutable after `map`, and
          #        `munmap` from another thread is valid.
          #      - Sync  — ★ the one place in this crate where `Sync` is the DEFINITION
          #        rather than a residual. Every accessor is a `Relaxed` atomic load or
          #        store of one naturally-aligned word through `&self`; the width trait is
          #        private with two impls, so there is no bulk accessor and nothing to
          #        tear. Contrast `GuestWindow::Sync`, which explicitly does NOT claim the
          #        race away.
          #    WHY IT IS NEEDED: an RM connection's GPFIFO ring and USERD are mapped once
          #    and shared by the isolate's whole worker pool, and `RmBackend: Send + Sync`
          #    is structural (a `Proc` stores the boxed backend inside a `Sync` `Gpu`).
          #    Without these two the pool would have to be a single worker. No syscall
          #    surface is added by this rung at all — the mapping primitive it uses
          #    (`Backing::DeviceFile`) reuses the existing `mmap` block.
          #
          # ★★★ 75 -> 77 AT WORK-SUBMISSION RUNG 3 (the doorbell). Two blocks, both inside
          #    ONE new free function, `mapping_unsafe.rs::release_fence`, and they are two
          #    rather than one because they are two different architectures' instructions:
          #      - x86_64 — `core::arch::x86_64::_mm_sfence()`. No operands, no memory
          #        access, no preconditions beyond SSE, which is baseline for the target.
          #      - aarch64 — `asm!("dsb st")`. Same: no operands, touches no memory,
          #        `preserves_flags` only. Deliberately NOT `nomem`, because the entire
          #        point is that it orders memory.
          #    WHY IT IS NEEDED, and why nothing safe would do: stores into a
          #    write-combining mapping are not ordered against each other, and
          #    `core::sync::atomic::fence(Release)` emits **no instruction at all** on
          #    x86-64 — it is a compiler barrier. A doorbell rung without a real store
          #    fence can reach the GPU before the pushbuffer bytes it announces, and the
          #    engine then executes whatever was in the ring before, silently. This is
          #    NVIDIA's own `os_flush_cpu_write_combine_buffer`. Watched to fire: with the
          #    doorbell store removed, R15 reports `sem 0x00000000 GP_GET 0 GP_PUT 1` on
          #    RTX 3090 / 580.159.04 — i.e. the seam this fence protects is live, not
          #    hypothetical.
          #    ★ No syscall surface is added: the fence is one instruction and no fd.
          #
          # kayfabe-qemu-raw (0) — L2-Q stage Q0. Nothing yet, and §2.2's "itemise the
          # second crate's blocks exactly as the first crate's 37 are" is therefore
          # DEFERRED to stage Q2, which is when there will be blocks to itemise. Q2 owes
          # this comment that itemisation in the same commit that moves this 0.
          fail=0
          for entry in $AUDITED; do
            c="${entry%%:*}"; want="${entry##*:}"
            # `find ... -exec ... +` rather than a glob: a crate with NO *_unsafe.rs files
            # must count 0, and an unmatched glob would make grep fail the step instead.
            #
            # ★★ RECURSIVE, and it was NOT until 2026-07-29 (task #100, the five-axis
            # seam audit). This loop carried `-maxdepth 1`, and gate B's prune above is
            # `-not -path "./crates/<c>/src/*"` — whose `*` matches slashes. Between them,
            # a `*_unsafe.rs` file ONE DIRECTORY DEEPER was invisible to BOTH: gate C
            # (the naming gate) exempts it because it IS named `*_unsafe.rs`, gate B
            # prunes it because it is under an audited `src/`, and the ratchet never
            # looked. MEASURED, not reasoned about: two live relaxations (`unsafe fn` +
            # an `unsafe {}` block) were compiled into `kayfabe-linux-raw` via
            # `src/sub/hidden_unsafe.rs` + `pub mod sub;` and the ratchet still printed
            # `50 (bar: 50)`. The one number this project reviews the unsafe surface by
            # could be moved by any amount without a single gate firing, by putting the
            # file in a subdirectory. There is no `-maxdepth` here now, deliberately:
            # the audit surface is "every `*_unsafe.rs` under the crate", at any depth.
            actual=$(find "crates/$c/src" -name '*_unsafe.rs' \
                       -exec grep -hoE 'unsafe (\{|fn |impl |trait )|unsafe extern "C" fn [A-Za-z_]' {} + 2>/dev/null \
                     | wc -l | tr -d ' ')
            echo "$c: $actual relaxation(s) (bar: $want)"
            find "crates/$c/src" -name '*_unsafe.rs' \
              -exec grep -coE 'unsafe (\{|fn |impl |trait )|unsafe extern "C" fn [A-Za-z_]' {} + 2>/dev/null || true
            [ "$actual" -ne "$want" ] && fail=1
          done
          if [ "$fail" -ne 0 ]; then
            echo ""
            echo "★ UNSAFE RATCHET MOVED — l1_os_shell.md §4.1, l2_qemu_adapter.md §2.2."
            echo "A crate's relaxation count differs from its reviewed bar (above)."
            echo "If you ADDED one: change the number in AUDITED in the same commit, and"
            echo "say in the message what the new block does and what its SAFETY"
            echo "invariant is — and add it to the per-file itemisation."
            echo "If you REMOVED one: change the number too — a ratchet that only catches"
            echo "growth stops being a count of the audit surface."
            exit 1
          fi
      - name: Format check (fuzz workspace)
        run: cargo fmt --all --check
        working-directory: fuzz

  aarch64:
    name: aarch64 — core cross-checks (no x86 assumptions)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-gnu
      - uses: Swatinem/rust-cache@v2
      # ★★ KAYFABE_ISOLATE_IMAGE_STUB=1 — the ONE reviewed opt-out from embedding a real
      # isolate image, and this job is the only place it may be used. This job type-CHECKS
      # for a triple it has neither a musl standard library nor a linker for, and it runs no
      # test. It is not a soft-fail: the build script emits an empty image and warns, and
      # `the_embedded_image_is_a_static_elf` turns any *test* run of such a build red at the
      # first assertion, so an image-less build cannot reach the gate that matters.
      - name: Cross-check the workspace for aarch64 (arch-portability gate; no linker needed)
        env:
          KAYFABE_ISOLATE_IMAGE_STUB: "1"
        run: cargo check --workspace --target aarch64-unknown-linux-gnu

  nightly-fuzz:
    name: nightly — fuzz harness compiles
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Sets RUSTUP_TOOLCHAIN, overriding the repo's stable rust-toolchain.toml.
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz
      - name: Build fuzz harness (compile gate only; running it is manual)
        run: cargo build
        working-directory: fuzz

  slow:
    name: slow — full suite with the soaks (KAYFABE_SLOW=1)
    # Nightly cron + manual dispatch only — never the push path (the push gate's
    # job is to stay fast; this job's job is to make sure the soaks still run
    # WITHOUT a human remembering them).
    if: github.event.schedule == '43 2 * * *' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl   # the embedded isolate image; see the stable job
      - uses: Swatinem/rust-cache@v2
      - name: Test with the slow gate open (pushbuffer proptest fuzz + 16-thread stress soak)
        run: KAYFABE_SLOW=1 cargo test --workspace

  tsan:
    name: tsan — race ceiling over the threaded suites
    if: github.event.schedule == '43 2 * * *' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # TSan needs nightly (-Zsanitizer) + rust-src (-Zbuild-std rebuilds std
      # instrumented — without it, std's own synchronization is invisible to TSan
      # and every lock handoff reads as a race).
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src
          # ★ The nested isolate build KEEPS `RUSTUP_TOOLCHAIN`, so it is nightly that
          # builds the image in this job — which is why the musl target has to be installed
          # for nightly here rather than assumed from the stable job.
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
      # The exact first-campaign invocation (l1_concurrency.md §12.15: 28 tests,
      # 0 races), plus KAYFABE_SLOW=1 so the gated stress soak — the whole reason
      # this job exists — actually runs under the sanitizer. TSan inflates
      # runtimes ~20× (measured: concurrency_stress 290 s, rt_shell 69 s,
      # l1_mean 20 s), which is why the watchdog override exists: without it the
      # suites' own wedge-watchdogs would abort on instrumentation tax, not on a
      # real hang.
      - name: ThreadSanitizer (concurrency_stress, rt_shell, l1_verb_seam, l1_mean)
        run: |
          KAYFABE_SLOW=1 KAYFABE_STRESS_WATCHDOG_SECS=1800 RUSTFLAGS="-Zsanitizer=thread" \
            cargo +nightly test -p kayfabe-tests \
            --test concurrency_stress --test rt_shell --test l1_verb_seam --test l1_mean \
            -Zbuild-std --target x86_64-unknown-linux-gnu -- --test-threads=1

  mutants:
    name: mutants — L1-surface mutation gate
    # Weekly cron + manual dispatch — a mutation campaign is hours, not minutes.
    if: github.event.schedule == '43 4 * * 6' || github.event_name == 'workflow_dispatch'
    # ★★ MEASURED 2026-07-28 — WITHOUT THIS, A BROKEN SUITE SCORES 100%.
    # cargo-mutants baselines with `--package=<mutated pkgs>` while the mutants
    # themselves run `--workspace`. The baseline therefore runs only ~200 tests
    # across 39 binaries and OMITS `kayfabe-tests` ENTIRELY — the conformance
    # suite that catches most mutants. A red conformance suite would pass the
    # baseline and then make EVERY mutant look CAUGHT. `needs: stable` makes the
    # real suite a precondition of the gate rather than an assumption of it.
    needs: stable
    runs-on: ubuntu-latest
    # No `continue-on-error`: the threshold below IS the gate (see
    # core_mutation_gate.md §L1 baseline for the measurement it is derived from).
    timeout-minutes: 600
    env:
      # ★ KAYFABE_SLOW=1 — a slow-test gate silently weakened a SECURITY gate.
      #
      # This job used to run with KAYFABE_SLOW unset "because the fast path is what
      # makes mutants × suite tractable". Measured consequence: the 73 s pushbuffer
      # proptest fuzz is the ONLY coverage of the untrusted, guest-controlled
      # pushbuffer decoder, and skipping it let decoder mutants survive that the
      # fuzz kills (verified on the decoder scope: 2 missed → 1 with the flag set).
      # So the flag that was introduced to keep the *push* gate fast had, as a side
      # effect, hollowed out the mutation gate exactly where the input is hostile.
      # Cost, honestly: the two gated soaks add ~90 s per mutant, roughly doubling
      # this job's wall clock. It is a weekly cron; correctness of the gate wins.
      KAYFABE_SLOW: '1'
      # ★ CARGO_INCREMENTAL=0 — incremental compilation ICEs inside the mutants
      # temp tree, and cargo-mutants scores a build failure as "unviable".
      #
      # cargo-mutants rewrites one source file per mutant inside a copied tree that
      # reuses one `target/` (and therefore one incremental dep-graph cache). That
      # cache does not survive the churn: rustc aborts with
      # `on_disk_cache.rs: assertion left == right failed`. cargo-mutants cannot
      # tell a compiler crash from a type error, so every ICE'd mutant is filed
      # "unviable" and DROPPED FROM THE DENOMINATOR — silently inflating the score.
      # Measured on the first L1 campaign: 136 of 293 mutant builds ICE'd, and
      # `SourceRegistry::is_empty -> true` was reported unviable while the sibling
      # `-> false` was caught. Turning incremental off removed every ICE.
      # NEVER remove this without re-checking the ICE guard step below.
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl   # the embedded isolate image; see the stable job
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-mutants
        run: cargo install --locked cargo-mutants
      # Scope = the L1 surface: kayfabe-rt (the threaded shell's logic), the
      # core's completion-source reactor, and the plan/execute/commit + isolate
      # pool/condemnation code (kayfabe-fwd and kayfabe-isolate are single-file
      # crates, so file scope == crate scope). Same knobs as the L0 campaign
      # (core_mutation_gate.md §Reproduce), except the baseline is NOT skipped:
      # in CI nothing has pre-verified the tree is green, and a broken baseline
      # must fail the campaign rather than poison every mutant's result.
      #
      # `cargo mutants` exits non-zero if ANY mutant survives, which is not the
      # bar this gate holds (see the scoring step) — hence `|| true` here and a
      # threshold check on the recorded outcome files afterwards.
      - name: cargo mutants over the L1 surface
        run: |
          # ★★ SCOPE = EVERY PRODUCTION CRATE. It used to be four hand-picked paths,
          # which by 2026-07-27 covered only ~17k of 41.6k implementation lines — so the
          # threshold described the OLD core while every real defect that week lived in
          # the NEW OS layer (an Arc-ownership R1 violation, a silent-wrap ledger race, an
          # address-blind arena). A gate that measures a shrinking minority reports a
          # number about code nobody is changing.
          #
          # Test scaffolding is excluded in mutants.toml (crates/kayfabe-mocks/**,
          # tests/src/**), not here — mutating an instrument is a category error, and 48%
          # of one run's misses were exactly that.
          # ★★ ABSOLUTE TIMEOUT, AND DELIBERATELY NOT --timeout-multiplier.
          # Measured 2026-07-28: the workspace suite takes 201 s ALONE on a
          # 25-core box, so a 4-vCPU runner at -j 2 is slower still — the old
          # `--timeout 240` sat at or BELOW honest completion. cargo-mutants
          # counts a TIMEOUT as KILLED, so mass timeouts would report ~100 % and
          # the gate would never fire: the failure is silent and one-directional.
          # A multiplier is worse than useless here because it is computed off
          # cargo-mutants' own baseline, which omits `kayfabe-tests` (see the
          # `needs: stable` note) and therefore measures ~14 s.
          cargo mutants --test-workspace true -j 2 \
            --timeout 1800 --build-timeout 900 \
            -f 'crates/*/src/**/*.rs' || true
      # ★ The anti-inflation guard. "Unviable" is supposed to mean "the mutant does
      # not typecheck" (a tool artifact). If it ever again means "rustc crashed",
      # the denominator is fiction and so is the score — so a single ICE in any
      # mutant's build log fails the job outright, BEFORE the threshold is read.
      - name: Guard — no compiler ICE may be scored as "unviable"
        run: |
          if grep -rlq "thread 'rustc'" mutants.out/log/; then
            echo "★ A mutant build ICE'd. cargo-mutants files that as 'unviable',"
            echo "which removes the mutant from the denominator and INFLATES the"
            echo "score. Do not trust this campaign's number. Offending logs:"
            grep -rl "thread 'rustc'" mutants.out/log/ | head -20
            exit 1
          fi
      # ★ The threshold, derived from the measured L1 baseline — not aspirational.
      # score = (caught + timeout) / (caught + timeout + missed); `unviable` is
      # excluded because it is a tool artifact, exactly as in the L0 table.
      # See core_mutation_gate.md §L1 baseline for why the bar sits here and not
      # at L0's 99.2%: this surface is measured, and a gate set above reality is
      # theatre that gets muted after the first red night.
      - name: Score the campaign against the measured L1 threshold
        run: |
          THRESHOLD=${MUTATION_THRESHOLD_PCT}
          n() { if [ -f "mutants.out/$1.txt" ]; then wc -l < "mutants.out/$1.txt"; else echo 0; fi; }
          caught=$(n caught); missed=$(n missed); to=$(n timeout); unviable=$(n unviable)
          killed=$((caught + to)); viable=$((killed + missed))
          if [ "$viable" -eq 0 ]; then
            echo "★ Zero viable mutants — the campaign tested nothing. Failing."
            echo "(The usual cause is a lost --test-workspace: kayfabe-fwd and"
            echo " kayfabe-rt have no unit tests of their own, so without it the"
            echo " harness runs an empty suite and reports everything MISSED.)"
            exit 1
          fi
          score=$((killed * 1000 / viable))
          echo "caught=$caught timeout=$to missed=$missed unviable=$unviable"
          echo "score = $killed/$viable = $((score / 10)).$((score % 10))% (bar: ${THRESHOLD}.0%)"
          if [ "$score" -lt $((THRESHOLD * 10)) ]; then
            echo "★ MUTATION SCORE REGRESSION — below the measured L1 baseline."
            echo "Survivors:"; cat mutants.out/missed.txt
            exit 1
          fi
        env:
          # The bar. Raise it when a campaign measures higher and the new number
          # holds across a run; never lower it to make a red night go away —
          # a survivor is a test gap, and this file is where that gets argued.
          # ⚠ PENDING RE-DERIVATION (2026-07-27). 91 was measured against the OLD
          # four-path scope (~17k of 41.6k lines). The scope above is now every
          # production crate, so this number describes a different population and MUST
          # be re-derived from the first full run under the new scope before it is
          # trusted as a bar. This job is weekly/dispatch only, so a temporarily wrong
          # bar blocks nothing — but do not quote the score until it is re-derived.
          # ★★ 86 — THE FIRST UNCONTAMINATED MEASUREMENT, 2026-07-28.
          # Full campaign at b64a3f5 under the CORRECTED config (2667 targets,
          # scaffolding genuinely excluded for the first time — see
          # .cargo/mutants.toml's header for why it never was before):
          #     caught 1900 · missed 310 · timeout 4 · unviable 453
          #     (1900 + 4) / (1900 + 4 + 310) = 86.0 %
          #
          # ★ THIS IS A FLOOR, NOT THE CEILING. Real coverage on current master is
          # HIGHER: c0ec2fa deleted nine uncalled items and made Spine::arch private,
          # and e9564d7 added seven tests closing the gsp boot/replay/fault survivors
          # — both land AFTER the measured tree, so some of those 310 are already
          # closed. The 4 timeouts are also counted as kills pending individual
          # adjudication at 3600 s. Raise this when a campaign MEASURES higher; never
          # lower it to make a red night go away.
          #
          # ★★ WHY IT DROPPED FROM 91. The old 91 was set against a different, smaller
          # scope AND was never measured with the config in effect. The prior run's
          # 95.4 % is not comparable and should not be quoted: proptest seeds
          # accumulate monotonically inside cargo-mutants job trees (measured: 7 of 12
          # trees diverged by T+1h35m), biasing kills UPWARD as a run proceeds, and
          # two test-adding commits landed in that run's working tree mid-campaign.
          # Both biases push the same way and neither has a downward counterpart.
          # A bar above reality is theatre that gets muted after the first red night.
          # ⚠ WAS 86 FOR ONE COMMIT (1afc5ff) AND THAT GATE COULD NOT PASS.
          # CI's formula is integer: 1904*1000//2214 = 859 < 860. Setting the bar
          # AT the measured 85.998 % fails by ONE mutant. Do not set this to the
          # measurement; set it BELOW, with headroom sized to the known noise.
          #
          # 83 tolerates 376 survivors against the 310 measured — 66 of slack, for
          # three reasons that are all measured, not guessed:
          #   1. ★ CI RUNS ON ubuntu-latest, WHICH HAS NO /dev/kvm. kvm_gate.rs's own
          #      docs say so, and the measuring box HAS it (36 RAN / 0 SKIPPED). So CI
          #      scores a STRICTLY LESS COVERED population than 85.998 % describes.
          #      That blind spot is being sized; until then this bar must absorb it.
          #   2. proptest seeds accumulate inside job trees, so a couple of rows flip
          #      between runs with no code change.
          #   3. 4 timeouts are scored as kills pending individual adjudication.
          # ★★ 80, NOT 83 — AND NOT 86. I have now sized this wrong TWICE by fitting
          # the bar to a measurement instead of leaving slack:
          #   86 (1afc5ff) failed the run it came from by ONE mutant (integer formula).
          #   83 (f556d03) passes THIS box, but CI has no /dev/kvm and would pass by
          #      ONE TENTH of a percent — the same mistake wearing a different number.
          #
          # ★ MEASURED: the same crate scores 104 survivors WITHOUT /dev/kvm vs 41 with
          # (kayfabe-vmm-kvm, probed alone). CI runs on ubuntu-latest, which has none —
          # kvm_gate.rs's docs say so, and the measuring box logged 36 RAN / 0 SKIPPED.
          # Projecting that +63 onto the campaign: 1841/2214 = 83.1 %, i.e. exactly at 83.
          # And that projection is OPTIMISTIC — it assumes the delta is confined to one
          # crate, while kayfabe-rt and kayfabe-shell also drive the reactor.
          #
          # 80 leaves ~3.1 points (~69 survivors) of real slack. Raise it when an actual
          # CI run MEASURES higher; this number is still a projection, not a CI reading.
          MUTATION_THRESHOLD_PCT: '80'
