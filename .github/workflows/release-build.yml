name: Release build provenance
on:
  workflow_dispatch:
permissions: {}
defaults:
  run:
    shell: bash --noprofile --norc -eo pipefail {0}
concurrency:
  group: release-build-${{ github.sha }}
  cancel-in-progress: false
jobs:
  build:
    if: ${{ github.ref == 'refs/heads/master' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      statuses: read
      checks: read
      actions: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Require same master SHA tested by trusted GPU workflow
        timeout-minutes: 2
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -I ci/vast-broker/release_gate.py
      - name: Build final binaries from this GitHub checkout only
        timeout-minutes: 35
        run: |
          cargo build --locked --release --workspace -j2
          cargo build --locked --release --target x86_64-unknown-uefi --bin kf-gop --manifest-path firmware/kf-gop/Cargo.toml -j2
      - name: Attest GitHub-built release binaries
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            target/release/kayfabe-isolate-host
            target/release/kayfabe-rm-ladder
            target/release/kf-oprom
            firmware/kf-gop/target/x86_64-unknown-uefi/release/kf-gop.efi
