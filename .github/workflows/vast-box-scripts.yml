name: Vast box scripts

on:
  push:
    paths:
      - 'scripts/ci/**'
      - 'scripts/bench/**'
      - 'scripts/fastguest/**'
      - 'ci/vast-broker/runner.py'
      - 'ci/vast-broker/test/runner_head_tail_fixture.py'
      - 'ci/vast-broker/src/sanitize.js'
      - 'ci/vast-broker/test/*identifiers*'
      - 'ci/vast-broker/test/fixtures/scrub-vectors.json'
      - '.github/workflows/vast-box-scripts.yml'
  pull_request:
    paths:
      - 'scripts/ci/**'
      - 'scripts/bench/**'
      - 'scripts/fastguest/**'
      - 'ci/vast-broker/runner.py'
      - 'ci/vast-broker/test/runner_head_tail_fixture.py'
      - 'ci/vast-broker/src/sanitize.js'
      - 'ci/vast-broker/test/*identifiers*'
      - 'ci/vast-broker/test/fixtures/scrub-vectors.json'
      - '.github/workflows/vast-box-scripts.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vast-box-scripts-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gpu-free:
    name: Vast box scripts — tests and mutations
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Contract, payload, environment and diagnostic tests
        run: python3 -m unittest discover -s scripts/ci -p 'test_vast*.py'
      - name: Payload mutations require two named killers each
        run: python3 scripts/ci/payload_mutants.py
      - name: Provider environment mutations require two named killers each
        run: python3 scripts/ci/provider_env_mutants.py
      - name: Diagnostic mutations require two named killers each
        run: python3 scripts/ci/diagnostic_logs_mutants.py
      - name: Setup policy mutations require two named killers each
        run: python3 scripts/ci/setup_policy_mutants.py
      - name: Setup cache mutations require two named killers each
        run: python3 scripts/ci/setup_cache_mutants.py
      - name: Canonical box-script mutations
        run: python3 scripts/ci/vast_box_mutants.py --jobs 4
      - name: Gate-visibility mutations (runner display, quiet ladder build) require two killers each
        run: python3 scripts/ci/visibility_mutants.py
      - name: Driver-swap repair mutations (nouveau guard, GPU recovery, NOT_READY) require two killers each
        run: python3 scripts/ci/gpu_swap_mutants.py
      - name: Merge-bar mutations (scrubber test names, light bar, KVM stage) require two killers each
        run: python3 scripts/ci/merge_bar_mutants.py
