[package]
name = "kayfabe-tests"
description = "The VMM-agnostic conformance suite: RmGraph order-independence units + the #14 two-process simulation, driven entirely through the mock harness (no GPU, no OS)."
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
kayfabe-util.workspace = true
kayfabe-arch.workspace = true
kayfabe-core.workspace = true
kayfabe-fwd.workspace = true
kayfabe-mmu.workspace = true
kayfabe-completion.workspace = true
kayfabe-isolate.workspace = true
kayfabe-vmm.workspace = true
# ★ The REAL Vmm (l1_os_shell.md §10, M2-c). The conformance suite drives the SAME core
# traffic through the mock harness and through real KVM memslots — which is the
# portability contract exercised rather than asserted.
kayfabe-vmm-kvm.workspace = true
kayfabe-linux-raw.workspace = true
kayfabe-mocks.workspace = true
kayfabe-rt.workspace = true

[dev-dependencies]
# Property-based / fuzz testing — DEV-ONLY (never a core dependency). Generates
# arbitrary + adversarial RM event streams to fuzz the guest→core attack surface.
proptest = "1.11"
# Asserting the EXACT errno a real kernel returned (EEXIST vs ENOMEM), never `is_err()`.
libc = "0.2"

[lints]
workspace = true
