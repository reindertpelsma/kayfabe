<!doctype html><meta charset="utf-8"><title>kf webgl</title>
<body style="margin:0;background:#222"><canvas id="c" width="640" height="360"></canvas>
<script>
const P = new URLSearchParams(location.search), secs = +(P.get('s') || 10);
async function post(o) { try { await fetch('/result', {method: 'POST', body: JSON.stringify(o)}); } catch (e) {} }
(async () => {
  const r = {page: 'webgl', ok: false};
  try {
    const c = document.getElementById('c');
    let gl = c.getContext('webgl2', {preserveDrawingBuffer: true}); r.api = 'webgl2';
    if (!gl) { gl = c.getContext('webgl', {preserveDrawingBuffer: true}); r.api = 'webgl'; }
    if (!gl) { r.why = 'no WebGL context'; return post(r); }
    const dbg = gl.getExtension('WEBGL_debug_renderer_info');
    r.vendor = dbg ? gl.getParameter(dbg.UNMASKED_VENDOR_WEBGL) : gl.getParameter(gl.VENDOR);
    r.renderer = dbg ? gl.getParameter(dbg.UNMASKED_RENDERER_WEBGL) : gl.getParameter(gl.RENDERER);
    r.version = gl.getParameter(gl.VERSION);
    const vs = `attribute vec2 p; void main(){ gl_Position = vec4(p,0.,1.); }`;
    // a fragment shader with a real ALU loop so the GPU does measurable work
    const fs = `precision highp float; uniform float t; void main(){ vec2 z = gl_FragCoord.xy/vec2(640.,360.)*3.-vec2(2.,1.5); vec2 c = vec2(.285+.01*sin(t), .01); float n=0.; for(int i=0;i<200;i++){ if(dot(z,z)>4.) break; z = vec2(z.x*z.x-z.y*z.y, 2.*z.x*z.y)+c; n+=1.; } gl_FragColor = vec4(n/200.,.5,.75,1.); }`;
    const sh = (t, s) => { const o = gl.createShader(t); gl.shaderSource(o, s); gl.compileShader(o); if (!gl.getShaderParameter(o, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(o)); return o; };
    const pr = gl.createProgram(); gl.attachShader(pr, sh(gl.VERTEX_SHADER, vs)); gl.attachShader(pr, sh(gl.FRAGMENT_SHADER, fs)); gl.linkProgram(pr); gl.useProgram(pr);
    const b = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, b); gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);
    const loc = gl.getAttribLocation(pr, 'p'); gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
    const ut = gl.getUniformLocation(pr, 't');
    // colour check first: a flat clear must read back exactly
    gl.clearColor(0.25, 0.5, 0.75, 1); gl.clear(gl.COLOR_BUFFER_BIT);
    const px = new Uint8Array(4); gl.readPixels(320, 180, 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, px); r.pixel = Array.from(px);
    r.pixel_ok = Math.abs(px[0]-64) <= 1 && Math.abs(px[1]-128) <= 1 && Math.abs(px[2]-191) <= 1;
    let frames = 0; const t0 = performance.now();
    await new Promise(res => { const f = () => { gl.uniform1f(ut, frames * .02); gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4); frames++; if (performance.now() - t0 < secs * 1000) requestAnimationFrame(f); else res(); }; requestAnimationFrame(f); });
    gl.finish();
    r.frames = frames; r.secs = (performance.now() - t0) / 1000; r.fps = frames / r.secs;
    r.glerr = gl.getError();
    const soft = /SwiftShader|Basic Render|llvmpipe|Software|Microsoft/i.test(r.renderer + ' ' + r.vendor);
    r.software = soft;
    r.ok = /NVIDIA/i.test(r.renderer + ' ' + r.vendor) && !soft && r.pixel_ok && frames >= 10 && r.glerr === 0;
    if (!r.ok && !r.why) r.why = !/NVIDIA/i.test(r.renderer) ? 'renderer is not NVIDIA' : soft ? 'software renderer' : !r.pixel_ok ? 'pixel mismatch' : 'frames/glerr';
  } catch (e) { r.why = String(e); }
  post(r);
})();
</script>
