<!doctype html><meta charset=utf-8><title>kf webgpu</title><canvas id=c width=1280 height=720 style="width:800px"></canvas>
<script>
const S=window.__stats={frames:0,err:[],adapter:null};
(async()=>{
 if(!navigator.gpu){S.err.push('no navigator.gpu');return}
 const ad=await navigator.gpu.requestAdapter();if(!ad){S.err.push('no adapter');return}
 S.adapter=ad.info?{vendor:ad.info.vendor,arch:ad.info.architecture,desc:ad.info.description}:'n/a';
 const dev=await ad.requestDevice();dev.lost.then(i=>S.err.push('device lost '+i.reason+' '+i.message));
 const ctx=document.getElementById('c').getContext('webgpu');const fmt=navigator.gpu.getPreferredCanvasFormat();ctx.configure({device:dev,format:fmt});
 const NP=1<<20;const buf=dev.createBuffer({size:NP*16,usage:GPUBufferUsage.STORAGE|GPUBufferUsage.VERTEX,mappedAtCreation:true});
 const a=new Float32Array(buf.getMappedRange());for(let i=0;i<NP;i++){a[i*4]=Math.random()*2-1;a[i*4+1]=Math.random()*2-1;a[i*4+2]=Math.random()*.01-.005;a[i*4+3]=Math.random()*.01-.005}buf.unmap();
 const ub=dev.createBuffer({size:16,usage:GPUBufferUsage.UNIFORM|GPUBufferUsage.COPY_DST});
 const cs=dev.createShaderModule({code:`struct P{p:vec2f,v:vec2f}@group(0)@binding(0)var<storage,read_write>ps:array<P>;@group(0)@binding(1)var<uniform>t:vec4f;
 @compute @workgroup_size(256)fn main(@builtin(global_invocation_id)g:vec3u){var p=ps[g.x];let d=-p.p;p.v+=d*0.00002*(1.+sin(t.x+f32(g.x)*0.001));p.p+=p.v;if(abs(p.p.x)>1.){p.v.x=-p.v.x;}if(abs(p.p.y)>1.){p.v.y=-p.v.y;}ps[g.x]=p;}`});
 const rs=dev.createShaderModule({code:`@vertex fn vs(@location(0)p:vec4f)->@builtin(position)vec4f{return vec4f(p.xy,0,1);}@fragment fn fs()->@location(0)vec4f{return vec4f(.3,.7,1.,.15);}`});
 const cp=dev.createComputePipeline({layout:'auto',compute:{module:cs,entryPoint:'main'}});
 const bg=dev.createBindGroup({layout:cp.getBindGroupLayout(0),entries:[{binding:0,resource:{buffer:buf}},{binding:1,resource:{buffer:ub}}]});
 const rp=dev.createRenderPipeline({layout:'auto',vertex:{module:rs,entryPoint:'vs',buffers:[{arrayStride:16,attributes:[{shaderLocation:0,format:'float32x4',offset:0}]}]},
  fragment:{module:rs,entryPoint:'fs',targets:[{format:fmt,blend:{color:{srcFactor:'src-alpha',dstFactor:'one'},alpha:{srcFactor:'one',dstFactor:'one'}}}]},primitive:{topology:'point-list'}});
 (function f(){dev.queue.writeBuffer(ub,0,new Float32Array([performance.now()/1000,0,0,0]));const e=dev.createCommandEncoder();
  const c=e.beginComputePass();c.setPipeline(cp);c.setBindGroup(0,bg);c.dispatchWorkgroups(NP/256);c.end();
  const r=e.beginRenderPass({colorAttachments:[{view:ctx.getCurrentTexture().createView(),clearValue:{r:0,g:0,b:.05,a:1},loadOp:'clear',storeOp:'store'}]});
  r.setPipeline(rp);r.setVertexBuffer(0,buf);r.draw(NP);r.end();dev.queue.submit([e.finish()]);S.frames++;requestAnimationFrame(f)})();
})().catch(e=>S.err.push(''+e));
</script>
