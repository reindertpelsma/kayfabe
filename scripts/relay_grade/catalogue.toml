[[entry]]
id = "RELAY-DOORBELL"
group = "relay/worker"
name = "PUT-ahead-unread is a doorbell race, never a poll; the last doorbell covers all earlier GP_PUT writes"
source = [
  "traces/doorbell_contract_20261017",
  "docs/design/V3_RELAY_SIMPLE_20261020.md:1 (P2)",
  "crates/kf-chan/src/user_loop.rs look_needed",
]
symptom = "Stalls where GP_PUT is ahead of what the relay read and no doorbell is pending; the temptation to fix it by reading GP_PUT without a doorbell."
root_cause = "Design rule (owner): hardware semantics give a covering doorbell for every GP_PUT write; an idle relay's backstop reads nothing. A GP_PUT poll would hide a doorbell race instead of finding it. CODE READ."
root_cause_label = "CODE READ"
expected = "No look reads GP_PUT without a covering doorbell; a PUT ahead of the last doorbell is owed nothing; a GP_PUT that moves backwards or leaves the ring reads nothing beyond the loaded value."
tests = [
  "kf-chan:user_loop_model:put_ahead_of_the_last_doorbell_is_owed_nothing_and_no_look_reads_it",
  "kf-chan:user_loop_model:mutant_the_evaluation_polls_gp_put_is_found",
  "kf-chan:user_lifecycle_props:i8_a_gp_put_that_moves_backwards_or_leaves_the_ring_reads_nothing_beyond_the_value_loaded",
  "kf-chan:user_lazy_model:put_cache_every_reachable_state_keeps_i8_order_and_the_doorbell_contract",
]
hardware_gate = ""
status = "pinned"

[[entry]]
id = "RELAY-IDLEPUT"
group = "relay/worker"
name = "relay stopped reading GP_PUT when its own ring drained (30 IDLE_STALLs, 1.6-55 s, Edge resets)"
source = [
  "docs/design/V3_USER_RING_SCAN_RACE.md:0 (root cause 2)",
  "commit 50068268 (Poll)",
  "docs/design/V3_FEATURE_GAPS.md G16",
]
symptom = "Work published after a drain sat unread for 1.6-55 s; the guest's 2 s timeout fired and Windows reset the adapter when Edge started."
root_cause = "MEASURED 2026-10-14: 205 doorbells against ~70 000 new-work GP_PUT reads on one channel; the relay read GP_PUT only on a doorbell or while its own ring was in flight. SUPERSEDED as a design: the 2026-10-17 doorbell contract replaced the 1 ms/20 ms Poll with event-driven doorbell covering (RELAY-DOORBELL)."
root_cause_label = "MEASURED"
expected = "Work published after a drain is relayed whenever a covering doorbell exists, with no timer and no GP_PUT poll (see RELAY-DOORBELL); no IDLE_STALL in the Edge/YouTube lane."
tests = [
  "kf-chan:user_loop_model:put_ahead_of_the_last_doorbell_is_owed_nothing_and_no_look_reads_it",
  "kf-chan:user_loop_model:doorbell_storm_coalesces",
  "kf-chan:user_loop_model:the_retired_loop_deadlocks_without_timers_exactly_where_it_polled",
]
hardware_gate = "scripts/bench/windows/windows_broker.sh + scripts/bench/windows/regress_matrix.sh (Edge + YouTube 10 min): no USER_RING_REFUSED, no IDLE_STALL line, 0 TDR"
status = "pinned"

[[entry]]
id = "RELAY-LAZY"
group = "relay/worker"
name = "lazy observe + PUT cache interplay (stale cache hides a covered doorbell; stale GET over-counts credit)"
source = [
  "docs/design/V3_USER_RING_EVENT_LOOP_20261014.md:9 (P9)",
  "memory project_lazy_observe_finding_20261017",
  "traces/lazy_prod_20261017",
]
symptom = "Risk statement of KF3_LAZY_OBSERVE=16 / PUT cache (+97 fps D3D11): stale GP_GET only lowers credit, stale REFERENCE delays SyncGate release; a cached PUT must never hide a covered doorbell."
root_cause = "Design risk, no failure observed. MEASURED in the models (P9 holds; the cache is dropped on ring migration even for a lower PUT)."
root_cause_label = "MEASURED"
expected = "A stale PUT cache never hides a covered doorbell, a skipped observation never over-counts credit, and a ring generation switch invalidates the cache."
tests = [
  "kf-chan:user_loop_model_v2:p9_a_stale_put_cache_never_hides_a_covered_doorbell",
  "kf-chan:user_loop_model_v3_pointer:coalesced_doorbells_with_a_stale_put_cache_are_live_and_bounded",
  "kf-chan:user_lazy_model:stale_get_never_yields_more_credits_than_the_real_ring_has",
  "kf-chan:user_lazy_model:a_ring_generation_switch_invalidates_the_cache_even_for_a_lower_put",
  "kf-chan:user_lazy_turn:b_a_skipped_observation_never_over_counts_credit_and_the_next_look_catches_up",
  "kf-chan:user_lazy_turn:a_a_ring_migration_drops_the_cache_even_when_the_new_ring_has_a_lower_put",
]
hardware_gate = ""
status = "pinned"

[[entry]]
id = "RELAY-IRQVIS"
group = "relay/worker"
name = "interrupt visible before the REFERENCE / GP_GET write is visible (hazard)"
source = [
  "docs/design/V3_USER_RING_EVENT_LOOP_20261014.md:9 (P6)",
  "docs/design/V3_RELAY_SIMPLE_20261020.md:5 (NEW row: uncovered with an infinite park)",
]
symptom = "None observed. A marker's NON_STALL_INTERRUPT could reach the worker before the private REFERENCE word is visible; the look finds the wait unsatisfied and sleeps."
root_cause = "INFERRED hardware ordering assumption. The v1 model shows it UNCOVERED with an infinite park; production's 50 ms net covers it. Not measurable GPU-free."
root_cause_label = "INFERRED"
expected = "A satisfied marker wait is rung even if the interrupt preceded the REFERENCE/GP_GET store becoming visible, without a timer; until then timeouts_with_work must stay 0 on hardware."
tests = [
  "kf-chan:user_loop_model:design_get_visibility_lag_after_the_interrupt_is_the_one_hazard_the_loop_does_not_cover",
  "kf-chan:user_loop_model_v2:p6_get_visibility_lag_after_the_interrupt_is_the_one_hazard_the_loop_does_not_cover",
  "kf-chan:user_loop_model:migration_with_a_visibility_lag_is_safe_and_only_the_known_hazard_can_stall",
]
hardware_gate = "scripts/bench/baton (branch claude/baton-pointer-20261020: session3.sh + guest_driver.sh, plain pair 120 s, KF3_DEBUG_FORCE_MIGRATABLE=1 KF3_DIAG_PROGRESS=1000, n>=10 ABBA, one box) : no client gap >= 1 s, no PROGRESS_STRAND line, USER_RING_LOOP SUMMARY backstop_found_work=0 and timeouts_with_work=0 (the hazard is detected as backstop_found_work > 0 / timeouts_with_work > 0 with the 50 ms net ON)"
status = "open"
note = "tests document the model hazard; no test fails today because the hazard is not covered by design, only by the net"

[[entry]]
id = "RELAY-MARKER"
group = "relay/worker"
name = "tagged marker: proof, wake and credit reclaim conflated (GP_GET retired proof; credit waits on the newest marker)"
source = [
  "docs/design/V3_USER_RING_EVENT_LOOP_20261014.md:3.3 (GP_GET runs ahead)",
  "commit c777f03d9",
  "commit b07aecc9c",
]
symptom = "A marker wait satisfied by pops (the retired GP_GET proof) read a pushbuffer the hardware had not executed; credit waited for the newest marker instead of the next one in ring order."
root_cause = "MEASURED (GP_GET runs ahead of processing, bare metal RTX 4070) and CODE READ: three roles (proof of execution = tagged REFERENCE, wake = the marker's own interrupt, credit reclaim = next marker) were served by one word."
root_cause_label = "MEASURED"
expected = "A marker wait is satisfied only by processed tagged references (16-bit extended count), whatever GP_GET says; a credit wait waits for the NEXT outstanding marker."
tests = [
  "kf-chan:lib:a_marker_wait_is_over_when_enough_markers_were_processed_whatever_get_says",
  "kf-chan:lib:marks_count_only_tagged_references_and_extend_the_sixteen_bit_count",
  "kf-chan:user_loop_model:the_retired_gp_get_proof_read_a_pushbuffer_before_the_drain",
  "kf-chan:user_loop_model:design_credit_waits_with_a_shallow_pop_window_are_event_driven",
  "kf-chan:user_loop_model:mutant_byte_witness_inside_an_open_packet_is_found",
]
hardware_gate = ""
status = "pinned"

