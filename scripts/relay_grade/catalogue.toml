# kayfabe failure catalogue -- machine list (STATUS: LIVE, 2026-10-20).
# Human view: docs/design/V3_FAILURE_CATALOGUE.md. The grader (scripts/relay_grade.sh, group G11) FAILS if an entry has no
# pinning test and no declared hardware_gate, or if a cited test fn does not exist.
# test = "crate:test-binary-or-lib:fn_name". status: pinned (>=1 GPU-free test) | hw-gated (only a hardware/process gate) | open
# (root cause UNKNOWN, or fix/pin not on this head; the tests/hardware_gate name what detects it).
# optional keys: pending_branch (tests/fix only on an unmerged branch), known_red (a cited test is red today), note.

[[entry]]
id = "RELAY-F1"
group = "relay/worker"
name = "relay stranded after 64 lost try_locks (the baton; probable cause of the Minecraft/Heaven freezes)"
source = [
  "docs/design/V3_RELAY_SIMPLE_20261020.md:5 (results table F1)",
  "docs/design/V3_USER_RING_EVENT_LOOP_20261014.md:10 (P13)",
  "scripts/bench/baton/README.md S2 section (branch claude/baton-pointer-20261020, PROGRESS_STRAND)",
  "commit 82830cd5e",
  "commit 527fb1ed7",
  "commit 0e2edaf49",
]
symptom = "With two GPU clients on the relay route one client makes no progress for 1-59 s while the peer runs at full rate; GPU 94-97 %, no Xid, guest cuStreamQuery NOT_READY, KF3_DIAG_USER_STALL silent."
root_cause = "A relay that lost the record/pt try_lock CONTENTION_RETRIES (64) turns in a row was re-rung only by Peek::Backstop (an idle 50 ms epoll timeout), which never comes beside a hot neighbour. MEASURED: in 2 of 2 control stalls >= 1 s a PROGRESS_STRAND (contended_run=0x40, h64_backstop_only=yes) lasted as long as the stall (n=2). Causal link to the owner's Windows freezes is not proven until the hardware A/B of the simple relay."
root_cause_label = "MEASURED"
expected = "A relay whose demand flag is set is re-rung by every look until served, with no retry budget, so a convoy of lost try_locks past 64 beside a hot neighbour and peer interrupts is served within K passes and no timer is needed."
tests = [
  "kf-chan:user_loop_model_v3_pointer:simple_relay_a_repeated_pt_convoy_beside_a_hot_neighbour_and_peer_interrupts_is_live_and_bounded",
  "kf-chan:user_loop_model_v3_pointer:break1_expected_red_a_convoy_past_the_retry_budget_is_stranded_by_a_peers_interrupt_stream",
  "kf-chan:user_loop_model_v3_pointer:break1b_expected_red_one_long_pt_hold_spends_the_budget_and_strands_the_relay",
  "kf-chan:user_loop_model_v3_pointer:known_p13_expected_red_a_convoy_past_the_retry_budget_beside_a_hot_neighbour",
  "kf-chan:relay_fairness:p13_expected_red_a_convoy_past_contention_retries_is_still_re_rung_within_k_passes_beside_a_hot_relay",
  "kf-chan:relay_stress:expected_red_exhausted_try_lock_retries_leave_a_relay_to_the_backstop",
  "kf-chan:grade_model:g1_f1_convoy_past_budget_is_served",
]
hardware_gate = "scripts/bench/baton (branch claude/baton-pointer-20261020: session3.sh + guest_driver.sh, plain pair 120 s, KF3_DEBUG_FORCE_MIGRATABLE=1 KF3_DIAG_PROGRESS=1000, n>=10 ABBA, one box) : no client gap >= 1 s, no PROGRESS_STRAND line, USER_RING_LOOP SUMMARY backstop_found_work=0 and timeouts_with_work=0"
status = "pinned"

[[entry]]
id = "RELAY-F2"
group = "relay/worker"
name = "Wait::Popped partial pops not written back to GP_GET when Pointer markers are latched off"
source = [
  "docs/design/V3_RELAY_SIMPLE_20261020.md:5 (F2)",
  "crates/kf-chan/tests/user_loop_model_v3_pointer.rs break2",
  "commit a14e59ba6",
]
symptom = "Model: the guest sees a full ring the hardware already freed, never submits the batch that would release the acquire, deadlock; or its space is delayed until the whole batch is popped."
root_cause = "The pop write-back existed only for Wait::Marker; a Popped wait had no wake source. CODE READ + MEASURED in the model (break 2 red on the merged base, green under simple relay Change B; moot under Change A where the guest GP_GET is the relay's read index)."
root_cause_label = "MEASURED"
expected = "The guest's visible GP_GET never depends on pops: it is the relay's read index (GuestGet::ReadIndex), and a Popped wait is looked at on every iteration."
tests = [
  "kf-chan:user_loop_model_v3_pointer:break2_control_with_pointer_markers_on_the_marker_waits_pop_write_back_frees_the_guest",
  "kf-chan:user_loop_model_v3_pointer:break2_expected_red_a_carried_wait_never_writes_back_partial_pops_and_the_guest_deadlocks_on_ring_space",
  "kf-chan:user_loop_model_v3_pointer:break2b_expected_red_a_carried_wait_delays_the_guests_ring_space_until_the_whole_batch_is_popped",
  "kf-chan:user_loop_model_v3_pointer:a_carried_popped_wait_satisfied_while_the_worker_is_busy_is_found_within_k_ticks",
  "kf-chan:user_turn_unit:copy_before_get_a_slot_overwritten_after_get_passed_it_is_never_forwarded",
]
hardware_gate = "Change A canary (V3_RELAY_SIMPLE_20261020.md section 7, not run): a guest that overwrites every GPFIFO slot and its pushbuffer as soon as GP_GET passes it, checksum written by the GPU; plus channel free / driver unload with work in flight"
status = "pinned"

