name = "kayfabe-vast-reaper"
main = "worker.js"
no_bundle = true
compatibility_date = "2026-10-21"
workers_dev = false
[triggers]
crons = ["*/5 * * * *"]
[vars]
REAPER_HARD_MINUTES = "300"
REAPER_MARGIN_MINUTES = "15"
[observability]
enabled = true
head_sampling_rate = 1
# NOT APPLIED: optional memory of the instance ids seen under a kf-ci label. Without it the label alone
# decides. To apply: create the namespace, put its id below, uncomment, deploy
# (vast-broker/DEPLOY.md, "Worker hardening", owner checklist steps 1 and 2).
# [[kv_namespaces]]
# binding = "REAPER_SEEN"
# id = "<namespace id>"
