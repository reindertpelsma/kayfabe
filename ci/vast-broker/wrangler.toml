name = "kayfabe-vast-broker"
main = "src/index.js"
compatibility_date = "2026-10-21"
workers_dev = true
# No per-version preview hostnames (wrangler 4.152.0 schema: top-level boolean).
preview_urls = false

# Workers Logs (owner 2026-10-24: on while the first CI run is debugged). A deploy replaces the
# dashboard setting with this block, so it must be stated here or a deploy switches logging off.
# Request logs carry the path prefix: turn this off again once the path works.
[observability]
enabled = true
head_sampling_rate = 1

[[durable_objects.bindings]]
name = "LEDGER"
class_name = "BrokerLedger"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["BrokerLedger"]

# Result store (src/results.js, src/ingest.js): the one platform database, shared with the
# public read-only Worker (ci/platform-api); this Worker is its only writer (owner ruling
# 2026-11-04). The id is not a secret. Migrations live in ci/platform-api/migrations and are
# applied by the coordinator from that directory only (DEPLOY.md, "Result store").
[[d1_databases]]
binding = "DB"
database_name = "kayfabe-platform"
database_id = "c6292be2-742d-4a05-95fd-749705ab30bc"
migrations_dir = "../platform-api/migrations"

# Failed-run evidence (src/evidence.js, DEPLOY.md "Evidence bucket"): a PRIVATE R2 bucket that only
# the box upload route POST /evidence/<run>-<attempt> writes, through this binding. Nothing reads
# it except the coordinator, with its own credentials (scripts/ci/fetch_evidence.py). Create the
# bucket (with its location hint and its 30-day lifecycle rule) BEFORE the first deploy that carries
# this block: wrangler 4.152.0 CREATES a missing bucket named here during a plain deploy, without
# either; deploy.mjs therefore passes --x-provision=false, so that a missing bucket fails the deploy
# instead (DEPLOY.md, "Evidence bucket"). Remove the block to switch the route off (it then
# answers 404 EVIDENCE_DISABLED).
[[r2_buckets]]
binding = "EVIDENCE_BUCKET"
bucket_name = "kayfabe-ci-evidence"

# Public run logs and reports (src/publiclog.js, src/publish.js, DEPLOY.md "Public logs"): the
# PUBLIC R2 bucket kayfabe-logs-public (https://logs.kayfabe.dev), written only by the cron publisher
# through this binding as <run id>/log.txt and <run id>/report.json. The bucket already exists and
# is public through the custom domain; this Worker never reads it. deploy.mjs passes
# --x-provision=false, so a bucket that does not exist FAILS the deploy instead of being created
# without its settings (same rule as EVIDENCE_BUCKET). Remove the block to switch publishing off.
[[r2_buckets]]
binding = "LOGS_BUCKET"
bucket_name = "kayfabe-logs-public"

[triggers]
crons = ["* * * * *"]

[vars]
# Public origin and exact OIDC audience; the runner environment variable must match.
WORKER_URL = "https://ci.kayfabe.dev"
# Numeric owner policy defaults are defined once in defaults.json.
RENTING_ENABLED = "false"
# SHA-256 of wrangler's emitted module (equals deployment.json; deploy.mjs refuses otherwise).
DEPLOYED_BUNDLE_SHA256 = "1578fd0be7ed7a04c562414694fad2b367bfa16b72d0a1b2680bbe9d05a1e948"
# Public GitHub account id of the owner (also in every commit author email); never a secret.
OWNER_GITHUB_ID = "229738317"
# Public https origin of the log bucket (a report names its log by this URL); on kayfabe.dev only.
LOGS_BASE = "https://logs.kayfabe.dev"
REPOSITORY = "reindertpelsma/kayfabe"
REPOSITORY_GITHUB_ID = "1311106387"
OIDC_SUB = "repo:reindertpelsma@229738317/kayfabe@1311106387:environment:gpu-vast"
CHECK_JOB_WORKFLOW_REFS = '["reindertpelsma/kayfabe/.github/workflows/gpu-vast.yml@refs/heads/master"]'
SWEEP_JOB_WORKFLOW_REF = "reindertpelsma/kayfabe/.github/workflows/gpu-vast-sweep.yml@refs/heads/master"

# Secret bindings: VAST_API_KEY, RUN_TOKEN_SECRET, OWNER_STOP_TOKEN.
# Optional secret BROKER_PATH_PREFIX: one random base64url segment, 32-128 chars.
# RUN_TOKEN_SECRET and OWNER_STOP_TOKEN: independent random base64url strings, >=32 chars.
# Optional ROW_TAG_KEY: random base64url string, >=32 chars; HMAC key of result-store rows
# (src/results.js). Without it (or without the DB binding) nothing is queued or written to D1 and
# POST /v1/requirements/check answers 503 STORE_UNAVAILABLE.
# Optional public var TREE_KEY_CARRY_OVER (default off): 'true' lets a Worker-verified tree key
# answer requirements for another commit; keep it off until boxes delete ignored files after clone.
# Optional GITHUB_API_TOKEN: read-only GitHub checks and release metadata.
# BLOB_GITHUB_TOKEN: deprecated asset-only fallback.
# Optional secrets R2_READ_ACCESS_KEY_ID, R2_READ_SECRET_ACCESS_KEY: READ-ONLY S3 key pair of the private
# benchmark bucket (route /bench-data/). Public vars R2_ACCOUNT_ID and R2_BUCKET go in the deploy vars file, not here.
# No Cloudflare or Vast secret belongs in GitHub Actions.

# Optional PREFERRED_COUNTRIES JSON overrides defaults.json; eligibility always comes first.

# Authorization: signed OIDC identity + pinned master workflow + run triggering_actor ==
# OWNER_GITHUB_ID + tested sha == run head_sha. When to run is decided by the workflow YAML.
# Cloudflare Access is a dashboard-only front door; the Worker verifies no Access header.
# Optional secrets BOX_ACCESS_ID/BOX_ACCESS_SECRET: box service-token pair, passed through.
