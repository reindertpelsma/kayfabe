menuentry 'Vast Windows RAM flasher (erases boot disk)' --id vast-windows-flash {
    insmod part_gpt
    insmod ext2
    search --no-floppy --fs-uuid --set=root f589feb5-05f2-40b4-903a-c8a1ec61b750
    linux /boot/vast-windows/vmlinuz console=tty0 console=ttyS0,115200n8 panic=0
    initrd /boot/vast-windows/initrd.img
}
