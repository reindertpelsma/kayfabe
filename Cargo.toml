[workspace]
resolver = "2"
members = [
    "crates/nvkvm-util",
    "crates/nvkvm-arch",
    "crates/nvkvm-abi",
    "crates/nvkvm-mmu",
    "crates/nvkvm-vmm",
    "crates/nvkvm-isolate",
    "crates/nvkvm-completion",
    "crates/nvkvm-core",
    "crates/nvkvm-fwd",
    "crates/nvkvm-gsp",
    "crates/nvkvm-trace",
    "crates/nvkvm-mocks",
    "crates/nvkvm-rt",
    "tests",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Proprietary"
authors = ["nvkvm"]

[workspace.dependencies]
nvkvm-util = { path = "crates/nvkvm-util" }
nvkvm-arch = { path = "crates/nvkvm-arch" }
nvkvm-abi = { path = "crates/nvkvm-abi" }
nvkvm-mmu = { path = "crates/nvkvm-mmu" }
nvkvm-vmm = { path = "crates/nvkvm-vmm" }
nvkvm-isolate = { path = "crates/nvkvm-isolate" }
nvkvm-completion = { path = "crates/nvkvm-completion" }
nvkvm-core = { path = "crates/nvkvm-core" }
nvkvm-fwd = { path = "crates/nvkvm-fwd" }
nvkvm-gsp = { path = "crates/nvkvm-gsp" }
nvkvm-trace = { path = "crates/nvkvm-trace" }
nvkvm-mocks = { path = "crates/nvkvm-mocks" }
nvkvm-rt = { path = "crates/nvkvm-rt" }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
