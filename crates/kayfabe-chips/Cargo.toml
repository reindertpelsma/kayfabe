[package]
name = "kayfabe-chips"
description = "The host-forwarding class profiles (`host_classes`: DerivedHostClasses, pinned_host_classes, the class-list decoder) used by the frozen raw client. The per-generation Arch/GspModel adapters (ga10x, ad10x, gb20x, gh100) were archived on 2026-10-31 to archive/crates/kayfabe-chips-modules."
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
kayfabe-util.workspace = true
# `HostClasses`, `ClassId` and the three role types this crate's profiles implement.
kayfabe-arch.workspace = true
# NVIDIA's real class ids (`generated::classes`) and the vendored capability table the
# Blackwell profile is checked against: this crate may not spell a class id itself.
kayfabe-abi.workspace = true
# `classgen`: the GENERATED per-family engine class sets `DerivedHostClasses` intersects with
# the host's own class list (replaces the GA10x pin for every raw-client connection).
kayfabe-doorbell.workspace = true

[lints]
workspace = true
