# SPDX-License-Identifier: Apache-2.0 OR GPL-2.0-or-later
[package]
name = "kf-oprom"
description = "kf3's boot-display option ROM container: the KFGP descriptor, PCI expansion ROM pack (PCIR rev 3, uncompressed EFI image) and parse. Pure, no_std, no unsafe; shared by the VMM (which packs per host) and the guest-side GOP firmware (which reads the descriptor). docs/design/V3_DISPLAY.md §4.11."
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = ["alloc"]
# `pack` and `parse` return owned buffers. The GOP firmware (firmware/kf-gop) depends on this crate
# with `default-features = false`: it only decodes a descriptor out of a ROM it was handed, and it
# has no allocator.
alloc = []

[[bin]]
name = "kf-oprom"
required-features = ["alloc"]

[dependencies]

[lints]
workspace = true
