[package]
name = "kayfabe-core"
description = "The composition root of the Mode-2 logic core: the RmGraph source of truth, its pure projections (by_pdb / by_vchid / Proc grouping), and the Gpu/Proc/Vas/Channel ownership spine. Pure state machine over guest-supplied bytes — no OS, no VMM, no NVIDIA layouts."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
kayfabe-util.workspace = true
kayfabe-arch.workspace = true
kayfabe-mmu.workspace = true
kayfabe-completion.workspace = true
kayfabe-isolate.workspace = true
# ★ The trace vocabulary sits BELOW this crate deliberately (kayfabe-trace's crate docs),
# so the core can hand it the compiler-checked bridges for the types trace cannot name:
# `RmEvent` -> `RmVerb`, `ProcId` -> `ProcRef`, `RmGraphError` -> `FaultTag` (src/trace.rs).
kayfabe-trace.workspace = true

[dev-dependencies]
kayfabe-mocks.workspace = true

[lints]
workspace = true
