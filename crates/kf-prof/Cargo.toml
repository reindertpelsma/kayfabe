[package]
name = "kf-prof"
description = "Bounded safe profiling records and offline reconciliation"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = []
prof = ["dep:kf-linux-raw", "kf-linux-raw/prof", "dep:serde_json"]
prof-inject = ["prof"]

[dependencies]
kf-linux-raw = { workspace = true, optional = true }
serde_json = { version = "1.0", optional = true }

[lints]
workspace = true

[[example]]
name = "record_fixture"
required-features = ["prof-inject"]
