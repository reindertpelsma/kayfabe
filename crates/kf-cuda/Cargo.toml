[package]
name = "kf-cuda"
description = "The walk kernel, in-process: a dlopen'd CUDA DRIVER-API binding, the launch ABI of `cuda/walk/kf_walk.cu` mirrored in Rust, and the committed PTX. No CUDA toolkit, no libcudart, no build-time link against libcuda — `THE_CONSTRAINTS.md` §20/§21 and `SINGLE_STORE_PLAN.md` increment 4."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
# ★ v3-sec-rawaddr (2026-10-04): the console frame's memory is a `kf_linux_raw::MappedRegion`, and it
# leaves this crate only as the opaque `kf_linux_raw::StaticSpan` (THE_CONSTRAINTS.md §13). Allowed:
# kf-cuda is not a PURE crate (scripts/ci/dependencies.py).
kf-linux-raw.workspace = true

[dev-dependencies]
# T12 drives the compose kernel's address model with the display plane's own `bl_offset`.
kf-disp.workspace = true
trybuild = "1.0"

# ★★★ DELIBERATELY NOT `[lints] workspace = true` — the THIRD crate to omit it, and the
# first one added since the QEMU adapter. `l1_os_shell.md` §4.1's gate A says in as many
# words that adding one "is a design decision, not a manifest edit". Here is the decision.
#
# The workspace is `unsafe_code = "forbid"`, which an `allow` inside a crate cannot relax —
# that is the point of `forbid` — so a crate that needs the relaxation must restate its lints.
#
# ## Why this is a THIRD crate and not code in one of the two that exist
#
# Gate A's own text licenses `kayfabe-linux-raw` for host-side **OS** specificity and
# `kayfabe-qemu-raw` for host-side **hypervisor** specificity. `libcuda` is neither. It is a
# **third foreign runtime**, reached only by `dlopen` at run time, present on some hosts and
# absent on others, and holding a GPU vendor's ABI. Folding it into the OS crate would make
# that crate un-auditable in exactly the way the QEMU split already refused.
#
# ## What the surface actually is, and why it is small
#
# ⊘ One perimeter, `driver_unsafe.rs` (OWNER_RULINGS §R): its inline `raw` module holds every
# `unsafe` block of the crate — the `dlopen`/`dlsym` binding, the driver calls, the launch
# argument encoding — and every address. Its two child files (`driver_unsafe/*_unsafe.rs`, the
# walker's and the display plane's GPU halves) hold the remaining validation sites and no `unsafe`.
# `view_bytes`/`zeroed` were removed 2026-10-04 (v3-sec-rawaddr, audit S1-09). Everything else in
# the crate — `abi.rs`, `walk.rs`, `display.rs`, `synth.rs`, `selftest.rs` — is safe code that holds
# no address.
[lints.rust]
unsafe_code = "allow"
missing_docs = "warn"

[lints.clippy]
# Every relaxation carries a `// SAFETY:` naming its invariant and who guarantees it, or the
# build fails — the same bar the other two audited crates hold.
undocumented_unsafe_blocks = "deny"
