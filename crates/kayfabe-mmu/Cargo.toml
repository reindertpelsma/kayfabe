[package]
name = "kayfabe-mmu"
description = "The address plane: the per-VAS forward-populated address table (mode2_address_table.md — the table IS the guest's TLB; MISS=FAULT) + the GMMU walk algorithm skeleton written against kayfabe-arch::GmmuFmt."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
kayfabe-util.workspace = true
kayfabe-arch.workspace = true
# G1 (`l1_concurrency.md` §12.16): a `Binding`'s host publication carries the
# isolate-namespace-scoped `HostHandle` of its backing, so the address plane names
# the isolate port's handle type. A pure-crate → pure-crate edge; `kayfabe-isolate`
# does not (and must not) depend back on the mmu.
kayfabe-isolate.workspace = true

# ⊘ DEV-ONLY, and only for one thing: `cuda/walk`'s differential oracle needs a
# real GA10x `GmmuFmt` to decode the committed corpus with. A dev-dependency
# cannot reach the library, so this does not give the address plane a chip.
[dev-dependencies]
kayfabe-chips.workspace = true

[lints]
workspace = true
