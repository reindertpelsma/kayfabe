[package]
name = "kf-gop-image"
description = "kf3's boot-display GOP driver (firmware/kf-gop), built from source by this crate's build script for <arch>-unknown-uefi of the arch kayfabe is built for, and embedded: KF_GOP_EFI and pack_kf_gop. No compiled binary is committed (docs/OWNER_RULINGS.md §K). docs/design/V3_DISPLAY.md §4.11."
version.workspace = true
edition.workspace = true
license.workspace = true

# ★ Why a crate of its own, and not kf-oprom (which held the committed blob until 2026-10-03): see
# build.rs's docs. In one line — kf-oprom is pure and the firmware itself depends on it, so the
# nested build belongs to a crate nothing guest-side depends on.

[dependencies]
kf-oprom.workspace = true

[build-dependencies]
# The build script refuses a driver kf3 would not serve (`kf_oprom::pe::check`), by name, at build
# time — the same check `pack` applies at realize.
kf-oprom.workspace = true

[lints]
workspace = true
