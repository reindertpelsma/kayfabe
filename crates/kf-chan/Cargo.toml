[package]
name = "kf-chan"
description = "v3 channels: passthrough birth, TRANSLATED execution (kernel CE pushbuffers rewritten onto the identity window and run on the real engine), VMM-executed emulated channels (§37), completions as host events. Never a CPU executor."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
kf-abi.workspace = true
kf-host.workspace = true
kf-linux-raw.workspace = true
kf-trap.workspace = true
kf-core.workspace = true
kf-chip.workspace = true

[features]
# Test-only: deliberate defects of the lifecycle machine, for the mutation checks
# (`tests/user_lifecycle_mutants.rs`, `docs/design/V3_USER_RING_LIFECYCLE_20261016.md` section 8).
# Never enabled by another crate.
lifecycle-mutants = []
# Test-only: the schedule-chaos hook points of `kf-trap` / `kf-core` / `worker.rs` (`tests/relay_stress.rs`; the hooks do
# not exist without it) and nothing else. Never enabled by another crate.
chaos-hooks = ["kf-core/chaos-hooks", "kf-trap/chaos-hooks"]

[dev-dependencies]
# Test builds of this crate enable the schedule-chaos hook points (`tests/relay_stress.rs`); no normal build does.
kf-chan = { path = ".", features = ["chaos-hooks"] }

[lints]
workspace = true
