[package]
name = "kayfabe-mocks"
# ⊘ This description said "Test-only; never a production dependency" and that was FALSE,
# and two other files cited it as a reason. `cargo tree -e normal` puts this crate on
# NORMAL edges under `kayfabe-chips` (whose `Ad10xArch`/`Gh100Arch` compose a `MockArch`
# for every non-GSP seam) and under `kayfabe-crec` — so `kayfabe-qemu-raw`, the crate that
# builds the shipped archive, links it. Making the sentence true again means moving that
# composition, which is a shape change; until then the manifest says what is so.
# See `docs/design/mock_fidelity_audit.md` finding G.
description = "Deterministic in-process mock adapters for every port (MockVmm, MockArch, MockRmBackend, MockIsolate) — the GPU-free test harness of mode2_rust_testing_strategy.md §4. Intended for tests; NOT test-only in fact — kayfabe-chips depends on it on a normal edge, so it is in the shipped archive's graph."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
kayfabe-util.workspace = true
kayfabe-arch.workspace = true
# ★ For `WireClassArch` ONLY, and only for its class ids. Decision #2's quarantine says
# every NVIDIA constant lives in `kayfabe-abi`; a mock that needed `NV01_ROOT` would
# otherwise transcribe `0x0` a fourth time, in the one crate whose whole point is that
# its encodings are made up. So it consumes the real constants rather than copying them.
kayfabe-abi.workspace = true
kayfabe-vmm.workspace = true
kayfabe-isolate.workspace = true

[lints]
workspace = true
