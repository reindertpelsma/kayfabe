[package]
name = "kayfabe-mocks"
description = "Deterministic in-process mock adapters for every port (MockVmm, MockArch, MockRmBackend, MockIsolate) — the GPU-free test harness of mode2_rust_testing_strategy.md §4. Test-only; never a production dependency."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
kayfabe-util.workspace = true
kayfabe-arch.workspace = true
# ★ For `WireClassArch` ONLY, and only for its class ids. Decision #2's quarantine says
# every NVIDIA constant lives in `kayfabe-abi`; a mock that needed `NV01_ROOT` would
# otherwise transcribe `0x0` a fourth time, in the one crate whose whole point is that
# its encodings are made up. So it consumes the real constants rather than copying them.
kayfabe-abi.workspace = true
kayfabe-vmm.workspace = true
kayfabe-isolate.workspace = true

[lints]
workspace = true
